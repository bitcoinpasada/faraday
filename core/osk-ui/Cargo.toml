[package]
name = "osk-ui"
version = "0.1.0"
description = "Canvas, text, fonts, geometry, tokens, layout context, and the icon and keyboard widgets, no_std + alloc"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
osk-shell-api = { path = "../osk-shell-api" }
# The QR quiet zone (`tokens::QR_QUIET_ZONE`); the decoder and its `std` stay out.
osk-codec = { path = "../osk-codec", default-features = false }
tiny-skia.workspace = true
# The count of costly work (`osk_crypto::work`): a canvas blurred or
# copied whole.
osk-crypto = { path = "../osk-crypto" }

[lints]
workspace = true
