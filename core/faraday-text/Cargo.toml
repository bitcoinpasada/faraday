[package]
name = "faraday-text"
version = "0.1.0"
description = "Heap text that wipes itself: one buffer that is zeroed when it grows, is cleared or is dropped"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Wiping the buffer (docs/deps/zeroize.md) and the constant-time equality of a secret
# (docs/deps/subtle.md).
zeroize = { workspace = true, features = ["alloc"] }
subtle.workspace = true

[lints]
workspace = true

[package.metadata.faraday]
layer = "domain"
no_std = true
