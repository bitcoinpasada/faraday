[package]
name = "faraday-codec"
version = "0.1.0"
description = "QR payloads: QR encode and decode, SeedQR, BC-UR, payload classification; no_std + alloc"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = ["decode"]
# QR decoding from camera luma through `rqrr`, which needs `std`
# (`docs/deps/rqrr.md`). Everything else in the
# crate is `no_std`.
decode = ["dep:rqrr"]

[dependencies]
faraday-bip = { path = "../faraday-bip" }
faraday-crypto = { path = "../faraday-crypto" }
bitcoin.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
rqrr = { workspace = true, optional = true }

[dev-dependencies]
# A token that counts nothing, for the tests (docs/COMPUTE.md §3).
faraday-crypto = { path = "../faraday-crypto", features = ["unchecked"] }
# Tests only: the PNG decoder the shells and the disk process read
# pictures with, to read back what `png` writes.
png.workspace = true

[lints]
workspace = true
