[package]
name = "faraday-files"
version = "0.2.0"
description = "A stick's files as Faraday reads and writes them, on a folder or a FAT volume: listing, reading, writing with read-back, vault write-back, QR codes from pictures, and the disk process's pipe protocol"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-fat = { path = "../faraday-fat" }
# The words for faraday-fat's refusals (`fat_text`).
faraday-strings = { path = "../faraday-strings" }
faraday-codec = { path = "../faraday-codec" }
# The count of costly work (`faraday_crypto::work`): a PNG decoded.
faraday-crypto = { path = "../faraday-crypto" }
png.workspace = true
faraday-text = { path = "../faraday-text" }
zeroize = { workspace = true, features = ["alloc"] }
subtle.workspace = true

[lints]
workspace = true

[package.metadata.faraday]
layer = "domain"
