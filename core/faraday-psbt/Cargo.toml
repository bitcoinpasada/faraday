[package]
name = "faraday-psbt"
version = "0.1.0"
description = "PSBT (BIP-174) parsing, inspection, policy warnings, signing and finalization for OpenSignerKit, no_std + alloc"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
faraday-bip = { path = "../faraday-bip" }
faraday-crypto = { path = "../faraday-crypto" }
bitcoin.workspace = true
miniscript.workspace = true

[dev-dependencies]
# A token that counts nothing, for the tests (docs/COMPUTE.md §3).
faraday-crypto = { path = "../faraday-crypto", features = ["unchecked"] }
serde_json.workspace = true

[lints]
workspace = true
