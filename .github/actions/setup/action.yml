# What every job of the check needs before it runs its part
# (.github/workflows/check.yml): build output on the runner's larger disk,
# the system packages the tests run against, the toolchain
# rust-toolchain.toml names, and the tools the check uses at the versions
# this file gives. A job that compiles names its compiled dependencies,
# restored here.
name: setup
description: The check's toolchain and tools
inputs:
  deps:
    description: The name this job's compiled dependencies are cached under, if any
    default: ""
runs:
  using: composite
  steps:
    # The one place the tools' versions are written (check.yml takes them from here); TOOLS names them in the tools cache's key.
    - name: The tools' versions
      shell: bash
      run: |
        {
          echo "JUST_VERSION=1.58.0"
          echo "NEXTEST_VERSION=0.9.146"
          echo "DENY_VERSION=0.20.2"
          echo "VET_VERSION=0.10.2"
          echo "TOOLS=just-1.58.0-nextest-0.9.146-deny-0.20.2-vet-0.10.2"
        } >> "$GITHUB_ENV"

    # Mounted, not linked: target/ stays a folder, so the test jobs can
    # unpack the archive into it (tar refuses to write through a link that
    # leads outside the folder it unpacks into).
    - name: Build output on the runner's larger disk
      shell: bash
      run: |
        mkdir -p target
        if sudo mkdir -p /mnt/target; then
          sudo chown "$(id -u):$(id -g)" /mnt/target
          sudo mount --bind /mnt/target target
        fi
        df -h . target

    # The programs the tests check Faraday against or make their inputs with
    # (GnuPG, Sequoia, paperkey, OpenSSL, sbsigntool, mtools, dosfstools).
    # Each try has a time limit; after a failed one, a second mirror (apt-install.sh).
    - name: System packages
      shell: bash
      run: >-
        "$GITHUB_ACTION_PATH/apt-install.sh"
        gnupg sq paperkey openssl sbsigntool mtools dosfstools

    - name: Rust toolchain
      shell: bash
      run: |
        rustup show active-toolchain || rustup toolchain install

    # Restored here, saved only by save-deps on a push to next: a branch's run
    # never writes it (copies saved from branches would push the caches out of
    # GitHub's size limit).
    - id: tools
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/just
          ~/.cargo/bin/cargo-nextest
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-vet
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-${{ runner.os }}-${{ env.TOOLS }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ env.TOOLS }}-

    - name: The key of the tools cache
      shell: bash
      # For save-deps, which saves it on next when this exact key was not there.
      run: |
        echo "TOOLS_KEY=cargo-${{ runner.os }}-${{ env.TOOLS }}-${{ hashFiles('Cargo.lock') }}" >> "$GITHUB_ENV"
        echo "TOOLS_HIT=${{ steps.tools.outputs.cache-hit }}" >> "$GITHUB_ENV"

    - name: The key of this job's compiled dependencies
      if: inputs.deps != ''
      shell: bash
      # Worked out here, while target/ is empty: save-deps uses the same one.
      run: echo "DEPS_KEY=deps-${{ runner.os }}-${{ inputs.deps }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.github/actions/save-deps/*') }}" >> "$GITHUB_ENV"

    - name: This job's compiled dependencies
      if: inputs.deps != '' && github.event.inputs.uncached != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ env.DEPS_KEY }}
        # A changed manifest finds the last dependencies saved for this job; cargo
        # rebuilds only what changed, and save-deps saves the new set on next.
        restore-keys: |
          deps-${{ runner.os }}-${{ inputs.deps }}-

    - name: The check's tools
      shell: bash
      run: |
        have() { "$@" >/dev/null 2>&1; }
        have just --version || cargo install --locked "just@${JUST_VERSION}"
        have cargo nextest --version || cargo install --locked "cargo-nextest@${NEXTEST_VERSION}"
        have cargo deny --version || cargo install --locked "cargo-deny@${DENY_VERSION}"
        have cargo vet --version || cargo install --locked "cargo-vet@${VET_VERSION}"
        just --version; cargo nextest --version; cargo deny --version; cargo vet --version
