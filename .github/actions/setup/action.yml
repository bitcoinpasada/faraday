# What every job of the check needs before it runs its part
# (.github/workflows/check.yml): build output on the runner's larger disk,
# the toolchain rust-toolchain.toml names, the tools DEVELOPING.md §1
# names at the versions the workflow gives, and, where asked, the system
# packages the tests run against. A job that
# compiles names its compiled dependencies, restored here (docs/decisions/F212.md).
name: setup
description: The check's toolchain and tools
inputs:
  packages:
    description: Install the system packages the tests run against
    default: "false"
  valgrind:
    description: Install valgrind, which the instruction counts of lint-op-cost need
    default: "false"
  deps:
    description: The name this job's compiled dependencies are cached under, if any
    default: ""
runs:
  using: composite
  steps:
    # Mounted, not linked: target/ stays a folder, so the test jobs can
    # unpack the archive into it (tar refuses to write through a link that
    # leads outside the folder it unpacks into).
    - name: Build output on the runner's larger disk
      shell: bash
      run: |
        mkdir -p target
        if sudo mkdir -p /mnt/target; then
          sudo chown "$(id -u):$(id -g)" /mnt/target
          sudo mount --bind /mnt/target target
        fi
        df -h . target

    - name: System packages
      if: inputs.packages == 'true'
      shell: bash
      # Each try has a time limit; after a failed one, a second mirror (apt-install.sh).
      run: >-
        "$GITHUB_ACTION_PATH/apt-install.sh"
        gnupg sq paperkey openssl sbsigntool mtools dosfstools

    - name: Valgrind
      if: inputs.valgrind == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/apt-install.sh" valgrind'

    - name: Rust toolchain
      shell: bash
      run: |
        rustup show active-toolchain || rustup toolchain install

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/just
          ~/.cargo/bin/cargo-nextest
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-vet
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-${{ runner.os }}-${{ env.TOOLS }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'faraday/fuzz/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ env.TOOLS }}-

    - name: The key of this job's compiled dependencies
      if: inputs.deps != ''
      shell: bash
      # Worked out here, while target/ is empty: save-deps uses the same one.
      run: echo "DEPS_KEY=deps-${{ runner.os }}-${{ inputs.deps }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.github/actions/save-deps/*') }}" >> "$GITHUB_ENV"

    - name: This job's compiled dependencies
      if: inputs.deps != '' && github.event.inputs.uncached != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ env.DEPS_KEY }}

    - name: The check's tools
      shell: bash
      run: |
        have() { "$@" >/dev/null 2>&1; }
        have just --version || cargo install --locked "just@${JUST_VERSION}"
        have cargo nextest --version || cargo install --locked "cargo-nextest@${NEXTEST_VERSION}"
        have cargo deny --version || cargo install --locked "cargo-deny@${DENY_VERSION}"
        have cargo vet --version || cargo install --locked "cargo-vet@${VET_VERSION}"
        just --version; cargo nextest --version; cargo deny --version; cargo vet --version
