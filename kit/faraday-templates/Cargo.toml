[package]
name = "faraday-templates"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
faraday-organisms = { path = "../faraday-organisms" }
faraday-molecules = { path = "../faraday-molecules" }
faraday-atoms = { path = "../faraday-atoms" }
faraday-tokens = { path = "../faraday-tokens" }
faraday-strings = { path = "../../core/faraday-strings" }

[lints]
workspace = true

[package.metadata.faraday]
layer = "kit"
level = "templates"
reexports = ["faraday_atoms::Ui", "faraday_atoms::Pressed", "faraday_atoms::Shown", "faraday_atoms::PlainRef", "faraday_atoms::Offered", "faraday_atoms::Drawn", "faraday_atoms::Style", "faraday_atoms::Laid", "faraday_atoms::Placement", "faraday_organisms::content::Block", "faraday_organisms::content::Content", "faraday_organisms::content::Organism", "faraday_organisms::snackbar::SnackbarModel"]
