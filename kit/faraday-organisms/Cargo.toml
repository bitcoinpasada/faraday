[package]
name = "faraday-organisms"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
faraday-molecules = { path = "../faraday-molecules" }
faraday-draw = { path = "../faraday-draw" }
faraday-atoms = { path = "../faraday-atoms" }
faraday-tokens = { path = "../faraday-tokens" }
faraday-strings = { path = "../../core/faraday-strings" }
faraday-guide = { path = "../../core/faraday-guide" }
faraday-codec = { path = "../../core/faraday-codec" }
faraday-text = { path = "../../core/faraday-text" }

[dev-dependencies]
faraday-atoms = { path = "../faraday-atoms", features = ["testing"] }

[lints]
workspace = true

[package.metadata.faraday]
layer = "kit"
level = "organisms"
reexports = ["faraday_atoms::Ui", "faraday_atoms::Pressed", "faraday_atoms::kind_probe", "faraday_atoms::Shown", "faraday_atoms::PlainRef", "faraday_atoms::Offered", "faraday_atoms::Drawn", "faraday_atoms::Style", "faraday_atoms::Laid", "faraday_atoms::Placement", "faraday_draw::icons::Icon", "faraday_atoms::Icon", "faraday_atoms::TipKind", "faraday_molecules::destination::Badge", "faraday_atoms::button::ButtonModel", "faraday_atoms::field::FieldModel", "faraday_atoms::hold::HoldModel", "faraday_molecules::address::AddressModel", "faraday_molecules::appearance::AppearanceModel", "faraday_molecules::appearance::Segments", "faraday_molecules::appearance::TextSizeModel", "faraday_molecules::chips::ChipsModel", "faraday_molecules::chips::ThemeChip", "faraday_molecules::time_zone::TimeZoneKind", "faraday_molecules::time_zone::TimeZoneModel", "faraday_molecules::buttons::ButtonsModel", "faraday_molecules::caution::CautionModel", "faraday_molecules::caution::Size", "faraday_molecules::flow_text::FlowText", "faraday_molecules::options::ChoiceModel", "faraday_molecules::options::OptionRow", "faraday_molecules::pads::PadModel", "faraday_molecules::pass::PassModel", "faraday_molecules::pass::PassView", "faraday_molecules::qr::QrModel", "faraday_molecules::row::RowModel", "faraday_molecules::status::BusyModel", "faraday_molecules::words::WordGridModel", "faraday_molecules::guide_block::GuideBlockModel", "faraday_molecules::guide_block::GuideBody", "faraday_molecules::guide_block::GuideGroup", "faraday_molecules::guide_block::GuideLook", "faraday_molecules::guide_block::GuideNone", "faraday_molecules::guide_block::GuidePage", "faraday_molecules::guide_block::GuideSection", "faraday_molecules::tabs::Tab", "faraday_molecules::tabs::TabKind", "faraday_molecules::tabs::TabsModel"]
