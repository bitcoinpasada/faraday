[package]
name = "faraday-organisms"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
faraday-molecules = { path = "../faraday-molecules" }
faraday-atoms = { path = "../faraday-atoms" }
faraday-tokens = { path = "../faraday-tokens" }
faraday-strings = { path = "../../core/faraday-strings" }
faraday-guide = { path = "../../core/faraday-guide" }
faraday-codec = { path = "../../core/faraday-codec" }
faraday-text = { path = "../../core/faraday-text" }

[lints]
workspace = true

[package.metadata.faraday]
layer = "kit"
level = "organisms"
reexports = ["faraday_atoms::Ui", "faraday_atoms::Pressed", "faraday_atoms::Shown", "faraday_atoms::PlainRef", "faraday_atoms::Offered", "faraday_atoms::Drawn", "faraday_atoms::Style", "faraday_atoms::Laid", "faraday_atoms::Placement", "faraday_draw::icons::Icon", "faraday_atoms::Icon", "faraday_atoms::button::ButtonModel", "faraday_atoms::field::FieldModel", "faraday_atoms::hold::HoldModel", "faraday_molecules::address::AddressModel", "faraday_molecules::caution::CautionModel", "faraday_molecules::flow_text::FlowText", "faraday_molecules::options::ChoiceModel", "faraday_molecules::pads::PadModel", "faraday_molecules::pass::PassModel", "faraday_molecules::qr::QrModel", "faraday_molecules::row::RowModel", "faraday_molecules::status::BusyModel", "faraday_molecules::words::WordGridModel"]
