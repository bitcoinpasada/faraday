reason = "The Starter's xz decoder. No established pure-Rust streaming xz decoder exists, and the Starter's design (`docs/STARTER.md`) rules out the C library liblzma; what it writes is checked against the signed manifest's SHA-256 and size."
decision = "F180"

[[not_established]]
crate = "rqrr"
reason = "The camera's QR decoder, vendored and patched against panics on hostile frames (third_party/rqrr/PATCHES.md): the only maintained pure-Rust QR decoder. What it reads is untrusted input that Faraday's parsers check. The same panic is reported upstream as rqrr's issue 54."
decision = "F180"

[[not_established]]
crate = "quick-xml"
reason = "The tokenizer under the XML of a KDBX vault file. It does no cryptography and has no outside review; its default features are off and it is already in the dependency graph. Which references are refused, the nesting cap and everything else the reader does are Faraday's own."
decision = "F213"
