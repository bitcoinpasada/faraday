completeness = "Full: the account key is derived here; the script is read through a wallet policy"

[[row]]
id = "legacy-multisig"
section = 2
what = "Legacy multisig `sh(sortedmulti)` at `m/45'`"
completeness = "A convention, not BIP 45's scheme; the account key is derived as Single key's are"
uses = ["derive", "descriptor", "address"]
standard = "BIP 45 (Complete) defines `m/45'/cosigner/change/index`; Faraday uses `m/45'` as an account with `/<0;1>/*`, the Coldcard and Unchained export (a convention)"
own = "`m/45'` is an account path with no account number to choose. Neutral; no decision."

[[row]]
id = "bip87-multisig"
section = 2
what = "Multisig key at BIP 87's path, `wsh`, `sh(wsh)`, `sh` and `tr(H, sortedmulti_a)` (`faraday/faraday-core/src/create.rs`, `NewKind::path_with`)"
completeness = "Full for the path: `m/87'/coin'/account'`, the script left to the descriptor, offered for each multisig kind Create makes beside its own path; the key is derived as any path's is"
uses = ["derive", "descriptor"]
standard = "BIP 87 (Complete, vendored); BIP 32 (Deployed)"
own = "The path is not the default: BIP-48's, or `m/45'`, is ticked at entry. Neutral; no decision. A wallet at BIP 87 gives its own keys' `ur:crypto-account` code and signed BIP 129 key record at `m/87'/coin'/account'`; neither format limits the origin path. Neutral; no decision."

