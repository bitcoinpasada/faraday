[action.secrets]
reveal = "none"
constant_time = "The header's and every block's HMAC are compared in constant time (`verify_slice`); Argon2, SHA-2, ChaCha20 and AES-CBC state nothing more."
wiped = "The composite key, the Argon2 output, the encryption key, the HMAC base and every block key are Secret values wiped on drop; the decrypted body, the inflated body, the document and the attachments are Zeroizing buffers, decrypted and unpadded in place; the Argon2 memory is overwritten before release. Not wiped: the SHA-256 and SHA-512 hashers' state, the ChaCha20 and AES-CBC cipher states and the AES key schedule, the inflater's own state, and the NFC normaliser's buffer of combining marks. The passphrase's first SHA-256 is a Zeroizing value; a seal works out the plaintext length before the buffer is grown, so a refusal as too small leaves no copy."

