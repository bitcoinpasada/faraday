through = [{ library = "base16ct", crate = "core/faraday-crypto" }]
adds = "Each conversion is given only for Reveal::PaperForm, and only when its result, read back through the standard's own decoder (hex, the strict xprv importer, SLIP-39's share, every share of a set parsed before any recovery and then a first and a last qualifying subset each recovered, codex32's parse of every share and recover from the first k and the last k), gives the key's master fingerprint; otherwise nothing is returned. A key's words written in another form are read back to the same entropy on the same list, so the same words and the same fingerprint, with no PBKDF2 run; SeedQR forms take English 12 or 24 words, and 4-letter starts English. A key with words is refused for SLIP-39 and codex32; SLIP-39 holds 16 and 32 bytes only; Seed XOR is given for a key on the English list only, the list its parts are restored on. A codex32 set of k above 0 takes its identifier from the randomness passed in, never the one of the key's fingerprint nor of its own set, so two sets of one key are not one set; the secret alone keeps the fingerprint's. A SLIP-39 set is made with an empty passphrase, the extendable flag set and iteration exponent 1, its identifier and shares from the randomness passed in, and a shape the split refuses is refused."

