through = []
adds = "The typed shares are held as a transient value, never a key, and each is checked against the others as it is typed (one set; no member typed twice; no more members than the group's threshold). A share at a member index is derived from one group's quorum and read back by swapping it in for one of the quorum, which must give back, word for word, the share displaced; where the whole set is typed the swapped set must also recover the same EMS and parameters. A new set is split from the EMS recovered from the whole set's quorum: with the extendable flag set it takes a new identifier and the old one is refused, with it clear the identifier stays; every share is parsed and every member of every group takes part in a qualifying subset that must recover the same EMS and parameters. No passphrase is taken and nothing is decrypted."

