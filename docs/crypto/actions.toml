[[construction]]
id = "vault"
title = "How the vault is built"
learn = "faraday:vaults"
actions = ["vault-create", "vault-unlock", "vault-seal"]

[[construction.section]]
heading = "Two layers"

[[construction.section.para]]
text = "A vault has two layers. The lock is the passphrase, Argon2id, ChaCha20 and HMAC. It is what keeps secrets safe. All of it is published, and each algorithm comes from an established library."

[[construction.section.para]]
text = "The plumbing is the code that lays the file out, reads it back and decides which field holds what. Most of what is Faraday's own is here. A bug in the plumbing usually means a file that does not open. The exception is in writing, under Security."

[[construction.section]]
heading = "The file"

[[construction.section.para]]
text = "A vault is one KDBX 4 file, the database format KeePass writes, under one passphrase. Faraday writes it in one shape and reads the shapes a KeePass app saves within limits."

[[construction.section.para]]
text = "The file holds a plaintext of a whole number of {f:{c:faraday/faraday-vault/src/file.rs::STEP} / 1024} KiB steps, from one step to {f:{c:core/faraday-codec/src/vault_file.rs::MAX_PLAIN} / 1048576} MiB, framed in blocks and wrapped in a header. A vault is as small as its contents allow, and no size is chosen."

[[construction.section.para]]
text = "The file's name ends in .kdbx. There is one passphrase and no slots: a file does not hide how many passphrases exist, because there is one."

[[construction.section]]
heading = "The keys"

[[construction.section.para]]
text = "The passphrase is put in Unicode Normalization Form C (UAX #15), and its UTF-8 bytes are hashed with SHA-256 twice to make KDBX 4's composite key. Then \"é\" typed as one character (U+00E9) and as \"e\" with a combining accent (U+0065 U+0301) open the same vault."

[[construction.section.para]]
text = "Argon2id version {v:argon2-version} (RFC 9106) stretches the composite key under the header's salt, memory, passes and lanes to {v:argon2-out} bytes; SHA-256 and SHA-512 over that and the header make the encryption key and the HMAC base, and each block has its own HMAC key."

[[construction.section.para]]
text = "Create a vault offers {len:faraday/faraday-vault/src/file.rs::STEPS_KIB|words} memory steps, from {f:{c:faraday/faraday-vault/src/file.rs::FIRST_STEP_KIB} / 1024} MiB to {f:{c:faraday/faraday-vault/src/file.rs::LAST_STEP_KIB} / 1024 / 1024} GiB, each at {c:faraday/faraday-vault/src/file.rs::PASSES} passes and {c:faraday/faraday-vault/src/file.rs::LANES} lanes. The lanes do not change the work a guess costs."

[[construction.section]]
heading = "Sealing and opening"

[[construction.section.para]]
text = "The body is the database's XML, padded to the file's size with line feeds and encrypted with ChaCha20, in blocks of {c:faraday/faraday-vault/src/file.rs::BLOCK} bytes each with its own HMAC-SHA-256 over its length and bytes. The header carries its own SHA-256 and HMAC-SHA-256."

[[construction.section.para]]
text = "The reader checks the version, the header's fields, the cost against its limits and the file's length before any memory is asked for, then derives the keys once. Every block's HMAC is checked before its bytes are used; a missing or extra block, a changed byte and a cut file are refused."

[[construction.section.para]]
text = "A seal writes the file again with a fresh salt, fresh IVs and a fresh inner key, all from one answer the caller draws, and a seal count one more than the last with the time."

[[construction.section.para]]
text = "A file a KeePass app saved with another cipher or KDF the reader takes, or other settings, opens, and its next seal writes it in Faraday's shape; only a format mark other than the one this build writes or a Meta that reads ambiguously holds a vault read only."

[[construction.section]]
heading = "What it promises"

[[construction.section.para]]
text = "Without the passphrase, the file shows its header, which states the cost and the salt, and a length that is a whole number of {f:{c:faraday/faraday-vault/src/file.rs::STEP} / 1024} KiB steps. Nothing in the body can be read or changed without the passphrase: the header's and every block's HMAC fail first."

[[construction.section]]
heading = "What it does not promise"

[[construction.section.para]]
text = "Offline guessing. Anyone with the file has its salt and cost and can try passphrases on their own computers. Each guess costs one Argon2id at the vault's cost."

[[construction.section.para]]
text = "Rollback. An older copy of a vault still opens. Someone who can write to the stick can put an older copy back; they cannot read or change anything in it. The seal count is how an older copy is told from a newer one."

[[construction.section.para]]
text = "A vault's size and its seal count are in the clear or can be read by whoever opens it; the cost and salt are in the header."

[[construction.section.para]]
text = "Independent review. Faraday's reader and writer are its own and have been read by pykeepass, keepassxc-cli and keepass-rs, in the vault cross-check area, over the files they write and the files those programs write."

[[construction.section.para]]
text = "Availability. A changed byte anywhere in the file fails its HMAC and the vault does not open; a backup is how a damaged vault is recovered."

[[construction.section]]
heading = "What is Faraday's own, and why"

[[construction.section.para]]
text = "The format and the algorithms are published. These pieces are not. For each: what it does, what could replace it, and why it is not taken."

[[construction.section.para]]
piece = "KDBX reader and writer"
does = "Reads and writes the file vault: the header, the block stream, the cipher steps and the XML"
instead = "the keepass crate (keepass-rs)"
why = "It drops the XML elements it does not model, which would disturb what a KeePass app wrote into the file, and it draws a save's randomness itself, with no way to pass the session's in. No audit of it is one Faraday's dependency checks trust. It is used in the tests as an outside reader and writer, never in what ships."

[[construction.section.para]]
piece = "Faraday's names inside the vault"
does = "Decides which KeePass field holds a seed's words, a wallet or a GPG key, and keeps Faraday's settings in custom data under names that start with faraday"
instead = "nothing, since no standard puts a Bitcoin seed in KeePass"
why = "Unavoidable. An item the reader does not expect is named Unreadable and never used."

[[construction.section.para]]
piece = "Padding after the XML"
does = "Keeps each file at one of its sizes, by adding line feeds after the XML's closing tag"
instead = "nothing, since KDBX has no padding of its own"
why = "It uses what XML already allows after its last tag, so a KeePass app reads the padded file as any other. A KeePass app that saves the file drops the padding."

[[construction.section.para]]
piece = "OpenPGP code for the QR vault"
does = "Writes and reads the three packets a QR vault is made of"
instead = "rPGP (pgp) or Sequoia"
why = "Each brings every algorithm OpenPGP has had, with all the libraries those need, for a message that uses AES and OCB alone. rPGP has been audited by outside reviewers, but none of those audits is one Faraday's dependency checks trust, so each library it brings would be Faraday's own to vet."

[[construction.section.para]]
piece = "HKDF (RFC 5869)"
does = "Turns one key into others; in the vault only the QR vault uses it"
instead = "the hkdf crate"
why = "It leaves the intermediate key and each output block in freed memory unwiped; Faraday's own wipes them."

[[construction.section.para]]
piece = "QR vault contents"
does = "The short TOML inside the code, padded to one length, holding one seed, share, passphrase or note"
instead = "nothing, since no standard exists for an encrypted seed QR that other tools read"
why = "Unavoidable. The cross-check reads the contents with an outside TOML parser."

[[construction.section]]
heading = "Security"

[[construction.section.para]]
text = "What protects secrets is all published. Someone with the file faces Argon2id at the vault's memory step, then the cipher. None of that is Faraday's design."

[[construction.section.para]]
text = "The main risk is parsing. The device reads files from outside, and a bug in a reader could crash it, hang it, or make it accept or refuse a file wrongly. The guards: a file's memory, passes and lanes are checked against limits before any memory is asked for; every block's HMAC is checked before its bytes are used; anything unexpected is refused, never guessed at; the XML reader refuses a DOCTYPE and an entity it does not know; each reader has a fuzz target; and pykeepass, keepassxc-cli and keepass-rs read what Faraday writes, and Faraday reads what they write."

[[construction.section.para]]
text = "The QR vault's reader checks the Argon2 cost against the same limits right after the key packet, before the data packet is read, and refuses every packet it does not use."

[[construction.section.para]]
text = "The one subtle risk is in writing. If Faraday's code reused a value it should draw fresh, a nonce for example, the file would still open everywhere, so the cross-check would not notice, but the encryption would be weaker. A library carries the same risk in its own code. The guard: every seal draws its bytes from one call for the session's randomness, and the specification counts every byte that call returns."

[[construction.section.para]]
text = "The library trade. A large audited library is more code that Faraday did not write and more to vet, looked at by others. A small piece of Faraday's own is less code and nothing extra to vet, looked at by Faraday, its tests and three outside programs. For one file format the small piece is taken, and keepass-rs would also give up two requirements of the file vault: that what a KeePass app wrote is kept, and that the session's randomness is the only source."

[[construction.section.para]]
text = "Key commitment. Every HMAC in a file vault is keyed from the key its passphrase makes, so no second passphrase opens the file to other contents."

[[construction.section.para]]
text = "OCB does not commit to its key. A QR vault someone else made could be built to open to two contents under two passphrases. Faraday makes every QR vault under one passphrase."

[[construction.section.para]]
text = "Later work. Faraday does not yet wipe every copy of a key left in freed memory, and Argon2id's later passes read memory at places the passphrase decides, which a program on the same computer could time. The device is offline and powered off after use, so both wait."

[[construction.section]]
heading = "Opening it elsewhere"

[[construction.section.para]]
text = "This shows the file is standard, and is not the way to use a vault. The cross-check opens a file vault with pykeepass, keepassxc-cli and keepass-rs, and Faraday opens what they write."

[[construction.section.para]]
text = "A QR vault is read by Sequoia's sq and by rPGP in the cross-check. GnuPG cannot read a QR vault: it follows LibrePGP, not RFC 9580."

[[construction.section.para]]
text = "Unlocking a vault on a computer that is online shows its seed on that computer. It is a last resort, for when Faraday is gone and the seed is needed back. Move the funds to a new seed afterwards and treat the old seed as exposed. The way to open a vault is Faraday on the offline device."

[construction.review]
fingerprint = "865f423360ac4c9998c0bd6aa3b7dca9af0ff79e560eef3a229e4792b8e36d83"
reviewed = "2026-11-05"

[[construction]]
id = "passphrase-strength"
title = "Passphrase strength"
learn = "faraday:vaults"
actions = ["vault-create"]

[[construction.section]]
heading = "Words from dice"

[[construction.section.para]]
text = "A passphrase of words drawn by dice from a list carries log2 of the list's length in bits for every word. Faraday has the {len:core/faraday-bip/src/diceware/mod.rs::ALL|words} lists the EFF publishes (EFF word lists):"

[[construction.section.para]]
table = "diceware-bits"
words = [4, 10]

[[construction.section.para]]
text = "The bits hold when every word is drawn by fair dice or by the computer's randomness, and not when a person chooses a word."

[[construction.section]]
heading = "What Argon2id adds"

[[construction.section.para]]
text = "Each guess costs one Argon2id at the vault's memory and passes, on the guesser's own hardware. Faraday states that work as log2(memory in KiB × passes) bits, which Create a vault shows beside each cost. The memory of the vaults Faraday makes ranges over a factor of {f:{c:faraday/faraday-vault/src/file.rs::LAST_STEP_KIB} / {c:faraday/faraday-vault/src/file.rs::FIRST_STEP_KIB}}, which is {f:log2({c:faraday/faraday-vault/src/file.rs::LAST_STEP_KIB} / {c:faraday/faraday-vault/src/file.rs::FIRST_STEP_KIB})} bits; one more word from the large list is {f:log2({len:core/faraday-bip/src/diceware/large.rs::WORDS})}. The figure counts work, not how much more memory costs a guesser than time, and it gives no time per guess."

[[construction.section]]
heading = "Other passphrases"

[[construction.section.para]]
text = "A person may use any passphrase. Its strength is then theirs to ensure: Faraday does not measure a typed passphrase. A short passphrase, or one used anywhere else, is not protected by any cost."

[[construction.section]]
heading = "Where to learn more"

[[construction.section.para]]
text = "The EFF's page on dice-generated passphrases, eff.org/dice."

[[construction.section.para]]
text = "Arnold Reinhold's Diceware page, where the method began, theworld.com/~reinhold/diceware.html."

[[construction.section.para]]
text = "NIST Special Publication 800-63B, Digital Identity Guidelines, on what makes a password strong."

