[[action]]
id = "words-read"
name = "Read the words"
action = "Reads seed words typed, pasted or scanned, and checks their count and checksum."
row = "bip39"
standards = [
  "BIP 39",
]
learn = "words"
screens = [
  "Entry",
  "Restore",
  "Files",
  "Family",
]
functions = [
  "core/faraday-bip/src/bip39.rs::Mnemonic::parse",
  "core/faraday-bip/src/bip39.rs::Mnemonic::from_indices",
  "faraday/faraday-keys/src/words.rs::parse",
  "core/faraday-bip/src/bip39.rs::Language::typed",
  "core/faraday-bip/src/bip39.rs::Language::candidates_typed",
  "core/faraday-bip/src/bip39.rs::Language::candidates_pinyin",
  "core/faraday-bip/src/bip39.rs::Language::candidates_zhuyin",
  "core/faraday-bip/src/bip39.rs::Language::word_readings",
  "core/faraday-bip/src/bip39.rs::fold",
  "core/faraday-bip/src/hangul.rs::compose",
  "core/faraday-bip/src/kana.rs::compose",
]
code = [
  "core/faraday-bip/src/bip39.rs::Mnemonic::parse",
  "faraday/faraday-keys/src/words.rs::parse",
]

[action.implementation]
crate = "core/faraday-bip"
libraries = [
  "unicode-normalization",
]
through = [{ library = "sha2", crate = "core/faraday-crypto" }]
adds = "The sentence is read in NFKD and split on Unicode whitespace; the first word not in the list is reported by position; a word typed by pinyin, zhuyin, kana or hangul is composed to the listed word."

[[action.implementation.written_here]]
what = "BIP-39 entry and display: words typed by pinyin, zhuyin, kana or hangul, the last word's candidates, the explorer's view of the checksum (`faraday-bip::bip39`)"
why = "own-specification"
note = "How a person types and sees the words is Faraday's own."
decision = "F178"

[[action.implementation.written_here]]
what = "BIP-39 mnemonics: entropy to words and back, the checksum, a word's place in its list (`faraday-bip::bip39`)"
why = "does-not-fit"
unfit = "bip39 2.2.2 finds a word by a binary search or a scan that stops at it (`find_word`) and packs entropy with a branch on each bit (`from_entropy_in`), so the time it takes follows the secret words"
note = "The Rust BIP-39 library's word lookup takes a time that follows the secret words; Faraday's looks each word up in constant time and is tested against that library and the reference."
decision = "F180"

[action.checked]
vectors = [
  "bip39",
]
tests = [
  "core/faraday-bip/tests/all/vectors.rs::trezor_vectors_all_languages",
  "core/faraday-bip/tests/all/vectors.rs::japanese_vectors",
  "core/faraday-bip/tests/all/vectors.rs::a_sentence_is_read_in_nfkd_whatever_form_it_is_typed_in",
  "core/faraday-bip/tests/all/api.rs::bad_checksum_is_detected",
  "core/faraday-bip/tests/all/api.rs::parse_locates_unknown_words",
  "core/faraday-bip/tests/all/readings.rs::typing_a_reading_finds_the_character_it_names",
]
crosscheck = "bip39"
independence = { class = "outside", author = "python-mnemonic, by Trezor (SatoshiLabs), and bip39_slip39, by the btclib developers (a second reader: wordlists, entropy, indices, checksums and the seed in the ten languages)" }
selftest = [
  "bip39_vector",
  "bip39_japanese_vector",
]
fuzz = [
  "bip39_words",
]
other = [
  "the `bip39` crate as a dev-dependency (`core/faraday-bip/tests/all/crosscheck.rs`)",
]

[action.secrets]
reveal = "none"
constant_time = "A word is found by comparing it with every entry of its list in constant time (subtle), and the entropy's bits are written without a branch; the sentence is gathered by a masked scan, and its length follows the words, as BIP-39 requires; the code states no other timing."
wiped = "The word buffer and the indices are Secret values, zeroized when dropped; the Mnemonic wipes its indices when dropped."

[action.limits]
lines = [
