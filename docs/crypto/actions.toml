[[row]]
id = "bolt11"
section = 5
what = "Lightning invoices, BOLT #11 (`core/faraday-codec/src/bolt11.rs`)"
completeness = "Read only: the fields of an invoice and its signature, nothing paid or made. BOLT #11 makes a bad checksum, a `p`, `h`, `s` or `n` field of another length, a repeated `p` or `s`, no payment hash or payment secret, both or neither of a description and its hash, mixed case, an amount finer than a millisatoshi, a `c`, `x` or `9` field that begins with a zero value and an unknown required feature (anything outside bits 0, 8, 12, 14, 16, 24, 44 and 48) a refusal, and so does Faraday. Faraday is stricter where BOLT #11 leaves a case open: an invoice over 1023 characters, an amount with a leading zero, a repeated `x`, `c`, `m`, `9`, `d`, `h` or `n`, a malformed fallback of a version it defines, an empty route hint or a hop key that is not a curve point, an `n` key that is not on the curve, and a non-zero padding bit in a `p`, `s`, `h`, `n`, `d`, `m`, `r` or `f` field"

