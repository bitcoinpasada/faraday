  "faraday/faraday-payload/src/decode.rs::hash_image",
]

[action.implementation]
crate = "faraday/faraday-payload"
libraries = [
  "sha2",
  "lzma-rust2",
  "getrandom",
]
adds = "The image file is read whole and its SHA-256 compared before anything is written, then read again and decompressed into the writer; success means the writer received exactly the list's size with the list's SHA-256; a developer's image is hashed when confirmed and refused if it changed after; a Pi card is read back and compared with the stream as written, and the SHA-256 of what was read, with the card's own IDs put back where they went (docs/STICK-IDENTITY.md §4.3), must be the list's. A stick is made for its size, not copied (docs/STICK-IDENTITY.md §4.2): only the image's boot partition reaches it, byte for byte with the release's serial; its protective MBR, GPT (new disk and partition GUIDs from getrandom, the data partition to the last usable sector, every CRC-32 worked out again) and its data partition's FAT32 (faraday-fat's formatter, a new serial from getrandom) are written as regions and every region and the boot partition are read back and compared byte for byte; the GUIDs and serials are identities, not secrets. A stick made or keep data from a found image with no boot file signed first checks that the SHA-256 of the image's boot partition is the list's and writes nothing otherwise. Clearing the whole stick first writes zeros over every sector and reads none back. A name given the data partition (docs/STICK-IDENTITY.md §6) is faraday-fat's label write run over the sectors captured, each byte it changed a patch put back the same way."

