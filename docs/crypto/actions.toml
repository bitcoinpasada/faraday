  "Authenticode",
  "RFC 8017",
]
learn = "faraday:checking-written"
screens = [
  "starter:write",
  "starter:confirm",
  "starter:writing",
  "starter:done",
]
functions = [
  "faraday/faraday-sb/src/pe.rs::transplant",
  "faraday/faraday-sb/src/pe.rs::signer",
]
code = ["faraday/faraday-sb/src/pe.rs::transplant"]

[action.implementation]
crate = "faraday/faraday-sb"
libraries = [
  "rsa",
  "sha2",
]
adds = "Only the signature is taken from the person's file: the file written is the release's own bytes with that file's checksum, certificate-table entry and certificate table, so every byte the signature does not cover is the release's; which key signed it is not judged, a computer's db decides that."

[action.checked]
tests = [
  "faraday/shells/starter/tests/all/signed_boot.rs::a_release_boot_file_signed_with_ones_own_db_key_is_written_in_place_of_the_releases",
  "faraday/shells/starter/tests/all/signed_boot.rs::the_same_program_with_one_code_byte_changed_then_signed_is_refused",
  "faraday/shells/starter/tests/all/signed_boot.rs::a_signed_boot_file_with_more_than_one_signature_at_its_end_is_refused",
  "faraday/shells/starter/tests/all/signed_boot.rs::a_signature_that_does_not_hold_is_refused_as_such",
  "faraday/faraday-sb/tests/judged.rs::a_signature_is_moved_onto_the_releases_bytes_only_when_it_is_alone_at_the_end",  "faraday/faraday-sb/tests/judged.rs::pefile_finds_the_certificate_table_where_faraday_put_it_and_the_moved_checksum_is_right",
]
fuzz = ["pe_transplant"]
not_crosschecked = "Judged by images signed by sbsign and osslsigncode and by sbverify (faraday/faraday-sb/tests/judged.rs), not by an F79 area; sbverify fails the test where it is missing."
other = [
  "Real `sbverify` (sbsigntools, outside Faraday) verifies the signature moved onto the release's bytes and refuses it on a changed program (`faraday/faraday-sb/tests/judged.rs`, the transplant test); required, nothing skips it",  "python3-pefile (outside Faraday) finds the certificate table of an image Faraday signs at the offset and length where Faraday appended it, to the end of the file, and reads the checksum and table entry of an image moved onto the release's bytes as the signed copy's, the checksum being the one pefile works out (`faraday/faraday-sb/tests/judged.rs`); required, nothing skips it",
]


[action.secrets]
reveal = "none"
constant_time = "Not applicable: only public images, certificates and signatures are handled."
wiped = "Nothing secret is held."

[action.limits]
lines = [
  "Refuses a file that is not the release's program, an unsigned file, and one whose certificate table is not one signature alone at its end.",
  "The elevated writer reads the file again and refuses it unless it still has the SHA-256 that was chosen.",
]

[[action.own]]
text = "Anything but the release's own bytes with the person's signature is refused by name."
kind = "Conservative"
decision = "F133"

[action.review]
fingerprint = "455b13444b8d8c22bd010ea7102c66754f736324907b84a3fba27852df59290c"
reviewed = "2026-11-03"
places = [
  "docs/decisions/F133.md",
  "docs/learn/faraday/checking-written.md",
]

