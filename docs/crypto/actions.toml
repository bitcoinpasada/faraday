[[construction]]
id = "passphrase-strength"
title = "Passphrase strength"
learn = "faraday:vaults"
actions = ["vault-create"]

[[construction.section]]
heading = "Words from dice"

[[construction.section.para]]
text = "A passphrase of words drawn by dice from a list carries log2 of the list's length in bits for every word. Faraday has the {len:core/faraday-bip/src/diceware/mod.rs::ALL|words} lists the EFF publishes (EFF word lists):"

[[construction.section.para]]
table = "diceware-bits"
words = [4, 10]

[[construction.section.para]]
text = "The bits hold when every word is drawn by fair dice or by the computer's randomness, and not when a person chooses a word."

[[construction.section]]
heading = "What Argon2id adds"

[[construction.section.para]]
text = "Each guess costs one Argon2id at the vault's memory and passes, on the guesser's own hardware. Faraday states that work as log2(memory in KiB × passes) bits, which Create a vault shows beside each cost. The memory of the vaults Faraday makes ranges over a factor of {f:{c:faraday/faraday-vault/src/lib.rs::MAX_MEMORY_KIB} / {c:faraday/faraday-vault/src/lib.rs::CREATE_MIN_MEMORY_KIB}}, which is {f:log2({c:faraday/faraday-vault/src/lib.rs::MAX_MEMORY_KIB} / {c:faraday/faraday-vault/src/lib.rs::CREATE_MIN_MEMORY_KIB})} bits; one more word from the large list is {f:log2({len:core/faraday-bip/src/diceware/large.rs::WORDS})}. The figure counts work, not how much more memory costs a guesser than time, and it gives no time per guess."

[[construction.section]]
heading = "Other passphrases"

[[construction.section.para]]
text = "A person may use any passphrase. Its strength is then theirs to ensure: Faraday does not measure a typed passphrase. A short passphrase, or one used anywhere else, is not protected by any cost."

[[construction.section]]
heading = "Where to learn more"

[[construction.section.para]]
text = "The EFF's page on dice-generated passphrases, eff.org/dice."

[[construction.section.para]]
text = "Arnold Reinhold's Diceware page, where the method began, theworld.com/~reinhold/diceware.html."

[[construction.section.para]]
text = "NIST Special Publication 800-63B, Digital Identity Guidelines, on what makes a password strong."

