# Cryptographic actions (docs/CRYPTO-LEARN.md §2.2).
# The standards table is the only place a standard's name and status are
# written. docs/crypto/check.py checks every entry against the code and lists
# every function no action covers; docs/crypto/gen.py writes STANDARDS §1 to §7
# and AUDIT §3 from this file.

schema = 3                      # constructions (docs/CRYPTO-LEARN.md §18) are new in schema 2; independence (F160) in 3

