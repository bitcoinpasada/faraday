[[row]]
id = "vault"
section = 3
what = "The vault (`faraday/faraday-vault`, `docs/VAULT.md`)"
completeness = "Built: create, open, seal and the records, as a KDBX 4 file vault (`faraday-vault::file`, over `faraday-vault::kdbx`). The file is checked against pykeepass, `keepassxc-cli` and keepass-rs in the `vault` cross-check area, both ways. The QR vault as an RFC 9580 message is built as `faraday-vault::qr` (over `faraday-pgp::message`) and read by Sequoia's `sq` in `tools/vault/open.py`. Planned (F190, `docs/VAULT.md`): the app's screens for the QR vault"
standard_note = "Built: KDBX 4 under Argon2id 1.3 (RFC 9106) and ChaCha20 (RFC 8439) for the file vault, read by pykeepass, `keepassxc-cli` and keepass-rs in the `vault` cross-check area. Built: an RFC 9580 message under its Argon2 S2K with AES-256-OCB for a QR vault (`faraday-vault::qr`), holding TOML v1.0.0, opened by `sq` in the repository's tests only, and in the cross-check area `qrvault` by `sq`, rPGP and a PyCA judge, with rPGP's and the judge's seals opened by Faraday; checked against RFC 9580's own vectors for the session key and the data packet (AES-128 and OCB, byte for byte) and for the Argon2 S2K, the S2K held to A.12.3 by an ignored test that takes 2 GiB (`tools/vectors/openpgp/README.md`); OpenPGP.js is not run"

