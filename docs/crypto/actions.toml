# One table per STANDARDS row, in the order STANDARDS shows them (docs/CRYPTO-LEARN.md
# §2.2, §3.1). A row's cells are its actions' (those whose `row` is its id); a row that
# describes other rows' actions as well names them in `uses`; a row with no action
# (`no_action`: work not built, or work that computes nothing of its own) gives its
# `standard`, `verified` and `own` cells as text.

[[row]]
id = "single-key"
section = 2
what = "Single key: `pkh`, `sh(wpkh)`, `wpkh`, `tr` (`faraday/faraday-core/src/create.rs`)"
completeness = "Full for derivation and addresses (rust-bitcoin)"

[[row]]
id = "multisig"
section = 2
what = "Multisig `wsh` and `sh(wsh)` `sortedmulti`"
completeness = "Full: the account key is derived here; the script is read through a wallet policy"

[[row]]
id = "legacy-multisig"
section = 2
what = "Legacy multisig `sh(sortedmulti)` at `m/45'`"
completeness = "A convention, not BIP 45's scheme; the account key is derived as Single key's are"
uses = ["derive", "descriptor", "address"]
standard = "BIP 45 (Complete) defines `m/45'/cosigner/change/index`; Faraday uses `m/45'` as an account with `/<0;1>/*`, the Coldcard and Unchained export (a convention)"
own = "`m/45'` is an account path with no account number to choose. Neutral; no decision."

[[row]]
id = "taproot-multisig"
section = 2
what = "Taproot multisig `tr(H, sortedmulti_a)` (`core/faraday-bip/src/tapmulti.rs`)"
completeness = "`sortedmulti_a` is parsed here because miniscript lacks it, as a multipath descriptor or one chain a descriptor (a receive and a change line, a receive line alone); a hardened wildcard is parsed but not derived"

[[row]]
id = "miniscript-recovery"
section = 2
what = "Miniscript and timelocked recovery, Liana shapes (`core/faraday-bip/src/recovery.rs`, `core/faraday-bip/src/policy.rs`)"
completeness = "Reads any sane `wsh`, `sh(wsh)` or `tr` miniscript, as Core does; Create does not make one; the compiler is in Tools; the builder of Liana's shapes is in core and not reached from the app; a taproot leaf with a `pkh` is signed but left for the coordinator to finalize"

[[row]]
id = "musig2"
