[package]
name = "faraday-grant"
version = "0.1.5"
description = "The grant helper (docs/history/PLAN.md §4.3): with CAP_CHOWN alone, it hands each USB or SD partition to the disk process while the app is clean, a partition named FARADAYBOOT to the boot copier only while the app is upgrading a stick and never to the disk process, deciding from /sys alone, and takes them back when the app is not"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# chown, chmod, prctl, setuid and capset (docs/deps/libc-faraday-grant.md).
libc.workspace = true

# The workspace lints are deliberately not inherited: like
# faraday-v4l2, this crate needs `unsafe` for system calls std does not
# offer (chown, chmod, prctl, setuid, capset). The other workspace lint is
# repeated by hand.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
