[package]
name = "faraday-starter-shell"
version = "0.1.7"
description = "The Starter (docs/STARTER.md §2): faraday-starter in a window, its payload, and per operating system the disks, the writer and this computer's facts"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
name = "faraday_starter_shell"
path = "src/lib.rs"

[[bin]]
name = "faraday-starter"
path = "src/main.rs"

[dependencies]
faraday-starter = { path = "../../faraday-starter" }
faraday-core = { path = "../../faraday-core" }
faraday-crypto = { path = "../../../core/faraday-crypto" }
faraday-payload = { path = "../../faraday-payload" }
faraday-fat = { path = "../../faraday-fat" }
# A boot file the person signed (docs/STARTER.md §4.5, F133): its
# Authenticode image hash and the certificate its signature carries.
faraday-sb = { path = "../../faraday-sb" }
faraday-storage = { path = "../../faraday-storage" }
faraday-window = { path = "../window" }
# Faraday Demo, run inside the Starter's window (F126, docs/STARTER.md
# §5.3): its sticks, storage and fresh app, and through it the public
# samples Practice takes (faraday-samples, tools/lint-keys-tests.sh).
faraday-desktop = { path = "../desktop" }
faraday-shell-api = { path = "../../../core/faraday-shell-api" }
winit.workspace = true
# A Faraday stick's release string (`find_release`), read from its boot
# partition (docs/STARTER.md §4.1).
faraday-boot = { path = "../../faraday-boot" }
# The BitLocker recovery key read for the sheet (docs/STARTER.md §6, F49),
# and wiping it and every buffer it passes through (windows/bitlocker.rs,
# the sheet's PDF).
zeroize = { workspace = true, features = ["alloc"] }

# udisks2 over the system bus, with the file descriptor `OpenDevice`
# hands back (docs/deps/rustbus.md).
[target.'cfg(target_os = "linux")'.dependencies]
rustbus = "=0.19.3"

# The one call std does not make on macOS: `recvmsg` with its control
# message, taking the descriptor `/usr/libexec/authopen` sends back
# (src/macos/mac.rs, docs/deps/libc.md). The lockfile's release.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "=0.2.189", default-features = false }

# The Win32 calls of the windows module (docs/STARTER.md §2): the same
# windows-sys release winit already brings on Windows, with the features
# those calls need. No other Windows crate.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.52.0"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

# MANIFEST read and checked when the payload is built in.
[build-dependencies]
faraday-payload = { path = "../../faraday-payload" }

# The tests sign boot files to hand the Starter (`pe::sign`, faraday-sb's
# `sign-any`); the Starter itself never signs (F134,
# tools/lint-keys-tests.sh).
[dev-dependencies]
faraday-sb = { path = "../../faraday-sb", features = ["sign-any"] }

[lints.rust]
# Not `workspace = true`: on Linux one function needs `unsafe`, taking
# ownership of the file descriptor udisks2 passes back from
# `Block.OpenDevice` (std has no safe way from a raw descriptor to a
# `File`); on Windows the Win32 calls std does not make (src/windows/sys.rs
# alone); on macOS receiving the descriptor authopen sends
# (src/macos/mac.rs, `receive`). `deny`, not `forbid`, so those alone can allow it, as
# faraday-crypto's `pinned.rs` does; the other workspace lint is repeated by
# hand.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# The workspace's: a long function carries an expect (tools/lint-layout.sh).
too_many_lines = "warn"
