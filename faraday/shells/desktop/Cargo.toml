[package]
name = "faraday-desktop"
version = "0.1.4"
description = "Faraday in a window, with folders for sticks: the quickest way to try the screens"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "faraday"
path = "src/main.rs"

[dependencies]
faraday-core = { path = "../../faraday-core", features = ["testkit"] }
faraday-storage = { path = "../../faraday-storage" }
osk-shell-api = { path = "../../../core/osk-shell-api" }
# `pin-pages`: the `mlock` that keeps the loaded master keys out of swap.
osk-crypto = { path = "../../../core/osk-crypto", features = ["pin-pages"] }
winit.workspace = true
# The window's pacing, input, drawing and camera, shared with the
# Starter (faraday/shells/starter).
faraday-window = { path = "../window" }

[lints]
workspace = true

[dev-dependencies]
osk-bip = { path = "../../../core/osk-bip" }
