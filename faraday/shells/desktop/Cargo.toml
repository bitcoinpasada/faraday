[package]
name = "faraday-desktop"
version = "0.1.7"
description = "Faraday in a window, with folders for sticks: the quickest way to try the screens"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "faraday"
path = "src/main.rs"

[dependencies]
faraday-core = { path = "../../faraday-core" }
# The network the desktop app starts on.
faraday-bip = { path = "../../../core/faraday-bip" }
faraday-storage = { path = "../../faraday-storage" }
# The public samples Demo takes (docs/MODES.md §5.4): public data only,
# in no other shipped binary (tools/lint-keys-tests.sh).
faraday-samples = { path = "../../faraday-samples" }
faraday-shell-api = { path = "../../../core/faraday-shell-api" }
# `pin-pages`: the `mlock` that keeps the loaded master keys out of swap.
faraday-crypto = { path = "../../../core/faraday-crypto", features = ["pin-pages"] }
winit.workspace = true
# The window's pacing, input, drawing and camera, shared with the
# Starter (faraday/shells/starter).
faraday-window = { path = "../window" }

[lints]
workspace = true

[dev-dependencies]
# The tests' keys and wallets; never in the shipped app
# (tools/lint-keys-tests.sh).
faraday-core = { path = "../../faraday-core", features = ["testkit"] }
