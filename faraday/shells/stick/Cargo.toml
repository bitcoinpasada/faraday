[package]
name = "faraday-stick"
version = "0.2.0"
description = "Faraday on the stick's framebuffer: hosts faraday-core and reports sticks"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "faraday"
path = "src/main.rs"

[dependencies]
faraday-shell-api = { path = "../../../core/faraday-shell-api" }
faraday-crypto = { path = "../../../core/faraday-crypto", features = ["pin-pages"] }
faraday-core = { path = "../../faraday-core" }
# The printed sheets, the EDID rules and the build ID.
faraday-paper = { path = "../../faraday-paper" }
# The medium's record, which says whether init found the stick it started
# from (docs/STICK-IDENTITY.md §5.2); std alone.
faraday-boot = { path = "../../faraday-boot" }
faraday-storage = { path = "../../faraday-storage" }
faraday-camera = { path = "../camera" }
faraday-v4l2 = { path = "../../../faraday/shells/v4l2" }
faraday-scanner = { path = "../../faraday-scanner" }
zeroize = { workspace = true, features = ["alloc"] }

[lints]
workspace = true

[dev-dependencies]
faraday-draw = { path = "../../../core/faraday-draw" }
faraday-core = { path = "../../faraday-core", features = ["testkit"] }
