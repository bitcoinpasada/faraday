[package]
name = "faraday-window"
version = "0.1.7"
description = "What the desktop app and the Starter share to run in a window: the frame pacing, the input, the copy to the window, and the camera with its scanner"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-core = { path = "../../faraday-core" }
faraday-scanner = { path = "../../faraday-scanner" }
faraday-shell-api = { path = "../../../core/faraday-shell-api" }
winit.workspace = true
softbuffer.workspace = true
getrandom.workspace = true

# The webcam.
[target.'cfg(target_os = "linux")'.dependencies]
faraday-v4l2 = { path = "../../../faraday/shells/v4l2" }

[target.'cfg(target_os = "macos")'.dependencies]
faraday-avfoundation = { path = "../../../faraday/shells/avfoundation" }

[target.'cfg(target_os = "windows")'.dependencies]
faraday-mediafoundation = { path = "../mediafoundation" }

# The clipboard's text on Windows: the API, no tool (clipboard.rs,
# docs/deps/clipboard.md). The release the Starter pins (winit brings it
# too); the features add no crate.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.52.0"
features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
]

[lints.rust]
# Not `workspace = true`: on Windows the clipboard's four Win32 calls need
# `unsafe` (clipboard.rs, `windows` alone). `deny`, not `forbid`, so that
# module alone can allow it; the other workspace lint is repeated by hand.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# The workspace's: a long function carries an expect (tools/lint-layout.sh).
too_many_lines = "warn"
