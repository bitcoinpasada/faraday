[package]
name = "faraday-window"
version = "0.2.0"
description = "What the desktop app and the Starter share to run in a window: the frame pacing, the input, the copy to the window, and the camera with its scanner"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# Faraday's own side: the camera with its scanner (`camera`, `lens`) and
# `wake_on_work`. The Argon QR Vault's window turns it off (F245).
default = ["faraday"]
faraday = ["dep:faraday-core", "dep:faraday-camera", "dep:faraday-scanner",
    "dep:faraday-text", "dep:faraday-v4l2", "dep:faraday-avfoundation", "dep:faraday-mediafoundation"]

[dependencies]
faraday-core = { path = "../../faraday-core", optional = true }
faraday-camera = { path = "../camera", optional = true }
faraday-scanner = { path = "../../faraday-scanner", optional = true }
faraday-shell-api = { path = "../../../core/faraday-shell-api" }
faraday-text = { path = "../../../core/faraday-text", optional = true }
winit.workspace = true
softbuffer.workspace = true
getrandom.workspace = true
# The window icon on X11, from the app's PNG (view.rs, docs/deps/png.md).
png.workspace = true
# Wipes the pasted text the system clipboard hands over (clipboard.rs).
zeroize.workspace = true

# The webcam.
[target.'cfg(target_os = "linux")'.dependencies]
faraday-v4l2 = { path = "../../../faraday/shells/v4l2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
faraday-avfoundation = { path = "../../../faraday/shells/avfoundation", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
faraday-mediafoundation = { path = "../mediafoundation", optional = true }

# The clipboard's text on Windows: the API, no tool (clipboard.rs,
# docs/deps/clipboard.md). The release the Starter pins (winit brings it
# too); the features add no crate.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.52.0"
features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
]

[dev-dependencies]
# Faraday Demo's host, which a test of the window holds the app in.
faraday-host = { path = "../../faraday-host" }

[lints.rust]
# Not `workspace = true`: on Windows the clipboard's four Win32 calls need
# `unsafe` (clipboard.rs, `windows` alone). `deny`, not `forbid`, so that
# module alone can allow it; the other workspace lint is repeated by hand.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# The workspace's: a long function carries an expect (tools/lint-layout.sh).
too_many_lines = "warn"
