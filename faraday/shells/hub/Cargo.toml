[package]
name = "faraday-hub-shell"
version = "0.1.1"
description = "The hub app (docs/HUB.md §2): faraday-hub in a window, its payload, and per operating system the disks, the writer and this computer's facts"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
name = "faraday_hub_shell"
path = "src/lib.rs"

[[bin]]
name = "faraday-starter"
path = "src/main.rs"

[dependencies]
faraday-hub = { path = "../../faraday-hub" }
faraday-core = { path = "../../faraday-core" }
faraday-payload = { path = "../../faraday-payload" }
faraday-fat = { path = "../../faraday-fat" }
faraday-storage = { path = "../../faraday-storage" }
faraday-window = { path = "../window" }
# `strings::fill` fills the hub's strings (faraday-core's strings/en.rs).
opensigner-core = { path = "../../../opensigner/opensigner-core" }
osk-shell-api = { path = "../../../core/osk-shell-api" }
winit.workspace = true
# A Faraday stick's release string (`find_release`), as the stick's own
# upgrade reads it.
faraday-boot = { path = "../../faraday-boot" }
# The BitLocker recovery key's text (docs/HUB.md §6.2), and wiping it and
# every buffer it passes through (windows/bitlocker.rs).
faraday-qr = { path = "../../faraday-qr" }
zeroize = { workspace = true, features = ["alloc"] }

# udisks2 over the system bus, with the file descriptor `OpenDevice`
# hands back (docs/deps/rustbus.md).
[target.'cfg(target_os = "linux")'.dependencies]
rustbus = "=0.19.3"

# The one call std does not make on macOS: `recvmsg` with its control
# message, taking the descriptor `/usr/libexec/authopen` sends back
# (src/macos/mac.rs, docs/deps/libc.md). The lockfile's release.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "=0.2.189", default-features = false }

# The Win32 calls of the windows module (docs/HUB.md §2): the same
# windows-sys release winit already brings on Windows, with the features
# those calls need. No other Windows crate.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.52.0"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

# MANIFEST read and checked when the payload is built in.
[build-dependencies]
faraday-payload = { path = "../../faraday-payload" }

[lints.rust]
# Not `workspace = true`: on Linux one function needs `unsafe`, taking
# ownership of the file descriptor udisks2 passes back from
# `Block.OpenDevice` (std has no safe way from a raw descriptor to a
# `File`); on Windows the Win32 calls std does not make (src/windows/sys.rs
# alone); on macOS receiving the descriptor authopen sends
# (src/macos/mac.rs, `receive`). `deny`, not `forbid`, so those alone can allow it, as
# osk-crypto's `pinned.rs` does; the other workspace lint is repeated by
# hand.
unsafe_code = "deny"
missing_docs = "warn"
