[package]
name = "faraday-hub-shell"
version = "0.1.1"
description = "The hub app (docs/HUB.md §2): faraday-hub in a window, its payload, and per operating system the disks, the writer and this computer's facts"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
name = "faraday_hub_shell"
path = "src/lib.rs"

[[bin]]
name = "faraday-hub"
path = "src/main.rs"

[dependencies]
faraday-hub = { path = "../../faraday-hub" }
faraday-core = { path = "../../faraday-core" }
faraday-payload = { path = "../../faraday-payload" }
faraday-fat = { path = "../../faraday-fat" }
faraday-storage = { path = "../../faraday-storage" }
faraday-window = { path = "../window" }
# The menu entries' names are strings (strings/en.rs).
opensigner-core = { path = "../../../opensigner/opensigner-core" }
osk-shell-api = { path = "../../../core/osk-shell-api" }
winit.workspace = true

# A Faraday stick's release string (`find_release`), as the stick's own
# upgrade reads it. Unix only, as the crate is: batch W moves what the
# Windows hub app needs of it.
[target.'cfg(unix)'.dependencies]
faraday-boot = { path = "../../faraday-boot" }

# udisks2 over the system bus, with the file descriptor `OpenDevice`
# hands back (docs/deps/rustbus.md).
[target.'cfg(target_os = "linux")'.dependencies]
rustbus = "=0.19.3"

# MANIFEST read and checked when the payload is built in.
[build-dependencies]
faraday-payload = { path = "../../faraday-payload" }

[lints.rust]
# Not `workspace = true`: one function needs `unsafe`, taking ownership
# of the file descriptor udisks2 passes back from `Block.OpenDevice`
# (std has no safe way from a raw descriptor to a `File`). `deny`, not
# `forbid`, so that function alone can allow it, as osk-crypto's
# `pinned.rs` does; the other workspace lint is repeated by hand.
unsafe_code = "deny"
missing_docs = "warn"
