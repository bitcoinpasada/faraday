[package]
name = "faraday-v4l2"
version = "0.1.0"
description = "Video4Linux2 capture through raw ioctls: one of the crates on the device that use unsafe"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# One dependency, for the libc declarations the ioctls need. Everything
# V4L2 is declared in src/abi.rs.
[dependencies]
faraday-camera = { path = "../camera" }
libc.workspace = true

# The workspace lints are deliberately NOT inherited: this crate is one
# of the exceptions to `unsafe_code = "forbid"` (README lists them).
# Every other workspace lint that matters here is repeated by hand.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
# The workspace's: a function over the complexity threshold carries an expect.
cognitive_complexity = "warn"
