[package]
name = "faraday-snapshot"
version = "0.1.7"
description = "Renders Faraday's screens to PNG along a scripted tour, for review on the build machine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-core = { path = "../../faraday-core", features = ["testkit"] }
faraday-storage = { path = "../../faraday-storage" }
faraday-qr = { path = "../../faraday-qr" }
faraday-bip = { path = "../../../core/faraday-bip" }
faraday-keys = { path = "../../faraday-keys" }
# The real samples, for the modes tour (a tool, not a shipped binary).
faraday-samples = { path = "../../faraday-samples" }
faraday-crypto = { path = "../../../core/faraday-crypto" }
faraday-vault = { path = "../../faraday-vault" }
faraday-sb = { path = "../../faraday-sb" }
faraday-shell-api = { path = "../../../core/faraday-shell-api" }
png.workspace = true
faraday-codec = { path = "../../../core/faraday-codec" }
faraday-selftest = { path = "../../../core/faraday-selftest" }

[features]
# The tour's FROST stops, compiled out with FROST (docs/decisions/F109.md).
unreleased = ["faraday-core/unreleased"]

[lints]
workspace = true
