[package]
name = "faraday-scanner"
version = "0.1.6"
description = "Reads QR codes in camera frames on a worker thread, and says what each pass saw"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The decode policy is the scan reduction in
# `src/scan.rs`; the preview's size is `faraday-draw`'s token. The detector
# is the workspace's vendored `rqrr`, read directly so that a pass can say
# where a code was and how fine it is.
[dependencies]
faraday-draw = { path = "../../core/faraday-draw" }
rqrr = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
faraday-codec = { path = "../../core/faraday-codec" }
# The token the tests' QR codes take (docs/COMPUTE.md §2).
faraday-crypto = { path = "../../core/faraday-crypto" }

[lints]
workspace = true
