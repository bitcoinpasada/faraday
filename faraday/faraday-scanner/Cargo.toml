[package]
name = "faraday-scanner"
version = "0.1.5"
description = "Reads QR codes in camera frames on a worker thread, and says what each pass saw"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The decode policy is OpenSigner's scan reduction, copied into
# `src/scan.rs`; the preview's size is `osk-ui`'s token. The detector
# is the workspace's vendored `rqrr`, read directly so that a pass can say
# where a code was and how fine it is.
[dependencies]
osk-ui = { path = "../../core/osk-ui" }
rqrr = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
osk-codec = { path = "../../core/osk-codec" }

[lints]
workspace = true
