[package]
name = "faraday-ui"
version = "0.1.5"
description = "Faraday's drawing: the Ui, the palettes, the mark and wordmark, cards, buttons, sheets and QR codes the desktop app, Faraday Starter draw with"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The canvas, the fonts, the icons.
osk-ui = { path = "../../core/osk-ui" }
# A QR code's modules. The decoder (`rqrr`) is not needed to draw one.
osk-codec = { path = "../../core/osk-codec", default-features = false }
# The themes' names.
faraday-strings = { path = "../faraday-strings" }
# The firmware sketches' types (`docs/STARTER.md` §7.8); the data stays in
# faraday-guides, read by whoever looks a sketch up.
faraday-learn = { path = "../faraday-learn" }

[lints]
workspace = true
