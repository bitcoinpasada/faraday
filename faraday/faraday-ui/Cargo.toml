[package]
name = "faraday-ui"
version = "0.1.7"
description = "Faraday's drawing: the Ui, the palettes, the mark and wordmark, cards, buttons, sheets and QR codes the desktop app, Faraday Starter draw with"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The canvas, the fonts, the icons.
faraday-draw = { path = "../../core/faraday-draw" }
# A QR code's modules. The decoder (`rqrr`) is not needed to draw one.
faraday-codec = { path = "../../core/faraday-codec", default-features = false }
# The themes' names.
faraday-strings = { path = "../faraday-strings" }

[dev-dependencies]
# A canvas the size of a display, for the tests.
faraday-shell-api = { path = "../../core/faraday-shell-api" }

[lints]
workspace = true
