[package]
name = "faraday-ui"
version = "0.1.1"
description = "Faraday's drawing: the Ui, the palettes, the mark and wordmark, cards, buttons, sheets and QR codes the desktop app, Faraday Starter and Faraday Companion draw with"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# Nothing on docs/COMPANION.md §3's list: the Companion draws with it,
# and `tools/lint-companion-deps.sh` checks this crate's tree.
[dependencies]
# The canvas, the fonts, the icons.
osk-ui = { path = "../../core/osk-ui" }
# A QR code's modules. The decoder (`rqrr`) is not needed to draw one.
osk-codec = { path = "../../core/osk-codec", default-features = false }
# The themes' names.
faraday-strings = { path = "../faraday-strings" }
# The firmware sketches' data (`docs/HUB.md` §7.8).
faraday-learn = { path = "../faraday-learn" }

[lints]
workspace = true
