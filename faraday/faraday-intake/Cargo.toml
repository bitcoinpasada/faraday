[package]
name = "faraday-intake"
version = "0.1.5"
description = "What arrives at a Faraday app, and whether it is a secret that stays on the device: answers in enums, no strings"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The payload classifier, SeedQR and UR. The QR decoder (`decode`) is not
# needed to recognise bytes already read.
osk-codec = { path = "../../core/osk-codec", default-features = false }
osk-bip = { path = "../../core/osk-bip" }
# The token key work takes (docs/COMPUTE.md §2).
osk-crypto = { path = "../../core/osk-crypto" }
# The Faraday file envelope, what a whole transfer arrived as, and CBOR.
faraday-qr = { path = "../faraday-qr" }
zeroize = { workspace = true, features = ["alloc"] }
# The description reader's refusal lines (`wallet`).
faraday-strings = { path = "../faraday-strings" }

[lints]
workspace = true
