[package]
name = "faraday-keys"
version = "0.1.7"
description = "Where Faraday's key material is held and used: the session's keys, the open vaults, every operation on them, and the fourteen reasons a secret leaves (docs/KEYS.md)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-bip = { path = "../../core/faraday-bip" }
faraday-psbt = { path = "../../core/faraday-psbt" }
faraday-entropy = { path = "../../core/faraday-entropy" }
faraday-crypto = { path = "../../core/faraday-crypto" }
faraday-pgp = { path = "../faraday-pgp" }
faraday-sb = { path = "../faraday-sb" }
faraday-vault = { path = "../faraday-vault" }
faraday-backup = { path = "../../core/faraday-backup" }
faraday-codec = { path = "../../core/faraday-codec", default-features = false }
faraday-intake = { path = "../faraday-intake" }
faraday-strings = { path = "../faraday-strings" }
zeroize = { workspace = true, features = ["alloc"] }

[features]
# FROST and signing across places, compiled out of the app
# (docs/decisions/F109.md); faraday-core's `unreleased` turns it on.
unreleased = []
# `Keys::master_for_tests`: a key's master key, for the tests that check a
# public result against the one they derive themselves. Turned on by
# faraday-core's dev-dependency only; `tools/lint-keys-tests.sh` fails if a
# shipped binary has it.
master-for-tests = []

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
