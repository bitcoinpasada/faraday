[package]
name = "faraday-apk"
version = "0.1.5"
description = "The Android app signing key Faraday makes, and APK Signature Scheme v2 and v3 signatures with it (docs/APK-SIGNING.md)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-sb = { path = "../faraday-sb" }
zeroize = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }
# The manifest is deflated in most APKs; inflated here, bounded
# (docs/deps/miniz_oxide.md).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[lints]
workspace = true
