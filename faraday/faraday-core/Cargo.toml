[package]
name = "faraday-core"
version = "0.2.0"
description = "Faraday's app: screens, the session, Inbox and Outbox; events in, commands out, no I/O"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-shell-api = { path = "../../core/faraday-shell-api" }
faraday-draw = { path = "../../core/faraday-draw" }
faraday-bip = { path = "../../core/faraday-bip" }
faraday-psbt = { path = "../../core/faraday-psbt" }
faraday-codec = { path = "../../core/faraday-codec" }
faraday-crypto = { path = "../../core/faraday-crypto" }
faraday-entropy = { path = "../../core/faraday-entropy" }
faraday-selftest = { path = "../../core/faraday-selftest" }
faraday-vault = { path = "../faraday-vault" }
faraday-qr = { path = "../faraday-qr" }
faraday-strings = { path = "../faraday-strings" }
# Faraday's drawing, shared with the Starter.
faraday-ui = { path = "../faraday-ui" }
faraday-guide = { path = "../faraday-guide" }
faraday-intake = { path = "../faraday-intake" }
faraday-pgp = { path = "../faraday-pgp" }
faraday-ots = { path = "../faraday-ots" }
# The backup plan's logic; this crate draws it.
faraday-plan = { path = "../faraday-plan" }
# The printed sheets, the EDID rules and the build ID.
faraday-paper = { path = "../faraday-paper" }
faraday-sb = { path = "../faraday-sb" }
faraday-keys = { path = "../faraday-keys" }
# The Bitcoin Core wallet reader (F229); the tool and its screen are here.
faraday-core-wallet = { path = "../faraday-core-wallet" }
# The boot partitions' names and labels, which a backup refuses
# (docs/STICK-IDENTITY.md §5.2); std alone.
faraday-boot = { path = "../faraday-boot" }
# The rules of a FAT volume's name, which Rename stick checks as it is
# typed (docs/STICK-IDENTITY.md §6); no_std, no dependency.
faraday-fat = { path = "../faraday-fat" }
subtle.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

[features]
# The test wallets and the files a test stick carries. The stick image's
# app is built without it.
testkit = []
# One sample block, offered on Catalog and the Starter's What to write page, for
# tests. Never in a snapshot or a shipped build.
sample-how = ["faraday-guide/sample-how"]

[dev-dependencies]
faraday-core = { path = ".", features = ["testkit", "sample-how"] }
# `Keys::master_for_tests`, for tests that derive a public result themselves.
faraday-keys = { path = "../faraday-keys", features = ["master-for-tests"] }
# The disk process's picture reader: what a PNG on a stick reads as.
faraday-files = { path = "../faraday-files" }
# The camera shells' scanner: what a camera frame is seen to hold.
faraday-scanner = { path = "../faraday-scanner" }
# The test binary's allocator, counting each thread's allocations for the
# frame budgets (`src/work/budget.rs`).
faraday-alloc-count = { path = "../tools/alloc-count" }
# The wallet files `tests/all/core_wallet.rs` builds, read as rows.
faraday-sqlite = { path = "../faraday-sqlite" }
# The known answers of Faraday's own specifications (`tools/vectors/`).
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
