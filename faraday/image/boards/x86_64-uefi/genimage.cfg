# Faraday: upstream's genimage.cfg at c418768, with the names an ordinary
# stick has and IDs that spell nothing (F174, docs/STICK-IDENTITY.md §3,
# §4.1). Nothing in Faraday knows the stick by them: the device finds it
# by its layout and the build its boot partition holds (§5.2), and keeps
# back every partition named "EFI system partition".

# The stick: an EFI system partition holding one file, and one empty FAT
# partition for exchanging files with a computer.
#
# There is no root filesystem partition. The whole rootfs is an initramfs
# inside BOOTX64.EFI, so once the firmware has read that one file the
# stick is needed only for the second partition, and nothing writes to the
# first.

image esp.vfat {
	vfat {
		# FAT32, labelled EFI as an ordinary EFI system partition is.
		extraargs = "--invariant -F 32 -n EFI -i @FAT_SERIAL_BOOT@"
		files = {
			"esp/EFI"
		}
	}
	# 64 MiB (F80). The content is one file of about 10 MB, the kernel
	# with the whole root filesystem inside it, and 64 MiB holds a boot
	# file of 30 MB twice over, so a larger kernel or an interpreter in
	# the boot file does not need a new layout. FAT32 needs at least
	# 65525 clusters: below that mkfs.fat makes one anyway with a warning
	# and OVMF refuses to mount it, which reads as "failed to load ...
	# Not Found" and no boot at all. At 64 MiB mkfs.fat makes 129022
	# clusters of 512 bytes, about twice the minimum, so the minimum no
	# longer sets the size.
	size = 64M
}

# Empty. Init mounts this at /mnt/microsd, so a PSBT dropped here from a
# computer is what the app reads and a signed one is written back beside
# it. `empty = true` tells genimage to make the vfat with nothing on it,
# rather than copying in a files list.
image exchange.vfat {
	vfat {
		# No -n: no label, written as mkfs.fat writes one ("NO NAME" in
		# the boot sector, no volume-label entry), so each system shows
		# the partition by its own word for a drive with no name. The
		# person may name it, in the Starter or in Files (§6).
		extraargs = "--invariant -F 32 -s 2 -i @FAT_SERIAL_DATA@"
	}
	empty = true
	# 128 MiB FAT32, the same as the Pi's (F80). A PSBT is a few
	# kilobytes, but a vault at its largest is 16 MiB and a file brought
	# in for signing can be larger, so the partition holds several of
	# each. FAT32 rather than FAT16, whose top folder has a fixed number
	# of entries (docs/LARGE-FILES.md); without -F 32 mkfs.fat would make
	# FAT16 at this size. Every computer mounts either. Clusters of
	# 1 KiB (-s 2): mkfs.fat's 512 bytes would double the FAT lookups a
	# file costs, and 2 KiB would fall under FAT32's 65,525 clusters.
	# With the 1 MiB before the first partition and the backup GPT after
	# the last, the image is 193 MiB and 20 KiB, so it fits a "256 MB"
	# stick with room to spare.
	size = 128M
}

image faraday-x86_64-uefi.img {
	# GPT, because that is what a UEFI firmware looks for on a removable
	# disk, and because the EFI system partition is a GPT partition type
	# and not an MBR one.
	#
	# 1 MB alignment, the usual for a disk whose erase block size is not
	# known. The UUIDs are given rather than generated, because two
	# builders must get the same bytes and genimage makes up a random one
	# otherwise: image-id.sh makes them from the commit date, so they
	# differ from one release to the next and spell nothing. The Starter
	# gives each stick it writes its own (§4.2).
	hdimage {
		align = 1M
		partition-table-type = "gpt"
		disk-uuid = "@DISK_UUID@"
	}

	# The GPT names are the ones Windows gives the partitions it makes.
	partition "EFI system partition" {
		partition-type-uuid = "U"
		partition-uuid = "@BOOT_UUID@"
		bootable = "true"
		image = "esp.vfat"
	}

	partition "Basic data partition" {
		partition-type-uuid = "F"
		partition-uuid = "@DATA_UUID@"
		image = "exchange.vfat"
	}
}
