# Faraday: upstream's pi3 genimage.cfg at c418768 with the boot partition
# labelled FARADAYBOOT, as docs/history/PLAN.md §4.3 asks: the disk process refuses it by
# that label, and faraday-grant never hands out the card's first partition.

# The card: one FAT boot partition the Pi firmware reads, and one empty FAT
# partition for exchanging files with a computer.
#
# There is no root filesystem partition. The whole rootfs is an initramfs
# inside zImage, so once the firmware has read the boot partition the card is
# not needed and nothing writes to it.

image boot.vfat {
	vfat {
		extraargs = "--invariant -n FARADAYBOOT -i @FAT_SERIAL_BOOT@"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start_x.elf",
			"rpi-firmware/fixup_x.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"zImage",
			"faraday-build.txt",
			@DTBS@
		}
	}
	# 64 MiB, the same as the stick's (F80). The content above is about
	# 16 MB — the firmware blobs, the overlays, two device trees and
	# zImage with the whole root filesystem inside it — and the partition
	# holds a boot file of 30 MB twice over, so a larger kernel or another
	# device tree does not need a new layout. Without -F, mkfs.fat makes
	# it FAT16 at this size (32695 clusters of 2 KiB); the Pi firmware
	# reads FAT16 and FAT32 alike, and every computer mounts it.
	size = 64M
}

# Empty. Init mounts this at /mnt/microsd, so a PSBT dropped here from a
# computer is what the app reads and a signed one is written back beside
# it. `empty = true` tells genimage to make the vfat with nothing on it,
# rather than copying in a files list.
image exchange.vfat {
	vfat {
		extraargs = "--invariant -F 32 -s 2 -n FARADAYDATA -i @FAT_SERIAL_DATA@"
	}
	empty = true
	# 128 MiB FAT32, the same as the stick's (F80). A PSBT is a few
	# kilobytes, but a vault at its largest is 16 MiB and a file brought
	# in for signing can be larger, so the partition holds several of
	# each. FAT32 rather than FAT16, whose top folder has a fixed number
	# of entries (docs/LARGE-FILES.md); without -F 32 mkfs.fat would make
	# FAT16 at this size. Every computer mounts either. Clusters of
	# 1 KiB (-s 2): mkfs.fat's 512 bytes would double the FAT lookups a
	# file costs, and 2 KiB would fall under FAT32's 65,525 clusters.
	# With the 4 MiB before the first partition, the card's image is
	# 196 MiB, so it fits a "256 MB" card with room to spare.
	size = 128M
}

image faraday-pi.img {
	# 4 MB alignment: the erase block size of the cards this runs from, and
	# what every other Pi image uses. Unaligned partitions work but make the
	# card do a read-modify-write on every boundary.
	hdimage {
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition exchange {
		partition-type = 0xC
		image = "exchange.vfat"
	}
}
