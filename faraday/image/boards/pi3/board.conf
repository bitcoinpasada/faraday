# The Raspberry Pi 3B, 3B+ and Zero 2 W: one card for all three.
#
# Read by build.sh, which prints NAME and puts DTBS on the card, and by
# `just faraday-pi-bin`, which cross-compiles the app with RUST_TARGET, CC and
# CFLAGS. Nothing else reads it.
NAME="Raspberry Pi 3B / 3B+ / Zero 2 W"

# The 3B+ is the owner's board and has been booted. The 3B and the Zero 2 W
# share its BCM2710, kernel, firmware and drivers; their device trees are
# built and on the card, and nobody has booted either (F147).
STATUS=tested

# The toolchain the shell is built with. CFLAGS is for the libsecp256k1
# sources secp256k1-sys compiles; the target's own defaults are right for
# a Cortex-A53, so there is nothing to add.
RUST_TARGET=armv7-unknown-linux-gnueabihf
CC=arm-linux-gnueabihf-gcc
CFLAGS=""

# The device trees on the boot partition. The 3B+ is the board; the 3B and
# the Zero 2 W are built too, and the Pi's firmware loads the one for the
# board it starts on, so one card starts all three (F147). The Zero 2 W has
# no DSI connector, so only the 2.8-inch and monitor images fit it.
DTBS="bcm2710-rpi-3-b bcm2710-rpi-3-b-plus bcm2710-rpi-zero-2 bcm2710-rpi-zero-2-w"

# How this board is told where the kernel is, and what it boots from.
#
#   FIRMWARE    rpi: the GPU firmware reads config.txt and cmdline.txt
#               from the boot partition, so build.sh assembles both and
#               the rpi-firmware package puts them there.
#   CMDLINE     file: the command line is a file the firmware reads.
#   EXCHANGE    the partition rcS mounts at /mnt/microsd. A card is always
#               the same node.
#   CONSOLE_TTY where the dev variant's getty runs.
#   IMAGE       what genimage.cfg calls the finished image.
FIRMWARE=rpi
CMDLINE=file
EXCHANGE=/dev/mmcblk0p2
CONSOLE_TTY=ttyAMA0
IMAGE=faraday-pi.img
