# Faraday: upstream's genimage.cfg at c418768 with the two GPT partitions
# named OSKBOOT and OSKDATA, as PLAN.md §4.3 asks: faraday-grant and
# faraday-disk know the boot partition by its name in /sys, before
# anything on it is read.

# The stick: an EFI system partition holding one file, and one empty FAT
# partition for exchanging files with a computer.
#
# There is no root filesystem partition. The whole rootfs is an initramfs
# inside BOOTX64.EFI, so once the firmware has read that one file the
# stick is needed only for the second partition, and nothing writes to the
# first.

image esp.vfat {
	vfat {
		# FAT32 and a label, so a computer that mounts the stick says
		# what the partition is.
		extraargs = "-F 32 -n OSKBOOT"
		files = {
			"esp/EFI"
		}
	}
	# 48 MB, and the size is set by FAT32 rather than by the content.
	# A FAT32 filesystem is only valid with at least 65525 clusters,
	# and a 32 MB partition has about 64500 of them: mkfs.fat makes it
	# anyway with a warning, and OVMF refuses to mount it, which reads
	# as "failed to load ... Not Found" and no boot at all. 48 MB is
	# the next round size that is comfortably over the line. The
	# content is one file of about 10 MB — the kernel with the whole
	# root filesystem inside it.
	size = 48M
}

# Empty but for a note saying what it is for. Init mounts this at
# /mnt/microsd, so a PSBT dropped here from a computer is what the app
# reads and a signed one is written back beside it. (genimage will not make
# a vfat with no files in it, and a partition that explains itself is better
# than one that does not.)
image exchange.vfat {
	vfat {
		extraargs = "-n OSKDATA"
		files = {
			"exchange/README.txt"
		}
	}
	# 32 MB, the same as the Pi's. A PSBT is a few kilobytes and a
	# timings file a few more, so the size is not about capacity: it is
	# the smallest partition that is comfortably FAT16 and that every
	# computer's file manager will mount without comment.
	size = 32M
}

image opensigner-x86_64-uefi.img {
	# GPT, because that is what a UEFI firmware looks for on a removable
	# disk, and because the EFI system partition is a GPT partition type
	# and not an MBR one.
	#
	# 1 MB alignment, the usual for a disk whose erase block size is not
	# known. The UUIDs are written out rather than generated, because two
	# builders must get the same bytes (PLANNING.md 11.1) and genimage
	# makes up a random one otherwise.
	hdimage {
		align = 1M
		partition-table-type = "gpt"
		disk-uuid = "4f70656e-5369-676e-6572-4b6974000000"
	}

	partition OSKBOOT {
		partition-type-uuid = "U"
		partition-uuid = "4f70656e-5369-676e-6572-4b6974000001"
		bootable = "true"
		image = "esp.vfat"
	}

	partition OSKDATA {
		partition-type-uuid = "F"
		partition-uuid = "4f70656e-5369-676e-6572-4b6974000002"
		image = "exchange.vfat"
	}
}
