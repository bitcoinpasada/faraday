# The Waveshare 2.8inch DPI LCD, as the shell is told about it when the
# boot script finds its GT911 (docs/IMAGES.md §3.1). No value may contain
# a space.

# 480x640 portrait at 286 dpi. No MOUNT: a handheld panel this small is
# compact either way (docs/ORIENTATION.md §5).
SIZE=480x640
DPI=286
NATIVE=portrait

# The evdev name to look for: the controller calls itself "Goodix
# Capacitive TouchScreen".
TOUCH_NAME=Goodix

# The grid the controller reports in. Waveshare's touch overlay declares
# touchscreen-size 480 x 640 with the axes swapped, the value 640x480 had
# on the firmware's framebuffer. The kernel's DPI path is a different
# driver, so this is to confirm on the panel (docs/IMAGES.md §3.1, §9.11).
TOUCH_GRID=640x480
