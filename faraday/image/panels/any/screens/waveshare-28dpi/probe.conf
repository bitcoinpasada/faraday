# What the boot script's probe expects of the 2.8-inch's touch controller
# (docs/IMAGES.md §3.2). Only an exact match applies the screen.
#
# KIND=gpio: the controller is on the GPIO header, so the probe runs after
# the DSI ones and the DPI pin setup is applied only once it has answered.
KIND=gpio

# The input device's name contains this.
TOUCH_NAME=Goodix

# The platform device the touch overlay's bit-banged I2C bus is declared
# as (the node `i2c@0` in waveshare-touch-28dpi), which the input
# device's sysfs path passes through. To confirm on the panel.
I2C_BUS=i2c@0

# The controller's address, in hex: Waveshare's overlay declares the
# GT911 at 14 and at 5d, since the controller takes one or the other
# from its reset sequence; 14 is the one the firmware-framebuffer image
# has found. To confirm on the panel.
I2C_ADDR=14

# No range check: the range is read only for a DSI panel.
RANGE=
