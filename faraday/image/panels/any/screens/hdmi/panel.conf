# An HDMI screen on a Pi (docs/IMAGES.md §3): any HDMI monitor with a USB
# keyboard and mouse, or Waveshare's 10.1inch HDMI LCD (B) with its USB
# touch. The boot script uses these values when its first check finds the
# HDMI connector connected, and when no panel is found.
#
# No size, density or turn is given, and none is needed:
#
#   size     DRM's framebuffer emulation is /dev/fb0 at the mode vc4 chose
#            from the screen's EDID, and the shell reads it from sysfs.
#   density  the EDID's, on a screen of 11 inches or less whose EDID gives
#            its size; otherwise `faraday.dpi=` on the kernel command line
#            (boards/pi3/cmdline.txt), 160, the density dp are 1:1 at.
#   turn     NATIVE and MOUNT are not given: a framebuffer taller than wide
#            is a screen portrait natively (docs/ORIENTATION.md §2).
#
# The 10.1-inch panel's USB touch is held back as every plugged-in device
# is and let in by tapping the target the app draws (F153); no TOUCH_NAME.
# The grid it reports in when its HID descriptor gives no range is the
# panel's 1280 x 800 (Waveshare's wiki, 10.1inch HDMI LCD (B)).
TOUCH_GRID=1280x800
