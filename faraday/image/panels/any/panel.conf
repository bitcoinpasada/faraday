# The one Pi image's panel (docs/IMAGES.md §3, F186): it names no screen.
# The boot script finds the screen and gives the app its values, from the
# directory of that screen under screens/ (README.md here says how), so
# this file gives the app nothing: /etc/faraday/args holds the dev flags
# and nothing else.
NAME="every Pi screen"

# The boot logo's size. The screen is not known when the image is built,
# so the logo is a small square, which the command line's
# fbcon=logo-pos:center (boards/pi3/cmdline.txt) puts in the middle of
# any screen.
LOGO_WIDTH=320
LOGO_HEIGHT=320
