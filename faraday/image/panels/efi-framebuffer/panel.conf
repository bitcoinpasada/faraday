# The display a UEFI firmware sets up and hands over, whatever it is.
#
# A panel directory usually says how large the display is, how dense it is
# and what its touch controller is called. None of that can be said here,
# and none of it has to be:
#
#   size     the firmware framebuffer reports its own, and the shell reads
#            it from sysfs when it is given no --size.
#   density  no firmware reports one. The shell takes it from
#            `faraday.dpi=` on the kernel command line, which the
#            board's cmdline.txt sets to 160 — the density the design
#            system's dp are 1:1 at.
#   touch    a laptop's touchscreen, touchpad, keyboard and mouse are all
#            found by reading what each /dev/input/event* says it can do,
#            so there is no name to look for.
#   turn     NATIVE and MOUNT are not given: a framebuffer taller than
#            wide is a panel portrait natively, the EDID's diagonal says
#            whether it is a small panel, and the machine's row on the
#            shell's known list says how it is mounted in its case
#            (docs/ORIENTATION.md §2). On a screen of 11 inches or less
#            the EDID's density is used instead of faraday.dpi.
NAME="firmware framebuffer"

# The framebuffer is not named here, and that is deliberate. `--fb` means
# "this is a file off the device": it tells the shell to write frames to
# the path given and *not* to ask sysfs about it, which is what makes the
# flag useful for writing into a file on a desktop. Naming /dev/fb0 with
# it would therefore turn off the one thing this panel depends on. The
# shell's default framebuffer is /dev/fb0 already, and reading
# /sys/class/graphics/fb0 is what it does when nothing has told it not to.

# The boot logo's size. The kernel draws its logo at the top left and
# does not scale it, so a panel whose size is known gets a logo the size
# of the panel with the mark in the middle; a display that could be
# 1366x768 or 3840x2160 gets a small square: the mark and name drawn at
# the size a logo this wide gives them, in a square the golden ratio
# around them, which the command line's fbcon=logo-pos:center puts in the
# middle until the app's first frame.
LOGO_WIDTH=320
LOGO_HEIGHT=320
