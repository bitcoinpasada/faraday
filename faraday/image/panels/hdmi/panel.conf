# An HDMI screen on a Pi (docs/IMAGES.md §3): any HDMI monitor with a USB
# keyboard and mouse, or Waveshare's 10.1inch HDMI LCD (B) with its USB
# touch. One image for every HDMI screen (F150): the screen says what it
# is through its EDID, so nothing here is specific to one of them except
# the grid the 10.1-inch panel's touch reports in.
#
# build.sh turns these into /etc/faraday/args, which the inittab passes to
# the app. No value may contain a space.
NAME="HDMI screen"

# Only the Compatible build drives HDMI: the kernel-mode-setting stack and
# USB input are what Strict leaves out. build.sh refuses another build.
BUILDS="compatible"

# Size, density and turn are not given, and need not be:
#
#   size     DRM's framebuffer emulation is /dev/fb0 at the mode vc4 chose
#            from the screen's EDID, and the shell reads it from sysfs.
#   density  the EDID's, on a screen of 11 inches or less whose EDID gives
#            its size, which the shell reads from /sys/class/drm; otherwise
#            `faraday.dpi=` on the kernel command line, which this panel's
#            cmdline.txt sets to 160, the density dp are 1:1 at, as the
#            stick does.
#   turn     NATIVE and MOUNT are not given: a framebuffer taller than wide
#            is a screen portrait natively, and the EDID's diagonal says
#            whether it is a small one (docs/ORIENTATION.md §2).

# The 10.1-inch panel's touch, the only input that panel has, is a USB
# touchscreen, and no USB device is trusted for the name it gives (F153,
# docs/IMAGES.md §2): it is held back as every plugged-in device is, and
# let in by tapping the target the app draws at a random place on the
# screen. A monitor's USB keyboard types the code the app shows. No
# TOUCH_NAME is given: the shell's default names the 2.8-inch panel's
# controller, which is trusted only on the I2C bus it is wired to.
#
# The grid the touch reports in when its HID descriptor gives no range:
# the panel's 1280 x 800 (Waveshare's wiki, 10.1inch HDMI LCD (B)).
TOUCH_GRID=1280x800

# The boot logo's size. The screen's size is not known when the image is
# built, so the logo is a small square, which the command line's
# fbcon=logo-pos:center puts in the middle, as on the stick.
LOGO_WIDTH=320
LOGO_HEIGHT=320
