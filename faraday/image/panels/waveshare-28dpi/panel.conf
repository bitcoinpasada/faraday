# The Waveshare 2.8" DPI LCD, as the shell needs to be told about it.
#
# build.sh turns these into /etc/opensigner/args, which the inittab passes
# to opensigner-pi, and into the size of the generated boot logo. No value
# may contain a space: the args file is word-split by the shell that
# starts the app.
NAME="Waveshare 2.8 inch DPI LCD"

# The panel in the orientation the firmware hands it over: 480x640
# portrait at 286 dpi.
WIDTH=480
HEIGHT=640
DPI=286

# The evdev name to look for. The controller calls itself "Goodix
# Capacitive TouchScreen"; any substring of that will do, and a panel
# whose controller is not found falls back to the first multitouch device.
TOUCH_NAME=Goodix

# The grid the controller reports in, which is the panel turned on its
# side. The shell scales a reported position by the panel size over this.
TOUCH_GRID=640x480
