[package]
name = "faraday-leak-scan"
version = "0.1.0"
description = "A global allocator for test binaries that fails on a freed or kept block holding a test secret (docs/SECRET-LEAKS.md); tests only"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints.rust]
# Not `workspace = true`: an allocator is `unsafe` to implement
# (`GlobalAlloc`), so this crate denies `unsafe_code` and allows it on
# that one impl, as faraday-crypto's `pinned.rs` does; the other workspace
# lint is repeated by hand.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# The workspace's: a long function carries an expect (tools/lint-layout.sh).
too_many_lines = "warn"
