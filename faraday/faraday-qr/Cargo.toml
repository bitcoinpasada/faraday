[package]
name = "faraday-qr"
version = "0.1.6"
description = "What Faraday's scanner reads and its QR sender writes beyond the codec (docs/QR.md): BBQr, SeedSigner's numbered parts, the Faraday file envelope, and the UR registry's key and wallet types"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-bip = { path = "../../core/faraday-bip" }
# BBQr's `Z` encoding is raw DEFLATE; decompressed here with the size bounded
# (docs/QR.md §4). Already in the build through `png` (docs/deps/miniz_oxide.md).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# The QR sender (send.rs): QR and UR encoding. The decoder (`decode`) is
# not needed to make codes.
faraday-codec = { path = "../../core/faraday-codec", default-features = false }
# The token a QR code made takes (docs/COMPUTE.md §2).
faraday-crypto = { path = "../../core/faraday-crypto" }

[dev-dependencies]
faraday-files = { path = "../faraday-files" }
faraday-codec = { path = "../../core/faraday-codec" }

[lints]
workspace = true
