[package]
name = "faraday-strings"
version = "0.2.0"
description = "Faraday's wording: every string Faraday's screens, the stick's device check and the Starter show"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-bip = { path = "../../core/faraday-bip" }
faraday-crypto = { path = "../../core/faraday-crypto" }
zeroize = { workspace = true, features = ["alloc"] }

# The Argon QR Vault's wording (AQRV specification, https://github.com/bitcoinpasada/aqrv, F245); only aqrv-app turns it on.
[features]
aqrv = []

[lints]
workspace = true
