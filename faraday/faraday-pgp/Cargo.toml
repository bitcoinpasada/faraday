[package]
name = "faraday-pgp"
version = "0.2.0"
description = "The OpenPGP subset Faraday makes: v4 Ed25519 keys, certificates, detached signatures, revocations, paperkey, and a key restored from its paperkey and certificate (docs/FLOWS.md, docs/GPG-PAPERKEY.md)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
zeroize = { workspace = true, features = ["alloc"] }
# Heap text that wipes itself, for a certificate's text.
faraday-text = { path = "../../core/faraday-text" }
subtle.workspace = true
base16ct = { workspace = true }
# Ed25519 signatures, the only public-key algorithm this crate writes.
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
# Version-4 fingerprints are SHA-1 of the key; it is used for nothing else.
sha1 = { version = "0.11", default-features = false }
# The signature hashes: SHA-256 and SHA-512.
sha2 = { workspace = true }
# The QR vault's OpenPGP message (docs/VAULT.md §1.2): Argon2id over the
# passphrase as faraday-vault runs it, HKDF-SHA-256 and the Compute token
# from faraday-crypto, AES-256-OCB over the trusted `aes`.
faraday-crypto = { path = "../../core/faraday-crypto" }
argon2 = { workspace = true }
base64ct.workspace = true
aes = { workspace = true }
ocb3 = { workspace = true }

[dev-dependencies]
# Signatures of shapes Faraday never writes, made in the tests to be
# refused (tests/verify_refusals.rs): the same crates as above.
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
sha2 = { workspace = true }

[lints]
workspace = true
