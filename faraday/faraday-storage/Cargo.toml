[package]
name = "faraday-storage"
version = "0.1.0"
description = "What Faraday's shells share about sticks: listing, reading, writing with read-back, and keeping the Inbox and Outbox across a lock"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-core = { path = "../faraday-core" }
faraday-files = { path = "../faraday-files" }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
# Transfer's tests: the desktop app and the device's app on either side
# of the codes, as the test wallets make them.
faraday-core = { path = "../faraday-core", features = ["testkit"] }
faraday-qr = { path = "../faraday-qr" }
osk-codec = { path = "../../core/osk-codec" }
osk-shell-api = { path = "../../core/osk-shell-api" }

[lints]
workspace = true
