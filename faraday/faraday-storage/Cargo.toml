[package]
name = "faraday-storage"
version = "0.1.8"
description = "What Faraday's shells share about sticks: listing, reading, writing with read-back, and keeping the Inbox and Outbox across a lock"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-core = { path = "../faraday-core" }
faraday-files = { path = "../faraday-files" }
faraday-strings = { path = "../faraday-strings" }
faraday-crypto = { path = "../../core/faraday-crypto" }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
# Transfer's tests: the desktop app and the device's app on either side
# of the codes, as the test wallets make them.
faraday-core = { path = "../faraday-core", features = ["testkit"] }
faraday-qr = { path = "../faraday-qr" }
faraday-codec = { path = "../../core/faraday-codec" }
faraday-shell-api = { path = "../../core/faraday-shell-api" }

[lints.rust]
# Not `workspace = true`: on Windows one function needs `unsafe`, asking
# kernel32 for the memory free for a vault's Argon2id
# (`memory_available_mib`; std has no way). `deny`, not `forbid`, so it
# alone can allow it, as faraday-crypto's `pinned.rs` and the Starter's
# shell do; the other workspace lint is repeated by hand.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# The workspace's: a long function carries an expect (tools/lint-layout.sh).
too_many_lines = "warn"
