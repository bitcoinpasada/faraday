# Faraday's fuzz targets: its own workspace, like upstream's fuzz/, so a
# nightly `cargo fuzz` build with sanitizer flags never shares a target
# directory or a lock file with the pinned workspace build. Run from
# faraday/fuzz: `cargo +nightly fuzz run fat`.
[package]
name = "faraday-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
faraday-fat = { path = "../faraday-fat" }
faraday-apk = { path = "../faraday-apk" }
faraday-intake = { path = "../faraday-intake" }
# The token that counts nothing, for the readers the targets call
# (docs/COMPUTE.md §3): a fuzz target keeps no drawing guarantee.
faraday-crypto = { path = "../../core/faraday-crypto", features = ["unchecked"] }

[profile.release]
debug = true

[[bin]]
name = "fat"
path = "fuzz_targets/fat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apk"
path = "fuzz_targets/apk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_wallet"
path = "fuzz_targets/read_wallet.rs"
test = false
doc = false
bench = false
