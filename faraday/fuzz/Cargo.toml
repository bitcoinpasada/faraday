# Faraday's fuzz targets: its own workspace, like upstream's fuzz/, so a
# nightly `cargo fuzz` build with sanitizer flags never shares a target
# directory or a lock file with the pinned workspace build. Run from
# faraday/fuzz: `cargo +nightly fuzz run fat`.
[package]
name = "faraday-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
faraday-fat = { path = "../faraday-fat" }
faraday-intake = { path = "../faraday-intake" }
# The app, with the test kit (the scan sheet opened for a purpose,
# `testkit::open_scan`): `classify_file`, `inbox_found`, `app_scanned`,
# `edid`, `bip39_words`. The shipped binaries are built without it.
faraday-core = { path = "../faraday-core", features = ["testkit"] }
faraday-shell-api = { path = "../../core/faraday-shell-api" }
faraday-bip = { path = "../../core/faraday-bip" }
faraday-qr = { path = "../faraday-qr" }
faraday-files = { path = "../faraday-files" }
faraday-vault = { path = "../faraday-vault" }
faraday-boot = { path = "../faraday-boot" }
# `pe_image` signs any image (`sign-any`); `release_sums` checks a
# release's sums with faraday-pgp (F134).
faraday-sb = { path = "../faraday-sb", features = ["sign-any"] }
faraday-pgp = { path = "../faraday-pgp" }
faraday-payload = { path = "../faraday-payload" }
# `gpt.rs` of the Starter shell is included by path and uses its api.
faraday-starter = { path = "../faraday-starter" }
# The token that counts nothing, for the readers the targets call
# (docs/COMPUTE.md §3): a fuzz target keeps no drawing guarantee.
faraday-crypto = { path = "../../core/faraday-crypto", features = ["unchecked"] }

[profile.release]
debug = true

[[bin]]
name = "fat"
path = "fuzz_targets/fat.rs"
test = false
doc = false
bench = false

