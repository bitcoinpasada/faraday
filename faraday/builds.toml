# Every build this repository makes, and the ones planned, one [[build]]
# each. Tools that offer a choice of builds read this file rather than a
# list of their own, so a new build is added here and nowhere else; a new
# board or panel directory under faraday/image/ without a build here fails
# `just lint` (tools/lint-builds.py).
#
#   id        a short name, unique
#   label     what a person reads
#   group     "app", "image" or "starter"
#   status    "built": the recipe below builds it today
#             "untried": it has a recipe, but nobody has built or booted it
#             "planned": a document plans it (spec); it has no recipe yet
#   board, panel  for an image: the directories under faraday/image/boards
#             and faraday/image/panels it is built from
#   recipe    the just recipe; vars are just variables set before its name
#             (`just board=pi3 faraday-pi-image`), args its arguments,
#             env the environment it needs ({version} is the release's)
#   needs     what must be built first: "payload" is the stick and Pi
#             images staged by faraday/tools/stage-release.sh's first pass
#   dev       true when dev=1 builds a dev variant (a console and a login)
#   outputs   the files it leaves, from the repository's root; {dev} is
#             "-dev" for a dev build and "" otherwise
#   release   the files a release publishes from it ({version}), if any
#   hardware  for an image: the [[hardware]] entry it is offered under
#   build     for an image: "strict" or "compatible" (docs/IMAGES.md §1)
#   option    for an image: what tells it from another image of the same
#             hardware and build, as a person reads it ("Ribbon cable (DSI)")
#
# And one [[hardware]] entry for each piece of hardware the download page
# offers a tile for (docs/IMAGES.md §7, F147), in the tiles' order:
#
#   id        a short name, unique; the download page's address
#   label     the tile's name, as a person reads it
#   fits      what it runs on, as a person reads it ("Pi 3 or Zero 2 W")
#   soon      what it will also run on once that is built ("Pi 4"), if any
#   tested    true once a built image of it has been tried on the hardware
#
# A tile reads Tested when tested is true, Looking for testers when an image
# of it is built but not tried, and Coming soon when none is built yet; its
# page offers the Strict image where one is built, the other beside it.

# ---------------------------------------------------------------- hardware

[[hardware]]
id = "pc"
label = "A laptop or PC"
fits = "From a USB stick"
tested = true

[[hardware]]
id = "pi-2-8-inch"
label = "Pi + 2.8-inch screen"
fits = "Pi 3"
soon = "Zero 2 W and Pi 4"
tested = true

[[hardware]]
id = "pi-5-inch"
label = "Pi + 5-inch screen"
fits = "Pi 3"
soon = "Pi 4"
tested = false

[[hardware]]
id = "pi-7-inch"
label = "Pi + 7-inch screen"
fits = "Pi 3"
soon = "Pi 4"
tested = false

[[hardware]]
id = "pi-10-inch"
label = "Pi + 10-inch screen"
fits = "Pi 3"
soon = "Pi 4"
tested = false

[[hardware]]
id = "pi-monitor"
label = "Pi + HDMI screen"
fits = "Pi 3 or Zero 2 W"
soon = "Pi 4"
tested = false

# ---------------------------------------------------------------- apps

[[build]]
id = "desktop-linux"
label = "Faraday Demo for Linux"
group = "app"
status = "built"
recipe = "faraday-linux-bin"
outputs = ["out/linux/faraday"]

[[build]]
id = "desktop-windows"
label = "Faraday Demo for Windows"
group = "app"
status = "built"
recipe = "faraday-windows-bin"
args = ["build", "out/windows", "out/build/run", "faraday-desktop", "faraday"]
outputs = ["out/windows/faraday.exe"]

# ---------------------------------------------------------------- images

[[build]]
id = "stick-strict"
label = "PC stick (x86-64, UEFI), Strict build"
group = "image"
status = "built"
board = "x86_64-uefi"
panel = "efi-framebuffer"
recipe = "faraday-stick-image"
vars = { build = "strict" }
hardware = "pc"
build = "strict"
dev = true
outputs = ["out/stick/faraday-x86_64-uefi-strict{dev}.img"]
release = ["faraday-stick-{version}-x86_64-uefi-strict.img.xz", "faraday-{version}-BOOTX64-strict.EFI"]

[[build]]
id = "stick-compatible"
label = "PC stick (x86-64, UEFI), Compatible build"
group = "image"
status = "built"
board = "x86_64-uefi"
panel = "efi-framebuffer"
recipe = "faraday-stick-image"
vars = { build = "compatible" }
hardware = "pc"
build = "compatible"
dev = true
outputs = ["out/stick/faraday-x86_64-uefi-compatible{dev}.img"]
release = ["faraday-stick-{version}-x86_64-uefi-compatible.img.xz", "faraday-{version}-BOOTX64-compatible.EFI"]

[[build]]
id = "pi3-waveshare-28dpi"
label = "Raspberry Pi 3, 2.8-inch screen"
group = "image"
status = "built"
board = "pi3"
panel = "waveshare-28dpi"
recipe = "faraday-pi-image"
vars = { board = "pi3", panel = "waveshare-28dpi" }
hardware = "pi-2-8-inch"
build = "strict"
dev = true
outputs = ["out/pi/faraday-pi3-waveshare-28dpi{dev}.img"]
release = ["faraday-pi-{version}-pi3-waveshare-28dpi.img.xz"]

# ---------------------------------------------------------------- the Starter

[[build]]
id = "starter-linux"
label = "Faraday Starter for Linux"
group = "starter"
status = "built"
recipe = "faraday-linux-bin"
args = ["out/linux", "out/build/run", "faraday-starter-shell", "faraday-starter"]
env = { FARADAY_STARTER_PAYLOAD = "out/payload/{version}/linux" }
needs = "payload"
outputs = ["out/linux/faraday-starter"]
release = ["Faraday-Starter-{version}-Linux.tar.gz"]

[[build]]
id = "starter-windows"
label = "Faraday Starter for Windows"
group = "starter"
status = "built"
recipe = "faraday-windows-bin"
env = { FARADAY_STARTER_PAYLOAD = "out/payload/{version}/windows" }
needs = "payload"
outputs = ["out/windows/faraday-starter.exe"]
release = ["Faraday-Starter-{version}-Windows.exe"]

# ---------------------------------------------------------------- planned (F145)
# Each Pi image starts the 3B, 3B+ and Zero 2 W, and the Pi 4 once it is
# built (F147); the DSI screens fit the 3B, 3B+ and Pi 4.

[[build]]
id = "pi3-waveshare-28dpi-compatible"
label = "Raspberry Pi, 2.8-inch screen, Compatible build"
group = "image"
status = "planned"
spec = "docs/IMAGES.md"
hardware = "pi-2-8-inch"
build = "compatible"

[[build]]
id = "pi3-5inch-compatible"
label = "Raspberry Pi, 5-inch screen (Touch Display 2)"
group = "image"
status = "planned"
spec = "docs/IMAGES.md"
hardware = "pi-5-inch"
build = "compatible"

[[build]]
id = "pi3-7inch-compatible"
label = "Raspberry Pi, 7-inch DSI screen"
group = "image"
status = "planned"
spec = "docs/IMAGES.md"
hardware = "pi-7-inch"
build = "compatible"

[[build]]
id = "pi3-10inch-dsi-compatible"
label = "Raspberry Pi, 10-inch DSI screen"
group = "image"
status = "planned"
spec = "docs/IMAGES.md"
hardware = "pi-10-inch"
build = "compatible"

[[build]]
id = "pi3-monitor-compatible"
label = "Raspberry Pi, an HDMI screen (a monitor, or the 10-inch HDMI panel)"
group = "image"
status = "planned"
spec = "docs/IMAGES.md"
hardware = "pi-monitor"
build = "compatible"
