[package]
name = "faraday-starter"
version = "0.1.9"
description = "The Starter's state, screens and decisions (docs/STARTER.md): events in, commands out, no I/O"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
faraday-shell-api = { path = "../../core/faraday-shell-api" }
faraday-draw = { path = "../../core/faraday-draw" }
faraday-codec = { path = "../../core/faraday-codec" }
# The network the blank sheet names (`faraday-core` brings it already).
faraday-bip = { path = "../../core/faraday-bip" }
# The desktop app's own Transfer and Learn, held in online mode
# (docs/STARTER.md §2), and the drawing every Faraday screen uses.
faraday-core = { path = "../faraday-core" }
faraday-strings = { path = "../faraday-strings" }
# The token the notes' and the template's PDFs take (docs/COMPUTE.md §2).
faraday-crypto = { path = "../../core/faraday-crypto" }
# Faraday's drawing.
faraday-ui = { path = "../faraday-ui" }
# Faraday's own Learn pages.
faraday-learn = { path = "../faraday-learn" }
# The website's guides to starting a computer from the stick.
faraday-guides = { path = "../faraday-guides" }
# A boot partition's refusals: faraday-fat's kinds, worded by faraday-files.
faraday-fat = { path = "../faraday-fat" }
faraday-files = { path = "../faraday-files" }
# The BitLocker recovery key held for the sheet (docs/STARTER.md §3.4, §6,
# F49), and the sheet's buffers, wiped when dropped.
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
# The screens written as PNG by `examples/snap.rs` (`just
# faraday-starter-snap`); never in the Starter itself.
png.workspace = true
# The test kit's `learn_scroll_to`, for the tests and `examples/snap.rs`;
# never in the Starter itself.
faraday-core = { path = "../faraday-core", features = ["testkit"] }
# Faraday Demo's app as the shell makes it, for the tests and
# `examples/snap.rs` that open it inside the Starter (F126); the Starter
# itself takes it from the shell.
faraday-desktop = { path = "../shells/desktop" }

[lints]
workspace = true
