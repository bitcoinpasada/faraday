[package]
name = "faraday-starter"
version = "0.1.4"
description = "The Starter's state, screens and decisions (docs/STARTER.md): events in, commands out, no I/O"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
osk-shell-api = { path = "../../core/osk-shell-api" }
osk-ui = { path = "../../core/osk-ui" }
osk-codec = { path = "../../core/osk-codec" }
osk-learn = { path = "../../core/osk-learn" }
opensigner-core = { path = "../../opensigner/opensigner-core" }
# The network the blank sheet names (`faraday-core` brings it already).
osk-bip = { path = "../../core/osk-bip" }
# The desktop app's own Transfer and Learn, held in online mode
# (docs/STARTER.md §2), and the drawing every Faraday screen uses. `guides`
# turns on the held app's guide pages and firmware sketches, which the
# Starter shows and the desktop app, the stick and the Pi do not.
faraday-core = { path = "../faraday-core", features = ["guides"] }
# Faraday's drawing.
faraday-ui = { path = "../faraday-ui" }
# Faraday's own Learn pages.
faraday-learn = { path = "../faraday-learn" }
# The website's guides to starting a computer from the stick.
faraday-guides = { path = "../faraday-guides" }

[dev-dependencies]
# The screens written as PNG by `examples/snap.rs` (`just
# faraday-starter-snap`); never in the Starter itself.
png.workspace = true

[lints]
workspace = true
