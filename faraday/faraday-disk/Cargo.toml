[package]
name = "faraday-disk"
version = "0.2.0"
description = "The disk process (docs/SECURITY-MODEL.md): unprivileged, it reads and writes the FAT partitions faraday-grant hands it and answers the app's shell over a pipe"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# A Faraday stick's layout, the boot partitions' names and labels, and the
# medium's record (docs/STICK-IDENTITY.md §5); std alone.
faraday-boot = { path = "../faraday-boot" }
faraday-fat = { path = "../faraday-fat" }
faraday-files = { path = "../faraday-files" }
# The words of its refusals.
faraday-strings = { path = "../faraday-strings" }
faraday-crypto = { path = "../../core/faraday-crypto" }
faraday-text = { path = "../../core/faraday-text" }
zeroize = { workspace = true, features = ["alloc"] }
# O_DIRECT, the flag for the read-back that skips the kernel's cache.
libc = { workspace = true }

[lints]
workspace = true
