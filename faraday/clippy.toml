# Clippy's settings for Faraday's crates. Clippy reads the nearest
# clippy.toml above each crate's manifest, so this governs every crate
# under faraday/ and none in core/ (docs/COMPUTE.md §3, §7).
#
# Third-party paths only: what Faraday's own crates and core's could hold
# is held by the token's types and by the costs lint (tools/costs-lint).
# Each path names the crate that defines it (`bitcoin`, `secp256k1`,
# `miniscript`), which Faraday reaches through `faraday_bip`'s re-exports.
# `just lint` fails when clippy prints a warning about this file, such as
# a path that names nothing (tools/clippy.py).

# A token for costly work (`faraday_crypto::work::Compute`) is minted only at
# the entry points docs/COMPUTE.md §3 lists, each under
# `#[expect(clippy::disallowed_methods, reason = "a mint: …")]`; the
# token that counts nothing is never Faraday's. `unchecked` exists only
# under faraday-crypto's `unchecked` feature, which no crate clippy checks
# here turns on, so the path names nothing in them: `allow-invalid` keeps
# that from being a warning, and the entry still holds wherever the
# feature is on. The costs lint rejects `unchecked` under faraday/ in
# any case (docs/COMPUTE.md §8).
disallowed-methods = [
    { path = "faraday_crypto::work::Compute::new", reason = "a mint: only at docs/COMPUTE.md §3's sites, under #[expect]" },
    { path = "faraday_crypto::work::Compute::unchecked", reason = "counts nothing: core's tests and the fuzz targets only (docs/COMPUTE.md §3)", allow-invalid = true },
    # Key work done outside faraday-bip's gated functions counts nothing and
    # takes no token (docs/COMPUTE.md §7).
    { path = "bitcoin::bip32::Xpriv::new_master", reason = "a master key: faraday_bip::keys::MasterKey::from_seed, which takes the token" },
    { path = "bitcoin::bip32::Xpriv::derive_priv", reason = "a key derivation: faraday_bip::keys::MasterKey::derive, which takes the token" },
    { path = "bitcoin::bip32::Xpriv::fingerprint", reason = "an elliptic-curve multiplication: MasterKey::fingerprint keeps it" },
    { path = "bitcoin::bip32::Xpub::from_priv", reason = "an elliptic-curve multiplication: MasterKey::xpub or DerivedKey::to_xpub, which take the token" },
    { path = "bitcoin::bip32::Xpub::derive_pub", reason = "a key derivation: a wallet's addresses through faraday_bip::policy::WalletPolicy, which takes the token" },
    { path = "secp256k1::PublicKey::from_secret_key", reason = "an elliptic-curve multiplication: DerivedKey::to_xpub, which takes the token" },
    { path = "bitcoin::psbt::Psbt::deserialize", reason = "a PSBT parse: faraday_psbt::Psbt::parse_bytes, which takes the token" },
    # The key boundary (docs/KEYS.md): key material is made and used only in
    # faraday-keys, which the crates that make it (faraday-keys, -vault, -pgp
    # and -sb) are the only ones to call these in; a legitimate use elsewhere
    # carries #[expect(clippy::disallowed_methods or _types, reason = "...")].
    { path = "faraday_bip::bip39::Mnemonic::to_seed", reason = "key boundary (docs/KEYS.md): a seed in hand, which faraday-keys works out" },
    { path = "faraday_bip::codex32::Codex32::to_seed", reason = "key boundary (docs/KEYS.md): a seed in hand, which faraday-keys works out" },
    { path = "faraday_bip::bip39::Mnemonic::parse", reason = "key boundary (docs/KEYS.md): seed words made into a Mnemonic: faraday_keys::words does it" },
    { path = "faraday_bip::bip39::Mnemonic::from_indices", reason = "key boundary (docs/KEYS.md): seed words made into a Mnemonic: faraday_keys::words does it" },
    { path = "faraday_bip::bip39::Mnemonic::from_entropy", reason = "key boundary (docs/KEYS.md): seed words made into a Mnemonic: faraday_keys::words does it" },
    { path = "faraday_codec::seedqr::from_digits", reason = "key boundary (docs/KEYS.md): a SeedQR decoded into a Mnemonic: faraday_keys::words does it" },
    { path = "faraday_codec::seedqr::from_entropy", reason = "key boundary (docs/KEYS.md): a SeedQR decoded into a Mnemonic: faraday_keys::words does it" },
    { path = "faraday_bip::slip39::split", reason = "key boundary (docs/KEYS.md): a SLIP-39 split: faraday-keys does it" },
    { path = "faraday_vault::records::words_of", reason = "key boundary (docs/KEYS.md): a vault record's words read: faraday_keys::words does it" },
    { path = "faraday_pgp::paperkey::line", reason = "key boundary (docs/KEYS.md): a paperkey read back: faraday_keys::gpg::Restore does it" },
    { path = "faraday_pgp::paperkey::read_text", reason = "key boundary (docs/KEYS.md): a paperkey read back: faraday_keys::gpg::Restore does it" },
    { path = "faraday_pgp::paperkey::read_raw", reason = "key boundary (docs/KEYS.md): a paperkey read back: faraday_keys::gpg::Restore does it" },
    { path = "faraday_pgp::paperkey::entries", reason = "key boundary (docs/KEYS.md): a paperkey read back: faraday_keys::gpg::Restore does it" },
    { path = "faraday_pgp::paperkey::check", reason = "key boundary (docs/KEYS.md): a paperkey read back: faraday_keys::gpg::Restore does it" },
    { path = "faraday_pgp::certificate::restore", reason = "key boundary (docs/KEYS.md): a key restored from a paperkey: faraday_keys::gpg::Restore does it" },
    { path = "faraday_sb::make", reason = "key boundary (docs/KEYS.md): Secure Boot keys made, which faraday-keys does" },
    { path = "faraday_sb::enrolment", reason = "key boundary (docs/KEYS.md): Secure Boot keys used, which faraday-keys does" },
    { path = "faraday_sb::pe::sign", reason = "key boundary (docs/KEYS.md): Secure Boot keys used, which faraday-keys does", allow-invalid = true },
    { path = "faraday_vault::file::open", reason = "key boundary (docs/KEYS.md): a vault opened, which faraday-keys does" },
    { path = "faraday_vault::file::seal", reason = "key boundary (docs/KEYS.md): a vault sealed, which faraday-keys does" },
    { path = "faraday_vault::file::create", reason = "key boundary (docs/KEYS.md): a vault created, which faraday-keys does" },
    { path = "faraday_vault::file::measure", reason = "key boundary (docs/KEYS.md): a vault's slot key derived, which faraday-keys does" },
    { path = "faraday_vault::kdbx::open", reason = "key boundary (docs/KEYS.md): a vault opened, which faraday-keys does" },
    { path = "faraday_vault::kdbx::seal", reason = "key boundary (docs/KEYS.md): a vault sealed, which faraday-keys does" },
    { path = "faraday_kef::open", reason = "key boundary (docs/KEYS.md): a KEF code opened, which faraday-keys does" },
    { path = "faraday_kef::open_with_key", reason = "key boundary (docs/KEYS.md): a KEF code opened, which faraday-keys does" },
    { path = "faraday_kef::seal", reason = "key boundary (docs/KEYS.md): a KEF code sealed, which faraday-keys does" },
    { path = "faraday_kef::seal_with_key", reason = "key boundary (docs/KEYS.md): a KEF code sealed, which faraday-keys does" },
    { path = "faraday_psbt::sign", reason = "key boundary (docs/KEYS.md): a PSBT signed, which faraday-keys does" },
    { path = "faraday_psbt::sweep::sign", reason = "key boundary (docs/KEYS.md): a PSBT signed with a WIF key, which faraday-keys does" },
    { path = "faraday_bip::aezeed::decode", reason = "key boundary (docs/KEYS.md): an aezeed decoded, which faraday-keys does" },
    { path = "faraday_bip::aezeed::node_key", reason = "key boundary (docs/KEYS.md): an aezeed's node key, which faraday-keys works out" },
    { path = "faraday_bip::codex32::fresh_set", reason = "key boundary (docs/KEYS.md): a codex32 set made: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::Codex32::from_seed", reason = "key boundary (docs/KEYS.md): a codex32 set made: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::Codex32::split", reason = "key boundary (docs/KEYS.md): a codex32 set split: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::Codex32::recover", reason = "key boundary (docs/KEYS.md): a codex32 set recovered: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::Codex32::derive_share", reason = "key boundary (docs/KEYS.md): a codex32 share derived: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_keys::Held::release", reason = "key boundary (docs/KEYS.md): a held secret leaves its guard only at a named site, under #[expect]" },
    { path = "faraday_keys::vault::IntoRecord::into_record", reason = "key boundary (docs/KEYS.md): a held secret leaves its guard only at a named site, under #[expect]" },
]

# A descriptor read by miniscript directly is a parse that counts
# nothing: wallets are read through faraday_bip::policy::WalletPolicy, which
# takes the token. The test kit and the examples build coordinators'
# transactions with it, under #[expect].
disallowed-types = [
    { path = "miniscript::Descriptor", reason = "a descriptor parse: faraday_bip::policy::WalletPolicy, which takes the token" },
    # The key boundary (docs/KEYS.md): key material is made and used only in
    # faraday-keys, which the crates that make it (faraday-keys, -vault, -pgp
    # and -sb) are the only ones to call these in; a legitimate use elsewhere
    # carries #[expect(clippy::disallowed_methods or _types, reason = "...")].
    { path = "faraday_bip::keys::MasterKey", reason = "key boundary (docs/KEYS.md): a key in hand, which faraday-keys holds" },
    { path = "faraday_bip::keys::DerivedKey", reason = "key boundary (docs/KEYS.md): a key in hand, which faraday-keys holds" },
    { path = "secp256k1::SecretKey", reason = "key boundary (docs/KEYS.md): a key in hand, which faraday-keys holds" },
    { path = "bitcoin::bip32::Xpriv", reason = "key boundary (docs/KEYS.md): a key in hand, which faraday-keys holds" },
    { path = "secp256k1::Keypair", reason = "key boundary (docs/KEYS.md): a key in hand, which faraday-keys holds" },
    { path = "bitcoin::PrivateKey", reason = "key boundary (docs/KEYS.md): a key in hand, which faraday-keys holds" },
    { path = "faraday_bip::musig::SecNonce", reason = "key boundary (docs/KEYS.md): a nonce in hand, which faraday-keys holds" },
    { path = "faraday_bip::wif::SingleKey", reason = "key boundary (docs/KEYS.md): a WIF read into a key, which faraday-keys does" },
    { path = "faraday_bip::silent::Receiver", reason = "key boundary (docs/KEYS.md): a silent-payments receiver holds the scan key, which faraday-keys keeps" },
    { path = "faraday_bip::codex32::FreshSet", reason = "key boundary (docs/KEYS.md): a codex32 set made: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::ChecksumWorksheet", reason = "key boundary (docs/KEYS.md): a worksheet of a codex32 set's strings: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::TranslationWorksheet", reason = "key boundary (docs/KEYS.md): a worksheet of a codex32 set's strings: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_pgp::Key", reason = "key boundary (docs/KEYS.md): a GPG key, which faraday-keys holds" },
    { path = "faraday_pgp::paperkey::Line", reason = "key boundary (docs/KEYS.md): a paperkey read back: faraday_keys::gpg::Restore does it" },
    { path = "faraday_pgp::paperkey::Entry", reason = "key boundary (docs/KEYS.md): a paperkey read back: faraday_keys::gpg::Restore does it" },
    { path = "faraday_pgp::paperkey::Progress", reason = "key boundary (docs/KEYS.md): a paperkey read back: faraday_keys::gpg::Restore does it" },
    { path = "faraday_pgp::certificate::Restored", reason = "key boundary (docs/KEYS.md): a key restored from a paperkey: faraday_keys::gpg::Restore does it" },
    { path = "faraday_sb::Keys", reason = "key boundary (docs/KEYS.md): Secure Boot keys, which faraday-keys makes and uses" },
    { path = "faraday_sb::x509::Pair", reason = "key boundary (docs/KEYS.md): Secure Boot keys, which faraday-keys makes and uses" },
    { path = "faraday_vault::file::Opened", reason = "key boundary (docs/KEYS.md): a vault opened, which faraday-keys does" },
    { path = "faraday_kef::Opened", reason = "key boundary (docs/KEYS.md): a KEF code opened, which holds its plaintext; faraday-keys does it" },
]

# A function over this cognitive complexity carries an expect with its reason
# (docs/STRUCTURE-PASS.md §7.2). The same number is in core/clippy.toml.
cognitive-complexity-threshold = 35
