[package]
name = "faraday-companion-ffi"
version = "0.1.1"
description = "The JNI entry points that let Faraday Companion's Android shell drive its core (a copy of opensigner-ffi at d26b84e)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# Built as `libfaraday_companion_ffi.so` and copied into the app's
# jniLibs as `libfaraday_companion.so` by `just companion-lib`: the core's
# own crate already has the library name `faraday_companion`, and two
# libraries of one name in one workspace collide in target/. `rlib` as
# well so the safe half (handle table, command encoding) has host unit
# tests; the JNI entry points cannot run on the host.
crate-type = ["cdylib", "rlib"]

# Nothing on docs/COMPANION.md §3's list: `tools/lint-companion-deps.sh`
# checks this crate's tree.
[dependencies]
faraday-companion = { path = "../faraday-companion" }
# The page's colour, for the window behind the frame.
faraday-ui = { path = "../faraday-ui" }
# The camera's frames are read on its worker thread, not the UI thread.
faraday-scanner = { path = "../faraday-scanner" }
osk-shell-api = { path = "../../core/osk-shell-api" }
# Types and function-pointer tables only; no code. Pinned exactly, as
# upstream's opensigner-ffi pins it: 0.3.1 re-exports 0.4, which brings
# a proc-macro and its parsers into the graph.
jni-sys = "=0.3.0"
zeroize = { workspace = true, features = ["alloc"] }

# Not `workspace = true`: the workspace forbids `unsafe_code`, and a
# `forbid` cannot be lifted by the crate that needs it. As in upstream's
# opensigner-ffi, the unsafe is all in `src/jni.rs` (README.md).
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
