# The Raspberry Pi Zero 2 W.
#
# The same BCM2710 SoC as the 3B+ in a smaller package: the same 32-bit
# armv7 target, the same kernel, the same firmware, the same drivers.
# linux.fragment is a symbolic link to the pi3 one for that reason; if the
# two ever have to differ, replace the link with a file.
NAME="Raspberry Pi Zero 2 W"

# Nobody has booted this. It is here because the parts are the 3B+'s and
# the board is the obvious second one; it has not been on a card.
STATUS=untested

RUST_TARGET=armv7-unknown-linux-gnueabihf
CC=arm-linux-gnueabihf-gcc
CFLAGS=""

DTBS="bcm2710-rpi-zero-2 bcm2710-rpi-zero-2-w"

# How this board is told where the kernel is, and what it boots from.
#
#   FIRMWARE    rpi: the GPU firmware reads config.txt and cmdline.txt
#               from the boot partition, so build.sh assembles both and
#               the rpi-firmware package puts them there.
#   CMDLINE     file: the command line is a file the firmware reads.
#   EXCHANGE    the partition rcS mounts at /mnt/microsd. A card is always
#               the same node.
#   CONSOLE_TTY where the dev variant's getty runs.
#   IMAGE       what genimage.cfg calls the finished image.
FIRMWARE=rpi
CMDLINE=file
EXCHANGE=/dev/mmcblk0p2
CONSOLE_TTY=ttyAMA0
IMAGE=opensigner-pi.img
