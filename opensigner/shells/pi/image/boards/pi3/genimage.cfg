# The card: one FAT boot partition the Pi firmware reads, and one empty FAT
# partition for exchanging files with a computer.
#
# There is no root filesystem partition. The whole rootfs is an initramfs
# inside zImage, so once the firmware has read the boot partition the card is
# not needed and nothing writes to it.

image boot.vfat {
	vfat {
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start_x.elf",
			"rpi-firmware/fixup_x.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"zImage",
			@DTBS@
		}
	}
	# 32 MB. The content above is about 16 MB — the firmware blobs, the
	# overlays, two device trees and zImage with the whole root
	# filesystem inside it — and the partition is twice that so a
	# larger kernel or another device tree does not need a new layout.
	# It is FAT16 at this size, which every computer mounts.
	size = 32M
}

# Empty but for a note saying what it is for. Init mounts this at
# /mnt/microsd, so a PSBT dropped here from a computer is what the app
# reads and a signed one is written back beside it. (genimage will not make
# a vfat with no files in it, and a partition that explains itself is better
# than one that does not.)
image exchange.vfat {
	vfat {
		extraargs = "-n OSKDATA"
		files = {
			"exchange/README.txt"
		}
	}
	# 32 MB. A PSBT is a few kilobytes and a timings file a few more, so
	# the size is not about capacity: it is the smallest partition that
	# is comfortably FAT16 and that every computer's file manager will
	# mount without comment.
	size = 32M
}

image opensigner-pi.img {
	# 4 MB alignment: the erase block size of the cards this runs from, and
	# what every other Pi image uses. Unaligned partitions work but make the
	# card do a read-modify-write on every boundary.
	hdimage {
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition exchange {
		partition-type = 0xC
		image = "exchange.vfat"
	}
}
