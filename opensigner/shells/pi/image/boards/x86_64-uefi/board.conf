# A laptop or a PC booted from an OpenSigner USB stick.
#
# Read by build.sh and by `just pi-bin` (which `just stick-bin` is), the
# same as every other board.
NAME="x86_64 PC with UEFI firmware"

# Nobody has booted this on a laptop. It has been booted in QEMU with
# OVMF, which is where the test in tools/stick-test.py runs it.
STATUS=untested

# The toolchain the shell is built with. musl static, so the binary needs
# no library in the image; the host's own gcc compiles the libsecp256k1
# sources, because the host is already the target's architecture and
# nothing has to be cross-compiled.
#
# _FORTIFY_SOURCE is off because the distribution's gcc turns it on by
# default and its checked string functions live in glibc: without this,
# libsecp256k1 calls __memcpy_chk and the static musl link has no such
# symbol. The headers are the host's either way; what they declare on
# x86_64 Linux is the same for both C libraries.
RUST_TARGET=x86_64-unknown-linux-musl
CC=gcc
CFLAGS="-U_FORTIFY_SOURCE"

# No device trees: a PC is described by ACPI, which the firmware hands
# over, and there is nothing to put on the boot partition.

# How this board is told where the kernel is, and what it boots from.
#
#   FIRMWARE    none: there is no firmware package and no configuration
#               file. The kernel is its own EFI application and the
#               firmware runs it because of where it is on the stick.
#   CMDLINE     kernel: no bootloader passes one, so the line is compiled
#               into the kernel and CONFIG_CMDLINE_OVERRIDE makes it the
#               only one.
#   EXCHANGE    the partition rcS mounts at /mnt/microsd. A stick is sda
#               on one machine and sdb on the next, so it is found by its
#               label and not by a node.
#   CONSOLE_TTY where the dev variant's getty runs.
#   IMAGE       what genimage.cfg calls the finished image.
FIRMWARE=none
CMDLINE=kernel
EXCHANGE=LABEL=OSKDATA
CONSOLE_TTY=ttyS0
IMAGE=opensigner-x86_64-uefi.img
