# Who owns each device node (security review 2026-09-11, M8).
#
# `mdev -s` in /etc/init.d/rcS walks /sys once at boot and applies these
# rules to the nodes devtmpfs already created. A node no line matches
# keeps mdev's own default, root:root 0660, which an unprivileged process
# cannot open: /dev/mmcblk0 and /dev/mmcblk0p1, /dev/i2c-*, /dev/vchiq and
# everything else stay root's.
#
# The first three lines are the whole user interface of the device: the
# panel, the touch controller, the camera. The rest are the character
# devices any program expects to find, at the modes the kernel itself
# gives them.

# The panel. The app opens it read-write and writes a frame per draw.
fb0			root:opensigner		0660

# The touch controller and any other input device. Read is all an evdev
# reader needs.
input/event[0-9]+	opensigner:opensigner	0640

# The capture device the scanner opens, read-write because V4L2 buffers
# are queued through it.
video[0-9]+		root:opensigner		0660

# The session's entropy comes from /dev/random, which is read and never
# written.
random			root:root		0444
urandom			root:root		0444

null			root:root		0666
zero			root:root		0666
full			root:root		0666
tty			root:root		0666
console			root:root		0600
