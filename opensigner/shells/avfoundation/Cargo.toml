[package]
name = "opensigner-avfoundation"
version = "0.1.0"
description = "AVFoundation capture through one small Objective-C file: the macOS twin of opensigner-v4l2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# No dependencies at all: the capture is `src/camera.m`, and the three
# functions it exports are declared in src/lib.rs.
[dependencies]

# `cc` compiles src/camera.m, and only on macOS; on every other target
# this crate is its documentation and the frame conversion, with no build
# step at all (docs/deps/cc.md).
[target.'cfg(target_os = "macos")'.build-dependencies]
cc = { workspace = true }

# The workspace lints are deliberately NOT inherited: this crate and
# `opensigner-v4l2` are the two exceptions to `unsafe_code = "forbid"`
# (docs/PLANNING.md §16.33). Every other workspace lint that matters here
# is repeated by hand.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
