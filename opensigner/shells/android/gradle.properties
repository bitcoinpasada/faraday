# -Dfile.encoding is set here rather than left to the machine: the
# platform default decides how sources are read, and a release APK must
# not depend on the locale of the box that built it.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# No AndroidX, so no Jetpack, no startup ContentProviders and no
# transitive dependency graph to audit. The shell uses framework APIs only.
android.useAndroidX=false
android.nonTransitiveRClass=true

kotlin.code.style=official
