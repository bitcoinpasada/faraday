    { path = "faraday_psbt::sweep::sign", reason = "key boundary (docs/KEYS.md): a PSBT signed with a WIF key, which faraday-keys does" },
    { path = "faraday_bip::aezeed::decode", reason = "key boundary (docs/KEYS.md): an aezeed decoded, which faraday-keys does" },
