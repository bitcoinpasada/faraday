    { path = "faraday_vault::file::open", reason = "key boundary (docs/KEYS.md): a vault opened, which faraday-keys does" },
    { path = "faraday_vault::file::seal", reason = "key boundary (docs/KEYS.md): a vault sealed, which faraday-keys does" },
    { path = "faraday_vault::file::create", reason = "key boundary (docs/KEYS.md): a vault created, which faraday-keys does" },
    { path = "faraday_vault::file::measure", reason = "key boundary (docs/KEYS.md): a vault's slot key derived, which faraday-keys does" },
    { path = "faraday_vault::kdbx::open", reason = "key boundary (docs/KEYS.md): a vault opened, which faraday-keys does" },
