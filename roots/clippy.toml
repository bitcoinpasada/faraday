    { path = "faraday_bip::codex32::fresh_set", reason = "key boundary (docs/KEYS.md): a codex32 set made: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::Codex32::from_seed", reason = "key boundary (docs/KEYS.md): a codex32 set made: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::Codex32::split", reason = "key boundary (docs/KEYS.md): a codex32 set split: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::Codex32::recover", reason = "key boundary (docs/KEYS.md): a codex32 set recovered: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_bip::codex32::Codex32::derive_share", reason = "key boundary (docs/KEYS.md): a codex32 share derived: faraday_keys::codex32::WorkSet does it" },
    { path = "faraday_keys::Held::release", reason = "key boundary (docs/KEYS.md): a held secret leaves its guard only at a named site, under #[expect]" },
    { path = "faraday_keys::vault::IntoRecord::into_record", reason = "key boundary (docs/KEYS.md): a held secret leaves its guard only at a named site, under #[expect]" },
    { path = "faraday_kernel::AskFor::into_parts", reason = "A16: the runtime opens an ask" },
    { path = "faraday_kernel::ChangeFor::into_parts", reason = "A16: the runtime opens a change" },
    { path = "faraday_kernel::Show::new", reason = "V8: an update forms no text; only the runtime builds a Show" },
    { path = "faraday_runtime::Runtime::record_ink", reason = "R4: the ink record is for the tour root" },
]

