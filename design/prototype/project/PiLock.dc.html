<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pi · Lock to use card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 268px; height: 358px; box-sizing: border-box; display: flex; flex-direction: column; background: #11161c; color: #e0e9ef; font-family: {{fontStack}}">
<div style="height: 56px; flex: none; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #1f2933"><h1 style="margin: 0; font-size: 20px; font-weight: 600">Lock to use card</h1></div>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #1f2933; font-size: 14px"><span>Main</span><span style="font-size: 12px; color: #f0c077">2 changes · sealed</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #1f2933; font-size: 14px"><span>OpenSigner</span><span style="font-size: 12px; color: #9aacb9">3 keys · wiped</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; font-size: 14px"><span>Outbox</span><span style="font-size: 12px; color: #9aacb9">1 file · to write</span></div>
</div>
<div style="padding: 0 16px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 52px; border-radius: 12px; border: 1px solid #303d49; background: transparent; color: #e0e9ef; font-family: inherit; font-size: 16px; font-weight: 500">Not now</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 0; background: #83d8ef; color: #0d1218; font-family: inherit; font-size: 16px; font-weight: 600">Lock</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"font":{"editor":"enum","options":["Inter","IBM Plex Sans","Source Sans 3"],"default":"Inter","section":"Look"},"$preview":{"width":268,"height":358}}'>
class Component extends DCLogic {
  renderVals() {
    const stacks = { "Inter": "'Inter', sans-serif", "IBM Plex Sans": "'IBM Plex Sans', sans-serif", "Source Sans 3": "'Source Sans 3', sans-serif" };
    return { fontStack: stacks[this.props.font] || stacks.Inter };
  }
}
</script>
</body>
</html>
