<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock to use this stick</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#83d8ef}a:hover{color:#b1e8f7}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #11161c; font-family: {{fontStack}}; color: #e0e9ef">
<dc-import name="Main" font="{{ font }}" hint-size="1280px,800px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(5,8,11,0.66); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-labelledby="lock-h" style="width: 520px; box-sizing: border-box; padding: 26px 26px 22px; border-radius: 16px; background: #19212a; border: 1px solid #303d49; box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: rgba(131,216,239,0.12); color: #83d8ef; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="9" width="10" height="12" rx="2"></rect><path d="M9 9V3.5h6V9"></path><path d="M11 6v.5M13 6v.5"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 3px">
<h2 id="lock-h" style="margin: 0; font-size: 20px; font-weight: 600">Lock to use this stick</h2>
<span style="font-size: 13px; color: #9aacb9">SanDisk Cruzer · 16 GB, as it describes itself</span>
</div>
</div>
<div style="display: flex; flex-direction: column; border-radius: 12px; border: 1px solid #222c37">
<div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #222c37"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aacb9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="12" cy="12" r="3.5"></circle></svg><span style="font-size: 14px">Main</span><span style="font-size: 13px; color: #f0c077">2 unsaved changes</span><span style="margin-left: auto; font-size: 13px; color: #9aacb9">sealed</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #222c37"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aacb9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16c2.5 0 3.5-7 5.5-7s1.5 7 3.5 7 2-3.5 4-3.5 2.5 2.5 5 2.5"></path><path d="M3 20.5h18"></path></svg><span style="font-size: 14px">OpenSigner</span><span style="font-size: 13px; color: #9aacb9">3 keys loaded</span><span style="margin-left: auto; font-size: 13px; color: #9aacb9">wiped</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 13px 16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aacb9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"></path><path d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"></path></svg><span style="font-size: 14px">Outbox</span><span style="font-size: 13px; color: #9aacb9">1 signed PSBT</span><span style="margin-left: auto; font-size: 13px; color: #9aacb9">ready to write</span></div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 10px; color: #e0e9ef; text-decoration: none; font-size: 14px; font-weight: 500">Not now</a>
<a href="StickVisit.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 10px; background: #83d8ef; color: #0d1218; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="11" width="15" height="10" rx="2"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11"></path></svg>Lock and use stick</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"font":{"editor":"enum","options":["Inter","IBM Plex Sans","Source Sans 3"],"default":"Inter","section":"Look"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const stacks = { "Inter": "'Inter', sans-serif", "IBM Plex Sans": "'IBM Plex Sans', sans-serif", "Source Sans 3": "'Source Sans 3', sans-serif" };
    return { font: this.props.font ?? 'Inter', fontStack: stacks[this.props.font] || stacks.Inter };
  }
}
</script>
</body>
</html>
