<span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Faraday</span>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{st.home.bg}}; color: {{st.home.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5.5 9v12h13V9"></path></svg>Home</a>
<a href="Vaults.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{st.vaults.bg}}; color: {{st.vaults.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="12" cy="12" r="3.5"></circle><path d="M12 8.5V7M12 17v-1.5M15.5 12H17M7 12h1.5"></path></svg>Vaults</a>
<a href="WalletsWallet.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{st.wallets.bg}}; color: {{st.wallets.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18.5c3.5 0 4.5-12 9-12s5.5 12 9 12"></path><path d="M12 6.5v12"></path><path d="M3 21h18"></path></svg>Wallets</a>
<a href="OpenSigner.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{st.opensigner.bg}}; color: {{st.opensigner.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16c2.5 0 3.5-7 5.5-7s1.5 7 3.5 7 2-3.5 4-3.5 2.5 2.5 5 2.5"></path><path d="M3 20.5h18"></path></svg>OpenSigner</a>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{st.gpg.bg}}; color: {{st.gpg.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4"></circle><path d="M10.5 12.5 20 3"></path><path d="M16.5 6.5l2.5 2.5"></path><path d="M14 9l2 2"></path></svg>GPG keys</a>
<a href="SecureBoot.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{st.secureboot.bg}}; color: {{st.secureboot.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.8-3.4 8-8 9-4.6-1-8-4.2-8-9V6z"></path><path d="M9 12l2.2 2.2L15.5 10"></path></svg>Secure Boot</a>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{st.qr.bg}}; color: {{st.qr.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1"></rect><rect x="14" y="3.5" width="6.5" height="6.5" rx="1"></rect><rect x="3.5" y="14" width="6.5" height="6.5" rx="1"></rect><path d="M14 14h2.5v2.5H14zM20.5 14v.01M14 20.5h.01M17 20.5h3.5M20.5 17v3.5"></path></svg>QR transfer</a>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{st.settings.bg}}; color: {{st.settings.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg>Settings</a>
<div style="flex-grow: 1"></div>
<div style="border-top: 1px solid #1f2933; padding: 16px 12px 0; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: #9aacb9">
<sc-if value="{{ unlocked }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #8bd4b2"></span><span style="color: #e0e9ef; font-weight: 500">Main</span><span>open</span><span style="margin-left: auto; color: #f0c077">2 unsaved</span></div>
</sc-if>
<sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #6f8291"></span><span style="color: #e0e9ef; font-weight: 500">Locked</span><span style="margin-left: auto">2 vaults in memory</span></div>
</sc-if>
<a href="Files.dc.html" style="display: flex; align-items: center; gap: 8px; margin: 0 -8px; padding: 6px 8px; border-radius: 6px; text-decoration: none; background: {{st.files.bg}}; color: {{st.files.fg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4.5l2 2.5H19a1.5 1.5 0 0 1 1.5 1.5v8.5A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5z"></path></svg><span>Files</span><span style="margin-left: auto; color: #e0e9ef">2 in · 1 out</span></a>
<div style="display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="9" width="10" height="12" rx="2"></rect><path d="M9 9V3.5h6V9"></path></svg><span>Sticks</span><span style="margin-left: auto; color: #e0e9ef">none</span></div>
<div style="display: flex; gap: 8px; padding-top: 6px">
<sc-if value="{{ unlocked }}" hint-placeholder-val="{{ true }}">
<a href="Unlock.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; border-radius: 8px; border: 1px solid #303d49; color: #e0e9ef; text-decoration: none; font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="11" width="15" height="10" rx="2"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11"></path></svg>Lock</a>
</sc-if>
<button type="button" aria-label="Power off" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #303d49; background: transparent; color: #9aacb9; display: flex; align-items: center; justify-content: center; padding: 0; margin-left: auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8.5"></path><path d="M6.5 6.5a7.8 7.8 0 1 0 11 0"></path></svg></button>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","vaults","wallets","opensigner","gpg","secureboot","qr","settings","files"],"default":"home"},"locked":{"editor":"boolean","default":false},"font":{"editor":null},"$preview":{"width":240,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const stacks = { "Inter": "'Inter', sans-serif", "IBM Plex Sans": "'IBM Plex Sans', sans-serif", "Source Sans 3": "'Source Sans 3', sans-serif" };
    const active = this.props.active ?? 'home';
    const locked = this.props.locked ?? false;
    const keys = ['home', 'vaults', 'wallets', 'opensigner', 'gpg', 'secureboot', 'qr', 'settings', 'files'];
    const st = {};
    keys.forEach((k) => {
      st[k] = k === active
        ? { bg: 'rgba(131,216,239,0.12)', fg: '#e0e9ef' }
        : { bg: 'transparent', fg: '#9aacb9' };
    });
    return {
      st,
      locked,
      unlocked: !locked,
      fontStack: stacks[this.props.font] || stacks.Inter
    };
  }
}
</script>
</body>
</html>
