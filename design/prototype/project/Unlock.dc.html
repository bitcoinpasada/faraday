<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unlock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#83d8ef}a:hover{color:#b1e8f7}
input::placeholder{color:#6f8291}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; background: #11161c; color: #e0e9ef; font-family: {{fontStack}}; overflow: hidden">
<dc-import name="Sidebar" active="vaults" locked="{{ yes }}" font="{{ font }}" hint-size="240px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center">
<div style="width: 560px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Unlock</h1>
<div role="radiogroup" aria-label="Vault" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ vaults }}" as="v" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{ v.checked }}" onClick="{{ v.pick }}" style="display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 12px; background: #19212a; border: 1px solid {{v.border}}; color: #e0e9ef; font-family: inherit; text-align: left; cursor: pointer">
<span style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: {{v.iconBg}}; color: {{v.iconFg}}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="12" cy="12" r="3.5"></circle><path d="M12 8.5V7M12 17v-1.5M15.5 12H17M7 12h1.5"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 14px">{{ v.name }}</span><span style="font-size: 12px; color: #9aacb9">{{ v.from }}</span></span>
<span style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px"><span style="font-size: 13px; font-variant-numeric: tabular-nums">{{ v.cost }}</span><span style="font-size: 12px; color: #9aacb9">{{ v.time }}</span></span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pp" style="font-size: 13px; font-weight: 500; color: #9aacb9">Passphrase</label>
<div style="display: flex; align-items: center; height: 48px; border-radius: 10px; background: #0d1218; border: 1px solid #83d8ef; box-shadow: 0 0 0 3px rgba(131,216,239,0.15)">
<input id="pp" type="password" value="correct horse battery staple" style="flex: 1; min-width: 0; height: 100%; padding: 0 14px; border: 0; background: transparent; color: #e0e9ef; font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: 2px; outline: none">
<button type="button" aria-label="Show passphrase" style="width: 44px; height: 44px; border: 0; background: transparent; color: #9aacb9; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="CreateVault.dc.html" style="font-size: 14px; text-decoration: none">Create a vault</a>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 22px; border-radius: 10px; background: #83d8ef; color: #0d1218; text-decoration: none; font-size: 15px; font-weight: 600">Unlock</a>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-top: 18px; border-top: 1px solid #1f2933; font-size: 12px; color: #6f8291"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect><path d="M9.5 2.5v3.5M14.5 2.5v3.5M9.5 18v3.5M14.5 18v3.5M2.5 9.5H6M2.5 14.5H6M18 9.5h3.5M18 14.5h3.5"></path></svg>This computer: {{ freeText }} free</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"font":{"editor":"enum","options":["Inter","IBM Plex Sans","Source Sans 3"],"default":"Inter","section":"Look"},"speed":{"editor":"float","default":1.8,"min":0.3,"max":20,"step":0.1,"unit":"s","section":"Machine"},"ramFree":{"editor":"int","default":15565,"min":256,"max":65536,"unit":"MiB","section":"Machine"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0 };
  }
  renderVals() {
    const stacks = { "Inter": "'Inter', sans-serif", "IBM Plex Sans": "'IBM Plex Sans', sans-serif", "Source Sans 3": "'Source Sans 3', sans-serif" };
    const speed = this.props.speed ?? 1.8;
    const ramFree = this.props.ramFree ?? 15565;
    const list = [
      { name: 'vault.ofv', from: 'From KINGSTON · 1.0 MB', mem: 256, passes: 3 },
      { name: 'vault-2.ofv', from: 'From KINGSTON · 262 KB', mem: 64, passes: 3 }
    ];
    const vaults = list.map((v, i) => {
      const on = i === this.state.picked;
      const secs = (v.mem / 1024) * v.passes * speed;
      return {
        ...v,
        cost: v.mem + ' MiB · ' + v.passes + ' passes',
        time: 'about ' + (secs < 10 ? secs.toFixed(1) : Math.round(secs)) + ' s here',
        checked: on ? 'true' : 'false',
        border: on ? '#83d8ef' : '#1f2933',
        iconBg: on ? 'rgba(131,216,239,0.14)' : '#222c37',
        iconFg: on ? '#83d8ef' : '#9aacb9',
        pick: () => this.setState({ picked: i })
      };
    });
    return {
      font: this.props.font ?? 'Inter',
      yes: true,
      fontStack: stacks[this.props.font] || stacks.Inter,
      vaults,
      freeText: (ramFree / 1024).toFixed(1) + ' GiB'
    };
  }
}
</script>
</body>
</html>
