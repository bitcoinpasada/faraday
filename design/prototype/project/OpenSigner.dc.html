<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenSigner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#83d8ef}a:hover{color:#b1e8f7}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; background: #11161c; color: #e0e9ef; font-family: {{fontStack}}; overflow: hidden">
<dc-import name="Sidebar" active="opensigner" locked="{{ no }}" font="{{ font }}" hint-size="240px,800px"></dc-import>
<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 36px 48px 32px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">OpenSigner</h1>
<span style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; background: #19212a; border: 1px solid #1f2933; font-size: 12px; color: #9aacb9"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="12" cy="12" r="3.5"></circle></svg>From Main · 2 keys · 3 wallets</span>
</header>
<div style="width: 560px; align-self: center; display: flex; flex-direction: column; gap: 20px; flex-grow: 1">
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; background: rgba(240,192,119,0.08); border: 1px solid rgba(240,192,119,0.30)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f0c077" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4"></circle><path d="M10.5 12.5 20 3"></path><path d="M16.5 6.5l2.5 2.5"></path><path d="M14 9l2 2"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">Key <span style="font-family: 'JetBrains Mono', monospace">9a3f21c7</span> is not in a vault</span><span style="font-size: 12px; color: #9aacb9">Added this session</span></span>
<span style="margin-left: auto; display: flex; gap: 8px">
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: #9aacb9; font-family: inherit; font-size: 13px">Not now</button>
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid #f0c077; background: transparent; color: #f0c077; font-family: inherit; font-size: 13px; font-weight: 500">Save to vault</button>
</span>
</div>
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-size: 15px; font-weight: 600">Wallets</h2><span style="font-size: 12px; color: #9aacb9">3 keys loaded</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<a href="OpenSigner.dc.html" style="display: flex; align-items: center; gap: 14px; height: 72px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; background: #19212a; border: 1px solid #1f2933; text-decoration: none; color: #e0e9ef">
<span style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: rgba(131,216,239,0.10); color: #83d8ef; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4"></circle><path d="M10.5 12.5 20 3"></path><path d="M16.5 6.5l2.5 2.5"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600">Savings</span><span style="font-size: 13px; color: #9aacb9">2 of 3 · Taproot</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6f8291" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: auto"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="OpenSigner.dc.html" style="display: flex; align-items: center; gap: 14px; height: 72px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; background: #19212a; border: 1px solid #1f2933; text-decoration: none; color: #e0e9ef">
<span style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: rgba(131,216,239,0.10); color: #83d8ef; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4"></circle><path d="M10.5 12.5 20 3"></path><path d="M16.5 6.5l2.5 2.5"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600">Spending</span><span style="font-size: 13px; color: #9aacb9">SegWit · <span style="font-family: 'JetBrains Mono', monospace">73c5da0a</span></span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6f8291" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: auto"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="OpenSigner.dc.html" style="display: flex; align-items: center; gap: 14px; height: 72px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; background: #19212a; border: 1px solid #1f2933; text-decoration: none; color: #e0e9ef">
<span style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: #222c37; color: #9aacb9; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600">Cold storage</span><span style="font-size: 13px; color: #9aacb9">SegWit · watch-only</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6f8291" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: auto"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</div>
<div style="display: flex; align-items: baseline; justify-content: space-between; padding-top: 4px"><h2 style="margin: 0; font-size: 15px; font-weight: 600">Keys</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; background: #19212a; border: 1px solid #1f2933; font-size: 13px"><span style="font-family: 'JetBrains Mono', monospace">73c5da0a</span><span style="color: #9aacb9">Main</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; background: #19212a; border: 1px solid #1f2933; font-size: 13px"><span style="font-family: 'JetBrains Mono', monospace">f23a9b01</span><span style="color: #9aacb9">Main</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; background: #19212a; border: 1px solid rgba(240,192,119,0.30); font-size: 13px"><span style="font-family: 'JetBrains Mono', monospace">9a3f21c7</span><span style="color: #f0c077">this session</span></span>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; justify-content: flex-end; gap: 10px">
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #303d49; background: transparent; color: #e0e9ef; font-family: inherit; font-size: 14px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a key</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: #83d8ef; color: #0d1218; font-family: inherit; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M4 12h16"></path></svg>Scan</button>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"font":{"editor":"enum","options":["Inter","IBM Plex Sans","Source Sans 3"],"default":"Inter","section":"Look"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const stacks = { "Inter": "'Inter', sans-serif", "IBM Plex Sans": "'IBM Plex Sans', sans-serif", "Source Sans 3": "'Source Sans 3', sans-serif" };
    return { font: this.props.font ?? 'Inter', no: false, fontStack: stacks[this.props.font] || stacks.Inter };
  }
}
</script>
</body>
</html>
