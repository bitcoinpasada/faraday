<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remove the stick</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Sans+3:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#83d8ef}a:hover{color:#b1e8f7}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(700px 460px at 50% 30%, rgba(131,216,239,0.10), rgba(131,216,239,0) 70%), #11161c; color: #e0e9ef; font-family: {{fontStack}}">
<div style="width: 520px; display: flex; flex-direction: column; align-items: center; gap: 28px">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#83d8ef" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><ellipse cx="12" cy="12" rx="4" ry="9"></ellipse><path d="M3 12h18M5.2 6.8c4.2 1.9 9.4 1.9 13.6 0M5.2 17.2c4.2-1.9 9.4-1.9 13.6 0"></path></svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<h1 style="margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.02em">Remove the stick</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #9aacb9">Unlocking starts once no stick or card is attached.</p>
</div>
<div style="width: 100%; box-sizing: border-box; background: #19212a; border: 1px solid #1f2933; border-radius: 12px; padding: 6px 0">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px 8px; font-size: 12px; color: #9aacb9"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"></path><path d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"></path></svg>Copied into memory from OSKDATA</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid #1f2933">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8bd4b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 14px">vault.ofv</span>
<span style="margin-left: auto; font-size: 13px; color: #9aacb9">1.0 MB · needs 256 MiB</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid #1f2933">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8bd4b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 14px">vault-2.ofv</span>
<span style="margin-left: auto; font-size: 13px; color: #9aacb9">262 KB · needs 64 MiB</span>
</div>
</div>
<a href="Unlock.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid #303d49; color: #9aacb9; text-decoration: none; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #f0c077"></span>KINGSTON is still attached</a>
</div>
<div style="position: absolute; left: 32px; right: 32px; bottom: 24px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #6f8291">
<span>Faraday 0.1 · x86-64</span>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #303d49; background: transparent; color: #9aacb9; font-family: inherit; font-size: 12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8.5"></path><path d="M6.5 6.5a7.8 7.8 0 1 0 11 0"></path></svg>Power off</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"font":{"editor":"enum","options":["Inter","IBM Plex Sans","Source Sans 3"],"default":"Inter","section":"Look"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const stacks = { "Inter": "'Inter', sans-serif", "IBM Plex Sans": "'IBM Plex Sans', sans-serif", "Source Sans 3": "'Source Sans 3', sans-serif" };
    return { fontStack: stacks[this.props.font] || stacks.Inter };
  }
}
</script>
</body>
</html>
