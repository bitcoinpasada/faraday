[package]
name = "faraday-fontbake"
version = "0.1.0"
description = "Build-time glyph outline baker for faraday-draw; never runs on a device"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "faraday-fontbake"
path = "src/main.rs"

[dependencies]
# The glyph set is computed from the wordlists themselves, so it cannot
# drift from them; `faraday-crypto` checks the downloaded CJK fonts.
faraday-bip = { path = "../../core/faraday-bip" }
faraday-crypto = { path = "../../core/faraday-crypto" }
faraday-draw = { path = "../../core/faraday-draw" }
ttf-parser.workspace = true

[lints]
workspace = true
