[package]
name = "faraday-crosscheck"
version = "0.1.0"
description = "Answers the crypto cross-check's requests with Faraday's own code; test-only, never shipped (F79, docs/MULTIVENDOR.md §10)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "faraday-crosscheck"
path = "src/main.rs"

[dependencies]
faraday-bip = { path = "../../core/faraday-bip" }
faraday-entropy = { path = "../../core/faraday-entropy" }
faraday-backup = { path = "../../core/faraday-backup" }
faraday-psbt = { path = "../../core/faraday-psbt" }
faraday-vault = { path = "../../faraday/faraday-vault" }
# The session's fresh randomness and what a person adds of their own
# (`fresh.rs`, docs/OWN-RANDOMNESS.md §2.3), driven through the testkit
# as the app's tests drive it; never in a shipped binary, as this
# command is not one.
faraday-core = { path = "../../faraday/faraday-core", features = ["testkit"] }
faraday-shell-api = { path = "../../core/faraday-shell-api" }
# The token that counts nothing (docs/COMPUTE.md §3): this command is a
# test, and `tools/lint-unchecked.sh` keeps the feature out of every
# shipped binary.
faraday-crypto = { path = "../../core/faraday-crypto", features = ["unchecked"] }
bitcoin.workspace = true
# XChaCha20-Poly1305 called as `faraday-vault` calls it, for the vault
# area's checks of the cipher on its own.
chacha20poly1305.workspace = true
serde_json.workspace = true

[lints]
workspace = true
