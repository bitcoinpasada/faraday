# The registry of what a change brings with it (docs/spec/08-conventions.md section 6).
# Read by tools/impact.py: the consumers (the apps) and the pairs (a change that brings
# another with it). A rule enters with the change that brings the paths it names; `impact.py
# lint` fails on a rule whose paths match nothing, and on a crate an app is built from that
# its consumer does not read (section 6.3).

