# The registry of what a change brings with it (docs/IMPACT.md, F149).
# Read by tools/impact.py. Every check of `just lint` and the test suite, the
# consumers (the apps and the website) and the rules. A check or rule marked
# planned is not yet run.

[[check]]
id = "clippy"
run = "python3 tools/clippy.py --locked --workspace --all-targets"
stage = "just lint"
catches = "clippy with warnings as errors, and a warning about clippy's own configuration"
misses = "targets and features the workspace build does not reach"

[[check]]
id = "cargo-deny"
run = "cargo deny check"
stage = "just lint"
catches = "advisories, licences, duplicates and sources against deny.toml"

[[check]]
id = "cargo-vet"
run = "cargo vet --locked"
stage = "just lint"
catches = "a dependency neither trusted, audited nor exempted, offline (F71)"
misses = "whether a trusted publisher's code is sound"

[[check]]
id = "cargo-vet-fuzz"
run = "cargo vet --locked --manifest-path fuzz/Cargo.toml --store-path supply-chain"
stage = "just lint"
catches = "the same, for the core fuzz workspace"

[[check]]
id = "cargo-vet-faraday-fuzz"
run = "cargo vet --locked --manifest-path faraday/fuzz/Cargo.toml --store-path supply-chain"
stage = "just lint"
catches = "the same, for faraday's fuzz workspace"

[[check]]
id = "cargo-fmt"
run = "cargo fmt --all --check"
stage = "just lint"
catches = "formatting"

[[check]]
id = "lint-secrets"
run = "tools/lint-secrets.sh"
stage = "just lint"
catches = "printing or Debug of secret types, heap text in the files that hold secrets, key material outside faraday-keys (rule 4)"
misses = "a file that starts to hold secrets and is not yet in SECRET_FILES"

[[check]]
id = "lint-strings"
run = "tools/lint-strings.sh"
stage = "just lint"
catches = "a wording literal in screen code; a string no code uses; an untidy string"
misses = "Learn pages and the self-test's check names, by rule"

[[check]]
id = "lint-tokens"
run = "tools/lint-tokens.sh"
stage = "just lint"
catches = "a layout number in widgets; numbers and colours written in screens beyond lint-tokens.counts"

[[check]]
id = "lint-docs"
run = "tools/lint-docs.sh"
stage = "just lint"
catches = "a document without Kind and Status, a Spec without Open, a plan in a Reference, a cited path or `just` recipe that does not exist, the decisions' index"
misses = "whether a document says what is true"

[[check]]
id = "lint-layout"
run = "tools/lint-layout.sh"
stage = "just lint"
catches = "the code map, file and function sizes, top-level field and impl Faraday counts beyond lint-layout.counts"
misses = "structure that is legal but poor"

[[check]]
id = "lint-tree"
run = "tools/lint-tree.sh"
stage = "just lint"
catches = "a top-level entry not listed, an editor or merge leftover, a file over 2 MiB, metadata in a tracked image"

[[check]]
id = "fuzz-targets-build"
run = "cargo check --locked --bins --manifest-path fuzz/Cargo.toml"
stage = "just lint"
catches = "a fuzz target of fuzz/ that no longer compiles against the code it feeds"
misses = "what only the nightly or the sanitizer build shows, and whether a target finds anything"

[[check]]
id = "fuzz-targets-build-faraday"
run = "cargo check --locked --bins --manifest-path faraday/fuzz/Cargo.toml"
stage = "just lint"
catches = "a fuzz target of faraday/fuzz/ that no longer compiles against the code it feeds"
misses = "what only the nightly or the sanitizer build shows, and whether a target finds anything"

[[check]]
id = "lint-fuzz-parsers"
run = "python3 -I -B tools/lint-fuzz-parsers.py"
stage = "just lint"
catches = "a pub fn of core/ named parse*, decode*, from_bytes, from_str or from_slice taking &[u8] or &str that tools/fuzz-parsers.toml does not list with a fuzz target or an excuse; an entry whose target or function is gone"
misses = "a parser under another name or taking another type, and whether the target reaches the parser's hard paths"

[[check]]
id = "lint-builds"
run = "python3 -I -B tools/lint-builds.py"
stage = "just lint"
catches = "faraday/builds.toml against the tree: ids, fields, recipes, board and panel directories, hardware tiles"
misses = "whether the website's download page follows"

[[check]]
id = "costs-lint"
run = "cargo run -q -p costs-lint"
stage = "just lint"
catches = "a costly function without the compute token or its Costs doc line, a stray Compute::new, a Compute stored outside View"
misses = "work that is costly and not marked so"

[[check]]
id = "lint-unchecked"
run = "tools/lint-unchecked.sh"
stage = "just lint"
catches = "the unchecked feature of faraday-crypto on in a shipped binary"

[[check]]
id = "lint-crosscheck"
run = "tools/lint-crosscheck.sh"
stage = "just lint"
catches = "crypto sources changed since the last passing cross-check (F79)"
misses = "whether the cross-check covers the change"

[[check]]
id = "lint-standards"
run = "python3 -I -B tools/lint-standards.py"
stage = "just lint"
catches = "a crate with cryptography (a primitive dependency, or a function the crypto inventory finds) outside the stamp's CRATES, or a faraday-core file outside its FILES, not listed with its reason; a function STANDARDS §0 keeps out of the app that a faraday/ crate's shipped code reaches, or a faraday/ source line naming MuSig2's secret nonce; a hold the code defines with no entry naming its decision (F136); a STANDARDS §8 disagreement whose text changed, or a bullet with no entry; a stale entry of any kind (tools/lint-standards.toml)"
misses = "a method call whose receiver's type the inventory cannot tell; a way past a check that is not a hold (a caution that signs); whether a reason is true"

[[check]]
id = "crypto-verified"
run = "python3 -I -B docs/crypto/verified.py check"
stage = "just lint"
catches = "a STANDARDS row of the manifest whose actions name no cross-check area, no vectors folder the cross-check reads and no test file that exists; a cross-check area or a tools/vectors/ folder no row names"
misses = "STANDARDS §9, written by hand; whether a named test tests the row's standard"

[[check]]
id = "lint-upstream"
run = "python3 -I -B tools/lint-upstream.py"
stage = "just lint"
catches = "a tracked file other than LICENSE whose bytes name the upstream project (the name read from LICENSE), beyond tools/lint-upstream.counts (F73)"
misses = "the name spelled with spaces between its words, or abbreviated"

[[check]]
id = "crosscheck-facts"
run = "python3 -I -B tools/crosscheck/facts.py check"
stage = "just lint"
catches = "a cross-check area without its stated facts, a path it names that does not exist, tools/crosscheck/README.md's table and known differences out of step with them (F148)"
misses = "whether the stated facts are true of what the area runs"

[[check]]
id = "lint-themes"
run = "tools/lint-themes.sh"
stage = "just lint"
catches = "the colour tables differing from what the vendored material-color-utilities makes"
misses = "the website's copy of the roles"

[[check]]
id = "lint-keys-tests"
run = "tools/lint-keys-tests.sh"
stage = "just lint"
catches = "a shipped binary with faraday-keys' master-for-tests or faraday-core's testkit feature"

[[check]]
id = "check-macos"
run = "tools/check-macos.sh"
stage = "just lint"
catches = "the Starter's macOS code, clippy for both Mac targets"
misses = "behaviour on a Mac"

[[check]]
id = "learn-sync"
run = "python3 tools/learn/sync.py check"
stage = "just lint"
catches = "docs/learn/ and the Learn pages' en.rs differing"

[[check]]
id = "lint-guide-self-test"
run = "python3 -B tools/lint-guide.py --self-test"
stage = "just lint"
catches = "the guide lint's own fixtures"

[[check]]
id = "lint-guide"
run = "python3 -B tools/lint-guide.py"
stage = "just lint"
catches = "a bold name that is not an app string, a link that does not resolve, a Screen or Sheet no guide page names"
misses = "prose that describes old steps with the current names"

[[check]]
id = "nextest"
run = "cargo nextest run --locked --workspace"
stage = "just test"
catches = "every unit and integration test in the workspace"

[[check]]
id = "doctests"
run = "cargo test --locked --workspace --doc"
stage = "just test"
catches = "the doc tests, which nextest does not run"

[[check]]
id = "budget-tests"
run = "cargo nextest run --locked -p faraday-core -E 'test(/^work::budget::/)'"
stage = "just test"
catches = "a frame, a pointer move, a press or a key doing costly work its budget does not name"
misses = "work that is not counted through the compute token"

[[check]]
id = "crosscheck"
run = "just crosscheck"
stage = "just crosscheck"
catches = "Faraday's Rust against the Python references over published vectors and a seeded random corpus (F79)"
misses = "PSBT signing end to end, taproot script trees, miniscript, AEZ (docs/CROSSCHECK.md §10.5)"

[[check]]
id = "lint-docs-held-by"
run = "tools/lint-docs.sh"
stage = "just lint"
catches = "a decision without a Held by line, naming a rule the registry lacks, or held by tests that no Rust file names (docs/IMPACT.md §8)"
misses = "whether the ids named are the right ones, and whether the test that names a decision tests all of it; review is the author's judgement"

[[check]]
id = "impact-check"
run = "python3 -I -B tools/impact.py check --quiet"
stage = "just lint"
catches = "a pair left unmet in the range from main, a refused change, a missing Material trailer"
misses = "a rule a reviewer must judge"

[[check]]
id = "impact-docs"
run = "python3 -I -B tools/impact.py docs --check"
stage = "just lint"
catches = "docs/CHECKS.md differing from the registry"

[[check]]
id = "impact-lint"
run = "python3 -I -B tools/impact.py lint"
stage = "just lint"
catches = "the registry against itself and the tree: ids, held_by, sources, paths, the lint recipe against the checks, each app's reads against cargo metadata"
misses = "whether a rule is right"

[[check]]
id = "crypto-check"
run = "python3 -I -B docs/crypto/check.py check"
stage = "just lint"
catches = "a cryptographic function the inventory finds (crypto-inventory, run by the check) that no action covers and no [[not_crypto]] names; an entry naming a function, test, vector folder, area, fuzz target, self-test check, reveal, Learn page or screen that does not exist; an action whose code, libraries, vectors, area or used actions changed since its fingerprint was written; AUDIT §1's crate rows, the Reveal count, COMPUTE §2.3's roots, the Tools tags, a screen calling a root it does not list, and the not_crypto and screens_not counts in tools/lint-crypto.counts (F148)"
misses = "a function a macro generates or one reached only through a trait object; in faraday-core, what a closure reaches only through a `Faraday` method (docs/CRYPTO-LEARN.md §4.4); whether an entry's text is true (docs/CRYPTO-LEARN.md §17)"

[[check]]
id = "crypto-gen"
run = "python3 -I -B docs/crypto/gen.py check"
stage = "just lint"
catches = "the generated parts of STANDARDS, AUDIT §3, the Learn blocks and the cross-check README's independence table differing from the manifest (F148)"
misses = "the text outside the marker lines"

[[check]]
id = "touch-targets"
run = "cargo nextest run --locked -p faraday-snapshot -p faraday-starter -E 'test(/^targets::/)'"
stage = "just test"
catches = "a press target under 48 dp on a frame a snapshot tour or the Starter's snapshot example reaches, at its four sizes, not in M3-CHECKS §3; a count in tools/touch-targets.counts risen or not lowered"
misses = "frames no tour or example reaches; sizes other than the four (targets.txt, by review); the held app's frames inside the Starter"

[[consumer]]
id = "app.faraday"
name = "the device app, the stick and the Pi images"
reads = [
  "faraday/faraday-core/**", "faraday/faraday-ui/**", "faraday/faraday-strings/**",
  "faraday/faraday-learn/**", "faraday/faraday-keys/**", "faraday/shells/stick/**",
  "faraday/shells/window/**", "faraday/shells/desktop/**", "faraday/image/**", "core/**",
  "faraday/faraday-boot/**", "faraday/faraday-disk/**", "faraday/faraday-fat/**",
  "faraday/faraday-files/**", "faraday/faraday-guides/**", "faraday/faraday-intake/**",
  "faraday/faraday-payload/**", "faraday/faraday-pgp/**", "faraday/faraday-qr/**",
  "faraday/faraday-samples/**", "faraday/faraday-sb/**", "faraday/faraday-scanner/**",
  "faraday/faraday-storage/**", "faraday/faraday-vault/**", "faraday/faraday-grant/**",
  "faraday/shells/v4l2/**", "faraday/shells/avfoundation/**", "faraday/shells/mediafoundation/**",
]
act = "the device app, the stick and the Pi images are built again"

[[consumer]]
id = "app.starter"
name = "the Starter"
reads = [
  "faraday/faraday-starter/**", "faraday/shells/starter/**", "faraday/faraday-ui/**",
  "faraday/faraday-strings/**", "core/faraday-draw/**", "faraday/builds.toml",
  "faraday/faraday-core/**", "faraday/faraday-disk/**", "faraday/faraday-fat/**",
  "faraday/faraday-files/**", "faraday/faraday-payload/**", "faraday/faraday-learn/**",
  "faraday/faraday-guides/**", "faraday/faraday-grant/**", "faraday/faraday-storage/**",
  "faraday/faraday-keys/**", "faraday/faraday-vault/**", "faraday/faraday-qr/**",
  "faraday/faraday-scanner/**", "faraday/faraday-pgp/**", "faraday/faraday-intake/**",
  "faraday/faraday-sb/**", "faraday/faraday-boot/**", "faraday/faraday-samples/**",
  "faraday/shells/window/**", "faraday/shells/desktop/**", "faraday/shells/v4l2/**", "faraday/shells/avfoundation/**",
  "faraday/shells/mediafoundation/**", "core/**",
]
act = "the Starter is built again"

[[consumer]]
id = "website.guide"
name = "the website's guide"
reads = ["docs/GUIDE.md", "docs/guide/**"]
act = "the guide's pages and pictures are made again"
blocking = true
site_with = ["assets/guide/**"]

[[consumer]]
id = "website.start"
name = "the website's start pages"
reads = ["docs/learn/faraday/boot/*.md"]
act = "a page added needs its description in the site's guide builder"
blocking = true
site_with = ["tools/guides.py"]

[[consumer]]
id = "website.download"
name = "the website's download page"
reads = ["faraday/builds.toml"]
act = "a new hardware id needs its lines and drawing in the site's download builder"
blocking = true
site_with = ["tools/download.py", "assets/download/**"]

[[consumer]]
id = "website.download-pictures"
name = "the website's pictures of Home at each panel size"
reads = ["faraday/faraday-core/src/screens/home.rs"]
act = "the pictures of Home at each panel size are made again"

[[consumer]]
id = "website.roles"
name = "the website's colour roles"
reads = ["faraday/faraday-ui/src/pal/schemes.rs"]
act = "the site's roles are written again from the pinned commit"
blocking = true
site_check = "python3 -B tools/roles.py check"
site_with = ["web/site.css"]

[[consumer]]
id = "website.wordmark"
name = "the website's wordmark"
reads = ["faraday/faraday-ui/assets/wordmark.txt"]
act = "the site's wordmark outlines are copied again"
blocking = true

[[consumer]]
id = "website.standards"
name = "the website's standards page"
reads = ["docs/STANDARDS.md"]
act = "the standards page is edited to match (rendered from the manifest once F148 is built)"
blocking = true
site_with = ["web/standards.html"]

[[consumer]]
id = "website.cryptography"
name = "the website's /cryptography page"
reads = ["docs/crypto/actions.toml", "docs/crypto/gen.py", "docs/crypto/gen_how.py", "docs/CRYPTO-LEARN.md", "tools/crosscheck/stamp", "tools/crosscheck/area_*.py", "Cargo.lock"]
act = "the page is generated again from the pinned manifest; a schema it does not know stops its build (docs/CRYPTO-LEARN.md §11.1)"
blocking = true
site_with = ["tools/cryptography.py", "web/cryptography.html"]

[[consumer]]
id = "website.tour"
name = "the website's tour"
reads = ["**/screen.rs", "faraday/faraday-core/src/screens/**"]
act = "the tour's pictures are made again"

[[consumer]]
id = "website.demo"
name = "the website's demo"
reads = ["faraday/faraday-core/src/host/**", "faraday/faraday-samples/**", "Cargo.lock"]
act = "the demo is built and its tests run; its own build refuses a break"

# ------------------------------------------------------------------ repo

[[rule]]
id = "repo.no-hosted-ci"
title = "no hosted CI, no GitHub Actions"
source = ["CLAUDE.md"]
when = [".github/workflows/**"]
on = ["add"]
kind = "forbid"

[[rule]]
id = "repo.build-machine-unnamed"
title = "the remote build machine is \"the build machine\" in docs, comments and messages, never its hostname, owner or address"
source = ["CLAUDE.md"]
when = ["**"]
kind = "review"

[[rule]]
id = "repo.personal-information"
title = "every new commit's diff and message checked for names, addresses, hostnames, local paths, keys and tokens before a push"
source = ["CLAUDE.md"]
when = ["**"]
kind = "review"

[[rule]]
id = "repo.upstream-name"
title = "the upstream project is named only in LICENSE"
source = ["docs/decisions/F73.md"]
when = ["**", "!LICENSE"]
kind = "held"
held_by = ["lint-upstream"]

[[rule]]
id = "repo.contributing"
title = "CONTRIBUTING.md's summary follows CLAUDE.md's rules"
source = ["CONTRIBUTING.md"]
when = ["CLAUDE.md"]
kind = "review"

[[rule]]
id = "repo.developing"
title = "a recipe, prerequisite or output path changed is changed in DEVELOPING.md or tools/README.md"
source = ["CLAUDE.md"]
when = ["justfile", "faraday/faraday.just"]
lines = '^[+-]( {4}[^\s#]|[a-z][A-Za-z0-9_-]*( [^:]*)?:( |$))'
kind = "pair"
with = ["docs/DEVELOPING.md", "tools/README.md"]
misses = "a recipe changed whose text DEVELOPING.md does not show"

[[rule]]
id = "repo.tests-kept"
title = "a test is changed to the rule it now encodes, never deleted to make the build pass"
source = ["CLAUDE.md"]
when = ["**/*.rs"]
lines = '^-\s*#\[(test|rstest)'
kind = "review"

[[rule]]
id = "repo.tests-user-facing"
title = "a test covers user-facing behaviour or a published vector; none states a design rule, a token's value or a screen's geometry against a document"
source = ["CLAUDE.md"]
when = ["**/tests/**", "**/*tests.rs"]
kind = "review"

# ------------------------------------------------------------------ tree

[[rule]]
id = "tree.top-level"
title = "a top-level entry is listed in README.md's \"Repository layout\" and in tools/lint-tree.sh"
source = ["CLAUDE.md"]
when = ["*"]
on = ["add"]
kind = "pair"
with_each = ["README.md", "tools/lint-tree.sh"]
held_by = ["lint-tree"]
misses = "a new top-level directory: only a file added at the top is seen here, lint-tree holds the list"

[[rule]]
id = "tree.clean"
title = "nothing an editor, a merge or a session leaves behind is tracked, no file over 2 MiB"
source = ["CLAUDE.md"]
when = ["**"]
kind = "held"
held_by = ["lint-tree"]

[[rule]]
id = "tree.image-metadata"
title = "an image or PDF carries no metadata"
source = ["tools/README.md"]
when = ["**/*.png"]
on = ["add", "modify"]
kind = "review"
misses = "planned check: every tracked image metadata-free; just guide-pictures checks the guide's only"

# ------------------------------------------------------------------ docs

[[rule]]
id = "docs.headers"
title = "every document carries Kind and Status, a Spec its Open line, a Reference no plan"
source = ["CLAUDE.md"]
when = ["docs/**/*.md"]
kind = "held"
held_by = ["lint-docs"]

[[rule]]
id = "docs.paths"
title = "every repository path a document names exists"
source = ["CLAUDE.md"]
when = ["**/*.md"]
kind = "held"
held_by = ["lint-docs"]

[[rule]]
id = "docs.readme-index"
title = "a document added, deleted or changed in Kind has its line in docs/README.md"
source = ["docs/README.md"]
when = ["docs/*.md", "!docs/README.md"]
lines = '^[+-]\*\*Kind:\*\*'
kind = "pair"
with = ["docs/README.md"]

[[rule]]
id = "docs.spec-done"
title = "a Spec that stops being one moves its plan to docs/history/<NAME>-LOG.md and becomes a Reference"
source = ["CLAUDE.md"]
when = ["docs/{name}.md", "!docs/README.md"]
on = ["modify"]
lines = '^-\*\*Kind:\*\* Spec'
kind = "pair"
with = ["docs/history/{name}-LOG.md"]
held_by = ["lint-docs"]
misses = "lint-docs rule 4 holds the Open line and the plan's place in part"

[[rule]]
id = "docs.no-silent-delete"
title = "a decision or a docs/*.md document is moved to docs/history/, never deleted"
source = ["docs/decisions/F149.md"]
when = ["docs/decisions/{f}.md", "docs/{f}.md"]
on = ["delete"]
kind = "forbid"
with = ["docs/history/decisions/{f}.md", "docs/history/{f}.md"]

# ------------------------------------------------------------- decisions

[[rule]]
id = "decisions.indexed"
title = "each decision has its row in docs/DECISIONS.md and each row its file"
source = ["CLAUDE.md", "docs/DECISIONS.md"]
when = ["docs/decisions/F{n}.md", "docs/history/decisions/**"]
kind = "held"
held_by = ["lint-docs"]

[[rule]]
id = "decisions.held-by"
title = "each decision carries a Held by line naming rules of the registry"
source = ["docs/decisions/F149.md"]
when = ["docs/decisions/F{n}.md"]
on = ["add"]
kind = "held"
held_by = ["lint-docs-held-by"]

# ------------------------------------------------------------- standards

[[rule]]
id = "standards.what-goes-in"
title = "what the app takes in is a published standard checked against another implementation, or Faraday's own rule that fails closed"
source = ["docs/STANDARDS.md §0"]
when = ["core/*/src/**", "!core/faraday-draw/**"]
kind = "review"

[[rule]]
id = "standards.refusals-stay"
title = "what the code refuses stays refused; accepting more than a standard requires is a decision"
source = ["CLAUDE.md", "docs/decisions/F90.md"]
when = ["core/*/src/**", "!core/faraday-draw/**"]
kind = "review"

[[rule]]
id = "standards.no-way-past"
title = "a check that keeps keys or money safe has no way past it unless a decision names the case; a hold names it"
source = ["CLAUDE.md", "docs/decisions/F136.md"]
when = ["core/faraday-psbt/src/**", "faraday/faraday-core/src/action.rs", "faraday/faraday-starter/src/scroll.rs", "tools/lint-standards.toml"]
lines = '^\+.*\b[Hh]old'
kind = "review"
held_by = ["lint-standards"]
misses = "whether the case a hold names is legitimate; a way past a check that is not a hold (a caution that signs)"

[[rule]]
id = "standards.out-of-app"
title = "unpublished or unreviewed work stays in the repository, compiled out of the app"
source = ["docs/STANDARDS.md §0", "docs/decisions/F109.md"]
when = ["core/*/src/**", "!core/faraday-draw/**"]
kind = "review"
held_by = ["lint-standards"]
misses = "work kept out that no [[out_of_app]] of tools/lint-standards.toml names; a method call the inventory cannot resolve"

[[rule]]
id = "standards.experimental-dev-only"
title = "work behind the experimental feature reaches only a dev build: no release or test-release binary carries it"
source = ["docs/decisions/F162.md", "docs/ANTI-EXFIL.md §3"]
when = ["**/Cargo.toml", "faraday/image/build.sh", "justfile", "faraday/faraday.just"]
kind = "held"
held_by = ["lint-keys-tests"]
misses = "planned: no experimental feature exists yet; lint-keys-tests gains the check on shipped binaries, and faraday/image/build.sh its refusal of the feature without DEV=1, with the first code behind it"
status = "planned"

[[rule]]
id = "standards.rows-checked"
title = "every STANDARDS row names a cross-check area, a vectors folder or a test, and every area and vectors folder is named by a row"
source = ["docs/STANDARDS.md §0"]
when = ["docs/crypto/actions.toml", "tools/crosscheck/area_*.py", "tools/vectors/**"]
kind = "held"
held_by = ["crypto-verified"]

[[rule]]
id = "standards.disagreements-held"
title = "each disagreement STANDARDS §8 lists is held by a [[disagreement]] that fails when it changes"
source = ["docs/STANDARDS.md §8"]
when = ["docs/STANDARDS.md", "tools/lint-standards.toml"]
kind = "held"
held_by = ["lint-standards"]

[[rule]]
id = "standards.scope"
title = "a new kind of key or signature is a decision"
source = ["docs/decisions/F116.md"]
when = ["core/*/src/**", "!core/faraday-draw/**"]
kind = "review"

[[rule]]
id = "standards.learn-in-step"
title = "STANDARDS.md and the Learn pages are kept in step until F148 generates both"
source = ["docs/STANDARDS.md"]
when = ["docs/STANDARDS.md"]
kind = "pair"
with = ["docs/learn/**"]

# ---------------------------------------------------------------- crypto

[[rule]]
id = "crypto.crosscheck-stamp"
title = "the crypto sources match the last passing cross-check"
source = ["docs/decisions/F79.md"]
when = ["core/*/src/**", "tools/crosscheck/**", "Cargo.lock"]
kind = "held"
held_by = ["lint-crosscheck"]

[[rule]]
id = "crypto.crosscheck-covered"
title = "cryptography outside the cross-check stamp's crates and files is listed with the reason it is not covered"
source = ["docs/STANDARDS.md §0", "docs/decisions/F79.md"]
when = ["core/*/src/**", "faraday/**/src/**", "core/*/Cargo.toml", "faraday/**/Cargo.toml", "tools/crosscheck/stamp.py", "tools/lint-standards.toml"]
kind = "held"
held_by = ["lint-standards"]
misses = "whether a reason is true, and whether a listed file should be in the stamp's FILES"

[[rule]]
id = "crypto.independence-labelled"
title = "an action with a cross-check area says who wrote its reference and whether it is Faraday's own; an own construction carries its label"
source = ["docs/decisions/F160.md"]
when = ["docs/crypto/actions.toml", "tools/crosscheck/area_*.py"]
kind = "held"
held_by = ["crypto-verified"]
misses = "whether a stated class is true of the area's code"

[[rule]]
id = "crypto.independence-said"
title = "no text calls a check independent where the reference is Faraday's own"
source = ["docs/decisions/F160.md"]
when = ["docs/CROSSCHECK.md", "docs/STANDARDS.md", "docs/AUDIT.md", "docs/crypto/actions.toml", "tools/crosscheck/README.md", "tools/crosscheck/area_*.py", "tools/reference/**", "tools/vault/**"]
kind = "review"

[[rule]]
id = "crypto.tested"
title = "a cryptographic change is tested against published vectors or another implementation"
source = ["CLAUDE.md", "docs/decisions/F148.md"]
when = ["core/*/src/**", "!core/faraday-draw/**"]
kind = "review"
misses = "the inventory and the fingerprints (crypto-check) say a cryptographic function changed, not whether it was tested; that is the review the re-stamp (just crypto-review) prompts"

[[rule]]
id = "crypto.action-covered"
title = "every cryptographic function is covered by the inventory"
source = ["docs/decisions/F148.md"]
when = ["core/*/src/**", "faraday/faraday-keys/src/**"]
kind = "held"
held_by = ["crypto-check"]

[[rule]]
id = "crypto.generated"
title = "STANDARDS and AUDIT's generated sections match the manifest"
source = ["docs/decisions/F148.md"]
when = ["docs/STANDARDS.md", "docs/AUDIT.md", "docs/crypto/actions.toml", "faraday/faraday-learn/src/how.rs"]
kind = "held"
held_by = ["crypto-gen"]

[[rule]]
id = "crypto.at-source"
title = "core/ is Faraday's own code: a thing is fixed at its source rather than wrapped"
source = ["CLAUDE.md"]
when = ["core/**"]
kind = "review"

[[rule]]
id = "crypto.kept-values"
title = "a type re-implemented from a core/ one keeps the values the original works out once"
source = ["CLAUDE.md"]
when = ["faraday/**/src/**"]
kind = "review"

[[rule]]
id = "crypto.costs-said"
title = "a function that costs more than a lookup says \"Costs\" in the first line of its doc"
source = ["CLAUDE.md"]
when = ["core/*/src/**", "faraday/**/src/**", "!core/faraday-draw/**"]
kind = "review"
held_by = ["costs-lint"]
misses = "work that is costly and not marked so"

# ------------------------------------------------------------------ keys

[[rule]]
id = "keys.boundary"
title = "key material lives in faraday-keys and leaves only through its named reveals"
source = ["CLAUDE.md", "docs/decisions/F70.md"]
when = ["faraday/**"]
kind = "held"
held_by = ["lint-secrets", "lint-keys-tests"]

[[rule]]
id = "keys.new-reveal"
title = "a new reveal is listed in KEYS.md and AUDIT.md"
source = ["docs/KEYS.md §2"]
when = ["faraday/faraday-keys/src/session.rs"]
lines = '^\+ {4}[A-Z][A-Za-z0-9]*(\(.*\))?,'
kind = "pair"
with_each = ["docs/KEYS.md", "docs/AUDIT.md"]

[[rule]]
id = "keys.secret-files"
title = "a file that starts to hold secrets is added to lint-secrets' SECRET_FILES"
source = ["tools/README.md"]
when = ["faraday/**/src/**"]
kind = "review"
held_by = ["lint-secrets"]
misses = "a file that starts to hold secrets and is not yet in SECRET_FILES"

[[rule]]
id = "keys.child-vault-only"
title = "that a seed is a BIP-85 child of another is kept only in a vault, and only when recorded; nothing written outside one says so"
source = ["docs/decisions/F166.md"]
when = ["faraday/faraday-core/src/**", "faraday/faraday-keys/src/**", "faraday/faraday-vault/src/**"]
kind = "review"
misses = "a file, picture, sheet, file name, wallet name or kept state that carries a key's child mark, parent fingerprint, BIP-85 index or path"

# --------------------------------------------------------------- compute

[[rule]]
id = "compute.token"
title = "costly work takes the compute token and says so"
source = ["CLAUDE.md", "docs/decisions/F69.md"]
when = ["core/*/src/**", "faraday/**/src/**"]
kind = "held"
held_by = ["costs-lint", "budget-tests"]

[[rule]]
id = "compute.new-mint"
title = "a new place that mints the compute token is listed in COMPUTE.md"
source = ["docs/COMPUTE.md §8"]
when = ["core/*/src/**", "faraday/**/src/**"]
lines = '^\+.*\bCompute::new\('
kind = "pair"
with = ["docs/COMPUTE.md"]
held_by = ["costs-lint"]

# ----------------------------------------------------------------- speed

[[rule]]
id = "speed.kept-in-step"
title = "a value kept on the state for drawing has its invariant written where it lives and a test that changes the source"
source = ["CLAUDE.md", "docs/SPEED.md §3"]
when = ["faraday/faraday-core/src/**"]
lines = '^\+.*\b(kept|memo)\b'
kind = "review"

[[rule]]
id = "speed.late-flow-timed"
title = "work added while drawing or after every event is timed in a late-flow session before it is committed"
source = ["CLAUDE.md", "docs/SPEED.md §7"]
when = ["**/screen.rs", "faraday/faraday-core/src/drawing.rs", "faraday/faraday-core/src/screens/**"]
kind = "review"

[[rule]]
id = "speed.budgets"
title = "a frame, a pointer move, a press or a key does only the costly work its budget names"
source = ["CLAUDE.md"]
when = ["**/screen.rs", "faraday/faraday-core/src/drawing.rs", "faraday/faraday-core/src/screens/**"]
kind = "held"
held_by = ["budget-tests"]

# ------------------------------------------------------------- structure

[[rule]]
id = "structure.ratchet-raised"
title = "a ratchet count raised is the owner's decision, recorded in DECISIONS"
source = ["CLAUDE.md", "docs/decisions/F74.md"]
when = ["tools/lint-layout.counts", "tools/lint-tokens.counts", "tools/touch-targets.counts", "tools/lint-upstream.counts", "tools/lint-crypto.counts"]
rises = true
kind = "pair"
with = ["docs/decisions/F{n}.md"]

[[rule]]
id = "structure.code-map"
title = "lib.rs's code map names every module and every screen's file"
source = ["CLAUDE.md", "docs/decisions/F74.md"]
when = ["faraday/faraday-core/src/**"]
kind = "held"
held_by = ["lint-layout"]

[[rule]]
id = "structure.size"
title = "no new file over 2,500 lines or function over 100 lines"
source = ["CLAUDE.md", "docs/decisions/F74.md"]
when = ["**/*.rs"]
kind = "held"
held_by = ["lint-layout"]

[[rule]]
id = "structure.impl-faraday"
title = "Faraday's field count and the files with impl Faraday only fall"
source = ["CLAUDE.md", "docs/decisions/F74.md"]
when = ["faraday/faraday-core/src/**"]
kind = "held"
held_by = ["lint-layout"]

[[rule]]
id = "structure.no-new-mut"
title = "a new *_mut accessor or DerefMut on an area is avoided; the few that exist are listed in STRUCTURE-PASS.md"
source = ["docs/STRUCTURE-PASS.md §7"]
when = ["faraday/faraday-core/src/**"]
lines = '^\+.*(\bfn \w+_mut\(|\bDerefMut\b)'
kind = "pair"
with = ["docs/STRUCTURE-PASS.md"]

[[rule]]
id = "structure.areas-private"
title = "an area's state is a struct with private fields, reached through accessors and its own methods"
source = ["docs/STRUCTURE-PASS.md §7"]
when = ["faraday/faraday-core/src/**"]
kind = "review"

[[rule]]
id = "structure.new-lint"
title = "a new lint in the lint recipe is described in tools/README.md and is a [[check]] of the registry"
source = ["docs/decisions/F74.md"]
when = ["justfile"]
lines = '^\+ {4}(tools/(lint|check)-|python3 (-[IB] )*tools/lint|cargo (run -q -p costs-lint|deny|vet))'
kind = "pair"
with_each = ["tools/README.md", "tools/impact.toml"]
held_by = ["impact-check", "impact-lint"]
misses = "whether the lint's description in tools/README.md says what it holds"

# --------------------------------------------------------------- strings

[[rule]]
id = "strings.one-file"
title = "every user-facing string is in faraday-strings/src/en.rs"
source = ["CLAUDE.md", "docs/decisions/F68.md"]
when = ["faraday/**/src/**"]
kind = "held"
held_by = ["lint-strings"]

[[rule]]
id = "strings.guide-names"
title = "a string renamed is renamed in the guide's bold names"
source = ["CLAUDE.md", "tools/README.md"]
when = ["faraday/faraday-strings/src/en.rs"]
kind = "held"
held_by = ["lint-guide"]

[[rule]]
id = "strings.no-explanation"
title = "a working screen carries labels, values and actions, never an explanation; Learn and About explain"
source = ["CLAUDE.md", "docs/decisions/F112.md"]
when = ["faraday/faraday-strings/src/en.rs"]
kind = "review"

[[rule]]
id = "strings.plain"
title = "text anywhere in the product is plain statement of fact, never mannered prose"
source = ["CLAUDE.md", "docs/DESIGN.md §2"]
when = ["faraday/faraday-strings/src/en.rs", "docs/learn/**", "docs/guide/**"]
kind = "review"

[[rule]]
id = "strings.medium"
title = "the medium's words come from Medium; \"SD card\" where it is one"
source = ["docs/decisions/F4.md"]
when = ["faraday/faraday-strings/src/en.rs"]
kind = "review"

# ---------------------------------------------------------------- design

[[rule]]
id = "design.material3"
title = "a screen or component change names the Material 3 page it was checked against"
source = ["CLAUDE.md", "docs/decisions/F91.md", "docs/decisions/F92.md", "docs/decisions/F108.md"]
when = ["**/screen.rs", "faraday/faraday-core/src/screens/**", "core/faraday-draw/src/widgets/**", "faraday/faraday-ui/**", "faraday/faraday-starter/src/**"]
kind = "trailer"
trailer = "Material"
misses = "whether the page named is the right one"

[[rule]]
id = "design.touch-targets"
title = "every press target is at least 48 dp, or listed with its case"
source = ["docs/decisions/F152.md", "docs/decisions/F108.md", "docs/M3-CHECKS.md §3"]
when = ["**/screen.rs", "faraday/faraday-core/src/screens/**", "faraday/faraday-ui/**", "faraday/shells/snapshot/src/tours/**", "faraday/faraday-starter/src/draw/**", "faraday/faraday-starter/src/draw.rs", "faraday/faraday-starter/src/sheets/**", "faraday/faraday-starter/src/sheets.rs", "faraday/faraday-starter/examples/snap.rs"]
kind = "held"
held_by = ["touch-targets"]

[[rule]]
id = "design.press-layers"
title = "a press is made only through faraday-ui's press constructor, which draws its state layers"
source = ["docs/decisions/F152.md", "docs/M3-CHECKS.md §4"]
when = ["faraday/faraday-ui/src/**", "**/screen.rs", "faraday/faraday-core/src/**", "faraday/faraday-starter/src/**"]
kind = "held"
held_by = ["clippy"]
misses = "a Plain case chosen where a layer was owed; a layer in the wrong ink"

[[rule]]
id = "design.left-out"
title = "none of F111's left-out components is added"
source = ["docs/decisions/F111.md"]
when = ["**/screen.rs", "faraday/faraday-core/src/screens/**", "core/faraday-draw/src/widgets/**", "faraday/faraday-ui/**"]
kind = "review"

[[rule]]
id = "design.new-component"
title = "a new component is in DESIGN.md §4"
source = ["CLAUDE.md"]
when = ["core/faraday-draw/src/widgets/*.rs"]
on = ["add"]
kind = "pair"
with = ["docs/DESIGN.md"]

[[rule]]
id = "design.new-screen"
title = "a new Screen or Sheet is in DESIGN.md §5 and CLAUDE.md's count"
source = ["CLAUDE.md"]
when = ["faraday/faraday-core/src/lib.rs"]
lines = '^\+ {4}[A-Z][A-Za-z0-9]*(\(.*\)|\s*\{.*\})?,\s*(//.*)?$'
kind = "pair"
with_each = ["docs/DESIGN.md"]
misses = "CLAUDE.md's count of screens, which a new Sheet leaves unchanged"

[[rule]]
id = "design.demo-matches"
title = "Faraday Demo differs from the device only by a decision"
source = ["docs/decisions/F117.md"]
when = ["faraday/shells/window/**", "faraday/faraday-core/src/host/**"]
kind = "review"

[[rule]]
id = "design.maker-pages"
title = "the Starter's maker pages show several families at once, no model, no maker's screenshot or name"
source = ["docs/decisions/F14.md", "docs/decisions/F18.md"]
when = ["docs/learn/faraday/boot/**", "faraday/faraday-starter/src/**"]
kind = "review"

# ---------------------------------------------------------------- tokens

[[rule]]
id = "tokens.named"
title = "a new dimension is a name in tokens.rs; numbers written in screens only fall"
source = ["CLAUDE.md"]
when = ["core/faraday-draw/src/**", "faraday/faraday-core/src/screens/**", "**/screen.rs"]
kind = "held"
held_by = ["lint-tokens"]

# ---------------------------------------------------------------- themes

[[rule]]
id = "themes.generated"
title = "the colour tables are what the vendored material-color-utilities makes"
source = ["docs/THEMES.md"]
when = ["faraday/faraday-ui/src/pal/**", "tools/themes/**"]
kind = "held"
held_by = ["lint-themes"]

# ----------------------------------------------------------------- guide

[[rule]]
id = "guide.screens-named"
title = "every Screen and Sheet variant is named by one guide page or the To write list"
source = ["tools/README.md"]
when = ["faraday/faraday-core/src/lib.rs"]
kind = "held"
held_by = ["lint-guide"]

[[rule]]
id = "guide.pictures"
title = "the guide's pictures are drawn again when a screen changes"
source = ["docs/GUIDE.md"]
when = ["**/screen.rs", "faraday/faraday-core/src/screens/**"]
kind = "review"
consumers = ["website.guide"]

# ----------------------------------------------------------------- learn

[[rule]]
id = "learn.sync"
title = "docs/learn/ and the Learn pages' en.rs are one text"
source = ["CLAUDE.md"]
when = ["docs/learn/**", "faraday/faraday-learn/src/pages/en.rs"]
kind = "held"
held_by = ["learn-sync"]

# ------------------------------------------------------------------ deps

[[rule]]
id = "deps.vetted"
title = "every dependency passes cargo vet and cargo deny"
source = ["CLAUDE.md", "docs/decisions/F71.md"]
when = ["**/Cargo.toml", "Cargo.lock"]
kind = "held"
held_by = ["cargo-vet", "cargo-vet-fuzz", "cargo-vet-faraday-fuzz", "cargo-deny"]

[[rule]]
id = "deps.page"
title = "a direct dependency added has its page in docs/deps/"
source = ["docs/decisions/F71.md"]
when = ["**/Cargo.toml"]
lines = '^\+(?!(name|version|edition|license|description|publish|rust-version|authors|default-run|default-features|features|resolver|members|repository|readme|exclude|include|build|path|harness|test|bench|doc|crate-type|required-features|workspace|optional|package|git|branch|rev|tag)\b)(?!.*\bpath\s*=)[a-z][a-z0-9_-]*\s*=\s*(\{|")'
kind = "pair"
with = ["docs/deps/*.md"]
misses = "a version bump of an existing dependency also matches; the page of the new name is not matched by name; a path dependency on a workspace crate has no page and is not matched"

[[rule]]
id = "deps.locked"
title = "builds and checks pass --locked"
source = ["CLAUDE.md", "docs/decisions/F71.md"]
when = ["justfile", "faraday/faraday.just", "**/*.sh"]
lines = '^\+.*\bcargo (build|test|run|nextest|clippy|check|doc)\b(?!.*--locked)'
kind = "review"

# ---------------------------------------------------------------- builds

[[rule]]
id = "builds.list"
title = "faraday/builds.toml lists every build, and every board and panel directory is named by one"
source = ["faraday/builds.toml"]
when = ["faraday/builds.toml", "faraday/image/boards/**", "faraday/image/panels/**"]
kind = "held"
held_by = ["lint-builds"]

[[rule]]
id = "builds.docs"
title = "a build added or changed is in docs/IMAGES.md or docs/DEVELOPING.md"
source = ["faraday/builds.toml"]
when = ["faraday/builds.toml"]
lines = '^[+-]\[\[(build|hardware)\]\]'
kind = "pair"
with = ["docs/IMAGES.md", "docs/DEVELOPING.md"]
consumers = ["website.download"]

# ------------------------------------------------------------------ fuzz

[[rule]]
id = "fuzz.parser-target"
title = "a parser of untrusted input has its fuzz target in the same change"
source = ["tools/README.md"]
when = ["core/*/src/**", "faraday/**/src/**", "!core/faraday-draw/**"]
lines = '^\+.*\bfn\s+(parse|decode|read|from_bytes|from_str|deserialize)\w*'
kind = "review"
misses = "planned: F148's fuzz check"

# --------------------------------------------------------------- release

[[rule]]
id = "release.before"
title = "before a release: just, just crosscheck --fresh, the fuzz run and its corpus"
source = ["tools/README.md"]
at = "release"
when = ["**"]
kind = "review"

# ---------------------------------------------------------------- impact

[[rule]]
id = "impact.registry"
title = "the registry reads, matches the tree and the lint recipe, and docs/CHECKS.md follows it"
source = ["docs/decisions/F149.md"]
when = ["tools/impact.toml"]
kind = "held"
held_by = ["impact-lint", "impact-check", "impact-docs"]

[[rule]]
id = "impact.rules-indexed"
title = "a new rule line in CLAUDE.md is a new rule in the registry in the same commit"
source = ["docs/decisions/F149.md"]
when = ["CLAUDE.md"]
lines = '^\+- '
kind = "pair"
with = ["tools/impact.toml"]
