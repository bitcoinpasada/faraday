# What tools/lint-standards.py holds docs/STANDARDS.md §0 against: the
# cryptography the F79 cross-check's stamp does not cover, the work kept out
# of the app, every hold with its decision (F136), and the disagreements of
# STANDARDS §8. A new entry is the change's author's statement, reviewed
# with it (standards.what-goes-in, standards.no-way-past).

# ------------------------------------------------------------ uncovered
# A crate whose normal dependencies include a primitive crate, or that has
# a function the crypto inventory finds cryptographic, and that is not in
# tools/crosscheck/stamp.py's CRATES; in faraday-core, a file not in its
# FILES. A change here does not stale the stamp. Each says why.

