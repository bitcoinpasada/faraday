# A way past that is neither a hold nor a level. Each names a file and a
# pattern that must still match; a new one of this kind cannot be found by a
# pattern and is covered by review rule standards.no-way-past.

[[way_past]]
what = "The dev image"
decision = "F136"
case = "A developer's own build, with a serial console: the dev variant's inittab starts a getty beside the app"
file = "faraday/image/variants/dev/inittab.in"
pattern = 'respawn:/sbin/getty'

[[way_past]]
what = "The dev image's build script"
decision = "F136"
case = "A developer's own build: the image build's dev variant is the build that carries the serial console"
file = "faraday/image/build.sh"
pattern = 'parts\+=\("\$dev_dir"\)'

[[way_past]]
what = "I have its rescue disk or password"
decision = "F136"
case = "The Starter, beside another encryption product: the person holds the way back into that disk"
file = "faraday/faraday-starter/src/lib.rs"
pattern = 'StarterAction::Rescue => \{\n\s*if self\.page == Page::Start \{\n\s*self\.other_confirmed = true'

[[way_past]]
what = "Skip the quiz"
decision = "F136"
case = "The person's own backup: the quiz is skipped by a second press"
file = "faraday/faraday-core/src/keygen/area.rs"
pattern = 'A::KSkip => \{\n\s*if k\.skip_ask \{\n\s*k\.skipped = true'

[[way_past]]
what = "Skip the codex32 check"
decision = "F136"
case = "The person's own backup: the codex32 check is skipped by a second press"
