where = "app"
file = "faraday/faraday-core/src/action.rs"
function = "is_hold"

[[hold_source]]
where = "starter"
file = "faraday/faraday-starter/src/scroll.rs"
function = "is_hold"
arms = true

[[hold_source]]
where = "signing"
file = "core/faraday-psbt/src/inspect.rs"
function = "is_holdable"

