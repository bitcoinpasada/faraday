# ------------------------------------------------------- STANDARDS §8
# One entry per bullet of STANDARDS §8: the text, in each file named,
# that makes the disagreement. When a fix removes it, the bullet and the
# entry go together.

# ------------------------------------------------- cautions, notes, ways past
# F136's table also lists ways past that are not holds. A `[[caution]]` is a
# warning kind the code makes at Level::Caution (core/faraday-psbt/src/
# inspect.rs, and signer.rs's Kind::level): it still signs. A `[[note]]` is a
# kind whose levels include Info and not Caution. Each names the decision and
# the case of F136's table; the lint fails on one the code makes that is not
# listed, and on one the code no longer makes at that level.

[[caution]]
kind = "WarningKind::UnknownDerivation"
decision = "F136"
case = "Signs with a caution: a path under no loaded account, or the key in a script other than its account's; keys used at other paths, signing derives and checks the key itself"

[[caution]]
kind = "WarningKind::UnsupportedInput"
