# ----------------------------------------------------------- out of app
# STANDARDS §0: work whose standard is unpublished, or whose construction
# is Faraday's own and unreviewed, stays in the repository, built and
# tested, and no shipped code of the app reaches it. Its roots are the
# manifest action's `functions`, or the ids given.

[[out_of_app]]
what = "Sending to silent payments (STANDARDS §0.1: BIP 374 and BIP 375 are drafts)"
decision = "F109"
action = "silent-send"

# The app's crates never name the secret nonce's type, so none of them can
# keep one (the vault, a file); faraday-psbt's session holds it in memory
# for one transaction. Reading one back from bytes is reached by no app
# code. (`SecNonce::serialize` is not a root: the inventory resolves a
# method call by its name, and every `pk.serialize()` in musig.rs would
# stand for it.)
[[out_of_app]]
what = "MuSig2 signing across places (STANDARDS §0.1): a secret nonce is never kept or read back"
decision = "F109"
functions = ["core/faraday-bip/src/musig.rs::SecNonce::from_bytes"]
unnamed = '(?<![:\w])SecNonce\b|musig::SecNonce\b'

