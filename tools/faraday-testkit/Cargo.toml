faraday-files = { path = "../../core/faraday-files" }
faraday-fat = { path = "../../core/faraday-fat" }
faraday-vault = { path = "../../core/faraday-vault" }
faraday-keys = { path = "../../core/faraday-keys" }
faraday-strings = { path = "../../core/faraday-strings" }
