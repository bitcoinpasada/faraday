# The copies of a test secret the leak tests let through
# (docs/SECRET-LEAKS.md §7, §9; tests in faraday/faraday-core/tests/leaks).
# One [[entry]] per copy:
#   flow   the leak test that finds it
#   form   the form of the secret found (tests/leaks/forms.rs)
#   place  the function, as a backtrace names it, that frees the block
#          (one of the first frames after the allocator's and the
#          standard library's own)
#   reason what bounds the copy: the restart at every lock (F181 point 2)
#   fix    the repository path that removes it, or "none planned yet"
# An entry its flow no longer hits fails the test; a block still live
# after Lock is never let through.

[[entry]]
flow = "core wallet read"
form = "core master chain code"
place = "parse_xkey_deriv"
reason = "miniscript's parsing of a descriptor key (bitcoin's base58 decoding of the xpub, in a library) frees the decoded bytes, which hold the chain code, unwiped; the descriptor's text must reach miniscript as it is for the reader to accept what it accepts now, and miniscript decodes the key itself; the copy lives until the process restarts at every lock (F181 point 2)"
fix = "none planned yet"
