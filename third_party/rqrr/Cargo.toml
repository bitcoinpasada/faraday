# rqrr 0.11.0, vendored into this repository. What changed and why is in
# OPENSIGNER.md beside this file; upstream is
# https://github.com/WanzenBug/rqrr. The version number is upstream's and
# is not bumped by our changes.
#
# Edits to the manifest: the `image` dev-dependency and the tests in
# `src/detect.rs` that used it are gone, so the crate resolves against the
# workspace lock file without adding anything to it; and the `g2p` and
# `lru` dependencies are gone with the code that used them, which leaves
# the crate with no dependencies at all. `image` stays optional and off.

[package]
edition = "2021"
rust-version = "1.85.1"
name = "rqrr"
version = "0.11.0"
authors = ["WanzenBug <moritz@wanzenbug.xyz>"]
build = false
include = [
    "/README.md",
    "/LICENSE-*",
    "/src/**/*.rs",
    "/src/**/*.png",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Detect and read QR codes from any image source
"""
documentation = "https://docs.rs/rqrr/"
readme = "README.md"
keywords = [
    "qrcode",
    "detection",
]
categories = [
    "graphics",
    "encoding",
]
license = "(MIT OR Apache-2.0) AND ISC"
repository = "https://github.com/WanzenBug/rqrr"

[features]
default = ["img"]
img = ["image"]

[lib]
name = "rqrr"
path = "src/lib.rs"

[dependencies.image]
version = ">= 0.24, <= 0.25"
optional = true
default-features = false

