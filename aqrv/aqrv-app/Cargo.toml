[package]
name = "aqrv-app"
version = "0.2.0"
description = "The Argon QR Vault's screens (AQRV specification, https://github.com/bitcoinpasada/aqrv)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
aqrv = { path = "../aqrv" }
faraday-bip = { path = "../../core/faraday-bip" }
faraday-ui = { path = "../../faraday/faraday-ui" }
faraday-draw = { path = "../../core/faraday-draw" }
faraday-shell-api = { path = "../../core/faraday-shell-api" }
faraday-strings = { path = "../../faraday/faraday-strings", features = ["aqrv"] }
faraday-codec = { path = "../../core/faraday-codec" }
faraday-crypto = { path = "../../core/faraday-crypto" }
faraday-files = { path = "../../faraday/faraday-files" }
png.workspace = true
zeroize.workspace = true

[lints]
workspace = true
