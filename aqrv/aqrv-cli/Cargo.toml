[package]
name = "aqrv-cli"
version = "0.2.0"
description = "The Argon QR Vault's command line (AQRV specification, https://github.com/bitcoinpasada/aqrv)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "aqrv"
path = "src/main.rs"

[dependencies]
aqrv = { path = "../aqrv" }
faraday-bip = { path = "../../core/faraday-bip" }
faraday-codec = { path = "../../core/faraday-codec" }
faraday-crypto = { path = "../../core/faraday-crypto" }
faraday-files = { path = "../../faraday/faraday-files" }
faraday-text = { path = "../../core/faraday-text" }
getrandom.workspace = true
zeroize.workspace = true

[lints]
workspace = true
