# The fuzz targets (`docs/PLANNING.md` §12, security review M5). This is
# its own workspace, excluded from the root one, so that a nightly
# `cargo fuzz` build with sanitizer flags never shares a target directory
# or a resolved lock file with the pinned 1.97.0 workspace build.
[package]
name = "faraday-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
faraday-bip = { path = "../core/faraday-bip" }
faraday-codec = { path = "../core/faraday-codec" }
faraday-psbt = { path = "../core/faraday-psbt" }
faraday-crypto = { path = "../core/faraday-crypto", features = ["unchecked"] }
faraday-backup = { path = "../core/faraday-backup" }
faraday-pgp = { path = "../faraday/faraday-pgp" }

[profile.release]
debug = true

[[bin]]
name = "classify"
path = "fuzz_targets/classify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seedqr"
path = "fuzz_targets/seedqr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ur_receive"
path = "fuzz_targets/ur_receive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "psbt_parse"
path = "fuzz_targets/psbt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy"
path = "fuzz_targets/policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_verify"
path = "fuzz_targets/message_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xkey"
path = "fuzz_targets/xkey.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_luma"
path = "fuzz_targets/decode_luma.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pgp_armor"
path = "fuzz_targets/pgp_armor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false
