# `third_party/rqrr` is a dependency, not a member: it is vendored
# third-party code and neither `cargo fmt` nor `clippy -D warnings`
# should be applied to it. `cargo fmt --all` also formats path
# dependencies, so the copy carries a `rustfmt.toml` that turns
# formatting off.
exclude = ["third_party/rqrr"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/bitcoinpasada/faraday"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Rendering (docs/deps/tiny-skia.md): pure Rust, no_std with `no-std-float` (libm).
tiny-skia = { version = "0.12", default-features = false, features = ["no-std-float"] }

zeroize = { version = "1.8", default-features = false, features = ["derive"] }

subtle = { version = "2.6", default-features = false }

sha2 = { version = "0.11", default-features = false }

hmac = { version = "0.13", default-features = false }

pbkdf2 = { version = "0.13", default-features = false }

# Argon2id for the key kept on the device (docs/deps/argon2.md).
# `default-features = false` drops the `password-hash` string format and the RNG; the memory is a `Vec<Block>`
# the caller owns, so no `alloc` feature is needed.
argon2 = { version = "0.6", default-features = false, features = ["zeroize"] }

# Hex, one module (docs/deps/base16ct.md): `faraday_crypto::hex`, and
# the crates that call base16ct directly: `faraday-pgp` (paperkey's
# `upper` and `mixed`) and `faraday-payload`.
base16ct = { version = "1.0", default-features = false, features = ["alloc"] }

# Base64 in four places (docs/deps/base64ct.md): PSBT, BIP-322, BSMS,
# BIP-85, the OpenPGP armour and KDBX.
base64ct = { version = "1.8", default-features = false, features = ["alloc"] }

# AES's round function alone, for AEZ, which aezeed enciphers with
# (docs/deps/aes.md). `hazmat` is the feature that exposes the round; it
# builds on `cipher` 0.5, `cpufeatures` and `cpubits`, already in the
# lock file.
aes = { version = "0.9", default-features = false, features = ["hazmat", "zeroize"] }

# rust-bitcoin without `std`: no_std + alloc. Brings `secp256k1` (docs/deps/bitcoin.md).
# `secp-recovery` is a feature of the same crate, not another dependency:
# it turns on libsecp256k1's public-key recovery and rust-bitcoin's
# `sign_message` signature type, which BIP-137 needs to check a message
# signature against an address (§9, `faraday_psbt::message`). Nothing else in
# the graph changes.
bitcoin = { version = "0.32", default-features = false, features = ["secp-recovery"] }

# Miniscript policies and descriptors (§16; docs/deps/miniscript.md).
# The 12.x line is the one that pairs with `bitcoin` 0.32.
# `default-features = false` with `no-std` keeps the core `no_std` +
# `alloc`; `compiler` is the concrete-policy compiler the Tools ›
# Miniscript screen calls.
miniscript = { version = "12.0", default-features = false, features = ["no-std", "compiler"] }

# QR decoding. `rqrr` needs std.
#
# `rqrr` is the copy in `third_party/rqrr`, not the crates.io release.
# Upstream's `Perspective::map` asserts that the mapped point fits in an
# `i32`, and a camera frame with a near-degenerate capstone group trips
# that assertion during grid detection: on the Pi, built with
# `panic = "abort"`, a printed sheet held in front of the camera powers
# the device off. The copy returns `None` there and every caller rejects
# the candidate grid; it is also trimmed of `lru`, `g2p` and the
# proc-macro behind it. `third_party/rqrr/PATCHES.md` records what was
# changed.
#
# It is a path dependency rather than a `[patch.crates-io]` because Cargo
# applies a patch only in the workspace being built: a project that
# depends on a crate of this repository by git would otherwise get the
# crates.io release.
rqrr = { path = "third_party/rqrr", default-features = false }

# NFKD of a typed BIP-39 sentence before its words are matched, as BIP-39
# requires (`faraday_bip::bip39::Mnemonic::parse`;
# docs/deps/unicode-normalization.md). no_std with `alloc`; the tests and
# tools that wrote NFKD forms before use the same crate.
unicode-normalization = { version = "0.1", default-features = false }

png = "0.18"

# Adler-32 of the zlib stream faraday-codec writes (docs/deps/adler2.md).
adler2 = { version = "2.0.1", default-features = false }

# Camera capture on Linux (§16.33; docs/deps/libc.md): the C type and
# constant declarations the raw V4L2 ioctls need. Used by
# `faraday-v4l2`, and by `faraday-disk` for `O_DIRECT` alone.
libc = { version = "0.2", default-features = false }

# Dev-dependencies (test-only; never in a release binary).
bip39 = { version = "2.2", default-features = false, features = ["all-languages", "zeroize"] }
# Property tests of the backup forms (docs/deps/proptest.md): no `fork`, no
# `timeout`; each test sets its own cases, a fixed seed and no persistence.
proptest = { version = "1.9", default-features = false, features = ["std"] }

# JSON, behind faraday-bip's reader (docs/deps/serde_json.md); a member that
# needs `std` asks for it.
serde = { version = "1.0", default-features = false, features = ["alloc"] }

serde_json = { version = "1.0", default-features = false, features = ["alloc", "float_roundtrip"] }

# The KDBX 4 stream cipher (docs/deps/chacha20.md): KDBX encrypts its
# body and its inner random stream with plain ChaCha20 (RFC 8439).
chacha20 = { version = "0.10", default-features = false, features = ["cipher", "zeroize"] }
# Poly1305 (RFC 8439) for the one message of Core Lightning's encrypted
# hsm_secret, libsodium's secretstream (docs/deps/poly1305.md).
poly1305 = { version = "0.9", default-features = false, features = ["zeroize"] }

# KEF (docs/KEF.md §11): AES-256 in CTR and GCM over the `aes` above.
# `hazmat` is the feature that allows GCM's 4-byte tag (docs/deps/aes-gcm.md).
ctr = { version = "0.10", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "hazmat"] }

# The Starter's xz decoder (docs/STARTER.md §1.3; docs/deps/lzma-rust2.md),
# used by `faraday-payload` alone. Pure Rust: Faraday never links
# liblzma. `default-features = false` drops the encoder, lzip and the
# `optimization` feature, the crate's only `unsafe`, so it builds under
# its own `forbid(unsafe_code)`. `xz` brings `sha2` 0.11, already in the
# graph; no other crate enters it.
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }

# Dependencies are optimized even in dev builds so that PBKDF2-heavy tests
# run in seconds; workspace crates stay unoptimized for debugging. This
# does not affect release builds.
#
# Debug info is file and line tables only: a panic's backtrace still names
# the file and line, and the test binaries are smaller than with full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# The domain crates that the tests drive thousands of times.
[profile.dev.package.faraday-crypto]
opt-level = 2
[profile.dev.package.faraday-bip]
opt-level = 2
[profile.dev.package.faraday-codec]
opt-level = 2
[profile.dev.package.faraday-psbt]
opt-level = 2
[profile.dev.package.faraday-entropy]
opt-level = 2

[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
debug = 0

# A fade's step and the stick's frame for the panel, at speed rather than
# size: both are loops over every byte of the frame, which opt-level "s"
# does not vectorise. At 1366 × 768 on the build machine a blend is
# 2.0 ms at "s" and 0.5 at 3, and the panel conversion 0.8 and 0.5
# (2026-10-22).
[profile.release.package.faraday-draw]
opt-level = 3
[profile.release.package.faraday-stick]
opt-level = 3

# The parsers of what the device takes in (a PSBT, a file, a QR code, the
# stick's file system) add and multiply lengths they read from that input.
# A release build does not check arithmetic overflow by default, so a wrap
# would read on at a wrong bound; with the checks on, a wrap stops the app
# (`panic = "abort"`) rather than reading on. The device and its images
# build with this profile.
[profile.release.package.faraday-bip]
overflow-checks = true
[profile.release.package.faraday-codec]
overflow-checks = true
[profile.release.package.faraday-fat]
overflow-checks = true
[profile.release.package.faraday-psbt]
overflow-checks = true
