
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.rqrr]
audit-as-crates-io = false
notes = "Vendored in third_party/rqrr and patched (PATCHES.md): first-party code, reviewed as such (F71)"

[[exemptions.arrayvec]]
version = "0.7.8"
criteria = "safe-to-deploy"

[[exemptions.bip39]]
version = "2.2.2"
criteria = "safe-to-run"

[[exemptions.bitflags]]
version = "2.13.2"
criteria = "safe-to-deploy"

[[exemptions.core_detect]]
version = "1.0.0"
criteria = "safe-to-run"
notes = "not reviewed; a dev-dependency of the backup property tests only (docs/deps/proptest.md), in no shipped binary"

[[exemptions.crc32fast]]
version = "1.5.1"
criteria = "safe-to-deploy"

[[exemptions.crypto-primes]]
version = "0.7.2"
criteria = "safe-to-deploy"
notes = "F71: not reviewed by a person; read by an AI model (docs/deps/crypto-primes.md); its publisher is not one F71 trusts"

[[exemptions.flagset]]
